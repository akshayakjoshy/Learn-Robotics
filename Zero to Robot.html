W({title:"Control and PID",tag:"Feedback, on-off, P, PI, PID, tuning, line following, state machines.",badge:"Steady Hand",level:"Advanced",
desc:"Make Bolt smooth and precise. Feedback control is the secret behind drones that hover, arms that stop exactly, and robots that follow lines.",
lessons:[
{t:"Open loop vs closed loop",
story:`<p>Bolt wants to drive 1 metre. <b>Open loop</b>: “run the motors for 2 seconds and hope.” If the battery is low or the floor is carpet, Bolt stops short. Nobody checks. A toaster on a timer is open loop.</p>
<p><b>Closed loop</b>: Bolt measures how far it has gone (with encoders) and keeps correcting until it reaches 1 metre. This checking is called <b>feedback</b>.</p>
<p>The words: the <b>setpoint</b> is the target. The <b>measurement</b> is what the sensor says. The <b>error</b> is <span class="f">error = setpoint − measurement</span>. The <b>controller</b> decides what to do. The <b>plant</b> is the thing being controlled (the motor and wheels). Your own hand reaching for a cup is closed-loop control. Your eyes give feedback the whole way!</p>`,
points:["Open loop: act without checking. Closed loop: measure and correct.","Error = setpoint (target) − measurement.","Controller → plant → sensor → back to controller: the feedback loop.","Closed loop handles surprises: hills, low battery, carpet.","Servos, cruise control, thermostats are closed loop."],
game:{type:"bins",bins:["Open loop","Closed loop"],items:[["Washing machine on a fixed timer",0],["Room AC with a thermostat",1],["Servo holding its angle",1],["Stepper motor without an encoder",0],["Robot driving straight using a gyro",1],["“Run motors for 2 seconds”",0],["Drone holding its height with a barometer",1],["Microwave set to 1 minute",0]]},
quiz:[{q:"What makes a system closed-loop?",o:["It measures the result and corrects","It has a round shape","It uses a loop in code"],why:"Feedback is the key."},
{q:"Target 100, measured 70. The error is…",o:["30","170","−30"],why:"error = setpoint − measurement = 100 − 70."},
{q:"In control, the “plant” is…",o:["The thing being controlled, like a motor","A green leaf","The battery charger"],why:"Plant means the system you control."}]},

{t:"On-off (bang-bang) control",
story:`<p>The simplest controller has only two moves: <b>full ON</b> or <b>full OFF</b>. Too cold? Heater fully on. Too hot? Heater off. This is <b>bang-bang</b> control. Fridges and water tank pumps use it.</p>
<p>A line follower with one sensor can do it too: “On the line? Turn right fully. Off the line? Turn left fully.” It works, but Bolt <b>zigzags</b> wildly. It keeps swinging past the target. That swinging is <b>oscillation</b>.</p>
<p>If the switching is too fast, it <b>chatters</b> and wears out relays. Adding a small gap, called <b>hysteresis</b> (a deadband), helps: switch ON below 24 °C but OFF only above 26 °C.</p>`,
points:["Bang-bang: only full ON or full OFF.","Simple, but it oscillates around the target.","Hysteresis: a gap between the ON and OFF points stops chattering.","Good for slow things like heaters and fridges.","For smooth motion, use proportional control (next lesson)."],
code:{lang:"cpp",src:`
// Bang-bang heater with hysteresis
float temp = readTemp();
if (temp < 24.0) heaterOn  = true;    // too cold: full on
if (temp > 26.0) heaterOn  = false;   // too hot: full off
// between 24 and 26: keep doing what we were doing
digitalWrite(HEATER_PIN, heaterOn);`},
game:{type:"match",pairs:[["Setpoint","The target you want"],["Error","Target minus what you measure"],["Bang-bang","Full ON or full OFF only"],["Hysteresis","A gap so it does not switch too often"],["Oscillation","Swinging back and forth around the target"],["Chattering","Switching on and off too fast"]]},
quiz:[{q:"What is the main problem with bang-bang control for robots?",o:["It zigzags (oscillates) around the target","It is too complicated","It needs GPS"],why:"Always full on or off, so it overshoots both ways."},
{q:"Hysteresis means…",o:["A gap between the ON and OFF switching points","A type of motor","Very fast switching"],why:"It stops chattering."},
{q:"Which is a good use for bang-bang control?",o:["A fridge","A drone hovering","A surgical robot"],why:"Slow, simple systems are fine with on-off."}]},

{t:"P control: push harder when far away",
story:`<p>When you park a cycle, you pedal hard when far from the spot and gently when close. That is <b>proportional control</b>: the correction is proportional to the error. <span class="f">output = Kp × error</span></p>
<p><b>Kp</b> is the “gain”, a number you choose. Small Kp: gentle and slow, it may never quite get there. Big Kp: fast and strong, but it <b>overshoots</b> and wobbles.</p>
<p>P control has one weakness. If something pushes back steadily (a hill, friction, gravity), the robot stops a little short. Near the target the error is small, so the push is small, too small to beat the hill. That leftover gap is the <b>steady-state error</b>. The next lesson fixes it.</p>`,
points:["P control: output = Kp × error.","Small Kp: slow. Big Kp: fast but overshoots and wobbles.","Steady-state error: P alone stops short when a steady force pushes back.","P is the most important term; start tuning with it.","Clamp the output to what the motor can do."],
code:{lang:"cpp",src:`
float Kp = 2.0;
float target = 100;            // e.g. 100 encoder ticks

void loop() {
  float measured = readTicks();
  float error = target - measured;
  float out = Kp * error;
  out = constrain(out, -255, 255);   // motor limit
  setMotor(out);
}`},
game:{type:"calc",problems:[{q:"Kp = 2, target = 100, measured = 80. Output?",a:40},{q:"Kp = 2, target = 100, measured = 110. Output?",a:-20,hint:"error = 100 − 110 is negative"},{q:"Kp = 5, error = 60. Output before clamping?",a:300},{q:"The motor limit is 255. What is the output after clamping?",a:255,tol:0}]},
quiz:[{q:"In P control, a bigger error gives…",o:["A bigger correction","A smaller correction","No correction"],why:"Output = Kp × error."},
{q:"Kp is far too high. The robot…",o:["Overshoots and wobbles","Never moves","Becomes perfectly smooth"],why:"Too much push makes it swing past."},
{q:"A robot on a hill stops a bit short of the target with P control. This gap is…",o:["Steady-state error","Overshoot","Noise"],why:"P alone cannot hold against a steady push."}]},

{t:"PI and PID",
story:`<p>PID has three helpers, each looking at time differently.</p>
<p><b>P (present)</b> looks at the error <i>now</i>. <b>I (past)</b> adds up all the error so far: <span class="f">∫ error dt</span>. If Bolt is stuck a little short for a while, I keeps growing and pushes harder until the gap closes. It removes steady-state error. But too much I causes overshoot, and if the motor is blocked, I can grow huge: this is <b>integral windup</b>. Always limit it.</p>
<p><b>D (future)</b> looks at how fast the error is changing: <span class="f">d(error)/dt</span>. If Bolt is rushing toward the target, D says “slow down!” and brakes early, so it overshoots less. D reacts strongly to noise, so filter the sensor.</p>
<p>Together: <span class="f">output = Kp·e + Ki·∫e dt + Kd·de/dt</span>. Drones, 3D printers, robot arms and self-balancing robots all run PID loops many times per second.</p>`,
points:["P = now. I = past (adds up error). D = future (rate of change).","I removes steady-state error. Limit it to stop windup.","D damps overshoot. Filter noise before D.","output = Kp·e + Ki·∫e·dt + Kd·de/dt.","Run the loop at a steady rate (fixed dt)."],
code:{lang:"cpp",src:`
float Kp = 6, Ki = 3, Kd = 2.5;
float integral = 0, prevError = 0;
unsigned long last = 0;

float pid(float target, float measured) {
  unsigned long now = millis();
  float dt = (now - last) / 1000.0;  last = now;
  if (dt <= 0) dt = 0.001;
  float error = target - measured;
  integral += error * dt;
  integral = constrain(integral, -10, 10);        // anti-windup
  float derivative = (error - prevError) / dt;
  prevError = error;
  return Kp * error + Ki * integral + Kd * derivative;
}`},
game:{type:"match",pairs:[["P term","Reacts to the error now"],["I term","Remembers past error and removes leftover gaps"],["D term","Predicts the future from how fast error changes"],["Integral windup","I grows far too big while stuck"],["Overshoot","Going past the target"],["Settling time","Time until it stays close to the target"]]},
quiz:[{q:"Which PID term removes steady-state error?",o:["I (integral)","D (derivative)","None"],why:"I keeps growing while any error remains."},
{q:"Which term acts like a brake to reduce overshoot?",o:["D (derivative)","I (integral)","Neither"],why:"D opposes fast changes."},
{q:"What is integral windup?",o:["The I term growing huge while the system is stuck","A spring in the motor","Winding the robot’s cable"],why:"Limit or reset the integral to prevent it."}]},

{t:"PID tuning lab",
story:`<p>Now it is your turn to tune. Engineers use a simple recipe:</p>
<p><b>1.</b> Set Ki and Kd to 0. Raise <b>Kp</b> until the response is fast but wobbles a bit. <b>2.</b> Add <b>Kd</b> to calm the wobble and overshoot. <b>3.</b> Add a little <b>Ki</b> to remove the leftover gap. <b>4.</b> Make small changes and test again.</p>
<p>We judge the result by: <b>rise time</b> (how fast it gets close), <b>overshoot</b> (how far it goes past, in %), <b>settling time</b> (until it stays within about 5 %), and <b>steady-state error</b> (gap at the end). There are formal methods like <b>Ziegler–Nichols</b>, but trying, watching and adjusting is what most engineers do. If you know a steady push in advance (like gravity), you can add it directly: that is <b>feedforward</b>, and it makes PID’s job easier.</p>`,
points:["Tuning recipe: Kp first → add Kd → add Ki → fine-tune.","Rise time, overshoot, settling time, steady-state error.","Ziegler–Nichols is a classic tuning method.","Feedforward: add known forces (like gravity) directly.","Change one gain at a time and test."],
game:{type:"pid"},
quiz:[{q:"When tuning, which gain do you usually set first?",o:["Kp","Ki","Kd"],why:"Get a fast response with P, then fix its problems."},
{q:"The response wobbles past the target. Which gain helps most?",o:["Kd","Ki","Neither"],why:"D damps the motion."},
{q:"Adding a known gravity force to the controller output is called…",o:["Feedforward","Feedback","Windup"],why:"You push in advance instead of waiting for error."}]},

{t:"Project: line follower robot",
story:`<p>Time to build a real classic: a <b>line follower</b>. Bolt gets a row of 5 IR sensors under its nose. Each one sees black (1) or white (0).</p>
<p>We turn the sensor pattern into one number: the <b>error</b>. Give the sensors weights −2, −1, 0, +1, +2 from left to right. The weighted average says where the line is: 0 means centred, negative means the line is to the left, positive to the right.</p>
<p>Then a <b>PD controller</b> steers: <span class="f">turn = Kp × error + Kd × (error − lastError)</span>. Left motor = base speed + turn. Right motor = base speed − turn. P alone wobbles more and more on curves. D calms it. Many competition robots skip I because there is no steady push to fight.</p>`,
points:["Sensor array + weights gives a position error.","PD steering: turn = Kp·e + Kd·Δe.","left = base + turn, right = base − turn.","P alone wobbles; D damps it.","Tune at low speed first, then go faster."],
code:{lang:"cpp",src:`
const int S[5] = {A0, A1, A2, A3, A4};
const int W[5] = {-2, -1, 0, 1, 2};
float Kp = 40, Kd = 120, lastErr = 0;
int base = 150;

void loop() {
  int sum = 0, count = 0;
  for (int i = 0; i < 5; i++) {
    bool black = analogRead(S[i]) > 500;
    if (black) { sum += W[i]; count++; }
  }
  if (count == 0) { drive(0, 0); return; }   // line lost
  float err = (float)sum / count;            // -2 .. 2
  float turn = Kp * err + Kd * (err - lastErr);
  lastErr = err;
  drive(base + turn, base - turn);
}`},
game:{type:"linefollow"},
quiz:[{q:"With weights −2 … +2, an error of 0 means…",o:["The line is centred","The robot is lost","Full speed"],why:"Equal pull from both sides."},
{q:"Line followers usually use which controller?",o:["PD","Only I","Bang-bang only"],why:"P to steer, D to stop wobbling."},
{q:"If turn is positive, the left motor gets…",o:["base + turn (faster)","base − turn (slower)","zero"],why:"Faster left wheel turns the robot right."}]},

{t:"State machines",
story:`<p>Bolt has many moods: <b>DRIVE</b>, <b>AVOID</b>, <b>SEARCH</b>, <b>GO HOME</b>, <b>STOP</b>. Bolt is in exactly one at a time. Each mood is a <b>state</b>. <b>Events</b> (like “obstacle closer than 20 cm”) cause <b>transitions</b> to another state. This design is a <b>finite state machine</b> (FSM).</p>
<p>Without it, code becomes a tangle of if-statements (“spaghetti code”). With it, each state has its own small, clear job. In Arduino code use an <b>enum</b> to name the states and a <b>switch</b> to run the right one.</p>
<p>Big robots use <b>behaviour trees</b>, a more flexible tree of tasks and fallbacks, but the idea is the same: organise behaviour clearly.</p>`,
points:["State = what the robot is doing now. Exactly one at a time.","Events trigger transitions between states.","enum + switch-case in code.","Avoids spaghetti code; easy to debug.","Behaviour trees are a bigger, flexible version."],
code:{lang:"cpp",src:`
enum State { DRIVE, AVOID, STOPPED };
State state = DRIVE;
unsigned long avoidStart = 0;

void loop() {
  float d = readDistance();
  switch (state) {
    case DRIVE:
      drive(150, 150);
      if (d < 20) { state = AVOID; avoidStart = millis(); }
      break;
    case AVOID:
      drive(120, -120);                       // spin
      if (millis() - avoidStart > 600 && d > 30) state = DRIVE;
      break;
    case STOPPED:
      drive(0, 0);
      break;
  }
  if (emergencyPressed()) state = STOPPED;    // works from any state
}`},
game:{type:"match",intro:"Bolt is driving. Match each event to the state it should switch to.",pairs:[["Obstacle closer than 20 cm","AVOID"],["Path is clear again","DRIVE"],["Battery below 10 %","GO HOME"],["Emergency stop pressed","STOP"],["Lost the line","SEARCH"]]},
quiz:[{q:"In a state machine, how many states is the robot in at once?",o:["Exactly one","All of them","None"],why:"One current state at a time."},
{q:"What causes a transition?",o:["An event, like a sensor reading","Random chance","The colour of the robot"],why:"Events trigger state changes."},
{q:"Which C feature is handy for naming states?",o:["enum","float","delay"],why:"enum gives readable names to numbers."}]}
]});

W({title:"Robot Maths and Kinematics",tag:"Coordinates, trigonometry, transforms, forward and inverse kinematics, odometry.",badge:"Arm Wrangler",level:"Advanced",
desc:"The maths that tells a robot where its hand is and how to reach a target. It looks scary, but each piece is simple. You will solve real robot arm problems.",
lessons:[
{t:"Coordinates, poses and frames",
story:`<p>To describe where something is, we use <b>coordinates</b>: x (left-right), y (forward-back) and z (up-down). A robot’s <b>pose</b> is its position <i>and</i> which way it faces. On the floor that is <span class="f">(x, y, θ)</span>, where θ (theta) is the heading angle.</p>
<p>A <b>frame</b> is a point of view. The <b>world frame</b> is fixed to the room. The <b>robot frame</b> moves with Bolt: “forward” for Bolt might be “north-east” in the world. Sensors see things in the robot frame. Maps use the world frame. Converting between them is a big part of robotics.</p>
<p>Robots measure angles in <b>radians</b>, not degrees. <span class="f">180° = π rad</span>, so <span class="f">rad = deg × π ÷ 180</span>. 1 radian ≈ 57.3°. Most code functions (sin, cos) expect radians. Angles counter-clockwise are positive (the <b>right-hand rule</b>).</p>`,
points:["Pose on a floor = (x, y, θ). In 3D = position + 3 rotations.","World frame = fixed. Robot frame = moves with the robot.","180° = π radians. rad = deg × π ÷ 180.","sin() and cos() in code use radians.","Counter-clockwise angles are positive."],
game:{type:"calc",problems:[{q:"90° in radians?",a:1.5708,tol:0.005},{q:"π radians in degrees?",a:180,tol:0.5},{q:"About how many degrees is 1 radian?",a:57.3,tol:0.3},{q:"45° in radians?",a:0.7854,tol:0.005}]},
quiz:[{q:"A robot’s pose on a floor is…",o:["(x, y, θ)","Its colour","Its battery level"],why:"Position plus heading."},
{q:"180° equals…",o:["π radians","1 radian","2π radians"],why:"Half a circle is π."},
{q:"A sensor sees an object “1 m in front of me”. That is in which frame?",o:["The robot frame","The world frame","No frame"],why:"It is relative to the robot."}]},

{t:"Trigonometry for robots",
story:`<p>Right-angled triangles are everywhere in robotics. For angle θ: <span class="f">sin θ = opposite ÷ hypotenuse</span>, <span class="f">cos θ = adjacent ÷ hypotenuse</span>, <span class="f">tan θ = opposite ÷ adjacent</span>. Remember “SOH CAH TOA”.</p>
<p>So if Bolt drives 10 m at 30°: it goes <span class="f">10 × cos 30° = 8.66 m</span> in x and <span class="f">10 × sin 30° = 5 m</span> in y. <b>Pythagoras</b> gives distance: <span class="f">d = √(dx² + dy²)</span>.</p>
<p>To find the angle to a goal, use <b>atan2(dy, dx)</b>, not plain atan. atan2 looks at the signs of both numbers, so it gives the correct angle in all four directions (−180° to +180°). It is one of the most used functions in robotics.</p>`,
points:["SOH CAH TOA.","Components: x = d·cos θ, y = d·sin θ.","Distance: √(dx² + dy²).","Angle to a point: atan2(dy, dx), works in all four quadrants.","Code: sin(), cos(), atan2(), sqrt() all use radians."],
code:{lang:"cpp",src:`
// Which way should Bolt face to reach the goal?
float dx = goalX - x;
float dy = goalY - y;
float distance = sqrt(dx * dx + dy * dy);
float angleToGoal = atan2(dy, dx);          // radians
float turn = angleToGoal - heading;          // how much to rotate
while (turn >  PI) turn -= 2 * PI;           // keep in -PI..PI
while (turn < -PI) turn += 2 * PI;`},
game:{type:"calc",problems:[{q:"Distance from (0, 0) to (3, 4)?",a:5},{q:"Angle (degrees) from (0, 0) to (1, 1)?",a:45,tol:0.5},{q:"Bolt drives 10 m at 30°. How far in x?",a:8.66,unit:"m",tol:0.05},{q:"Angle (degrees) from (0, 0) to (−1, 0), using atan2?",a:180,tol:0.5}]},

{t:"Vectors and transformations",
story:`<p>A <b>vector</b> is an arrow: it has a length and a direction. Positions, speeds and forces are vectors. Add vectors tip to tail.</p>
<p>To <b>rotate</b> a point (x, y) by angle θ: <span class="f">x′ = x·cos θ − y·sin θ</span> and <span class="f">y′ = x·sin θ + y·cos θ</span>. Written as a grid of numbers, this is a <b>rotation matrix</b>. To <b>translate</b> (shift), just add the offset.</p>
<p>Here is why it matters. Bolt is at (2, 3), facing 90° (north). Its sensor sees an obstacle 1 m straight ahead, which is (1, 0) in the robot frame. Rotate by 90° → (0, 1). Then add Bolt’s position → <b>(2, 4)</b> in the world. Robots chain rotations and shifts together in one bundle called a <b>homogeneous transform</b> (3×3 in 2D, 4×4 in 3D). In ROS this is handled by a system called <b>TF</b>.</p>`,
points:["Vector = length + direction.","Rotate: x′ = x cos θ − y sin θ, y′ = x sin θ + y cos θ.","Robot → world: rotate by heading, then add position.","Homogeneous transform = rotation + translation in one matrix.","Transforms can be chained: world ← robot ← sensor."],
game:{type:"calc",intro:"Bolt is at (2, 3) facing 90°. Its sensor sees an obstacle 1 m straight ahead, (1, 0) in the robot frame.",problems:[{q:"Rotate (1, 0) by 90°. New x?",a:0,tol:0.01},{q:"New y?",a:1,tol:0.01},{q:"Now add Bolt’s position. Obstacle’s world x?",a:2,tol:0.01},{q:"Obstacle’s world y?",a:4,tol:0.01}]},
quiz:[{q:"To move a sensor reading into the world frame, you…",o:["Rotate by the robot’s heading, then add its position","Only add the position","Multiply by 2"],why:"Rotation, then translation."},
{q:"A homogeneous transform combines…",o:["Rotation and translation","Voltage and current","Colour and size"],why:"Both in one matrix."},
{q:"Rotating (1, 0) by 180° gives…",o:["(−1, 0)","(0, 1)","(1, 0)"],why:"cos 180° = −1, sin 180° = 0."}]},

{t:"Forward kinematics",
story:`<p><b>Forward kinematics</b> (FK) answers: “If I know the joint angles, where is the hand?”</p>
<p>Take Bolt’s 2-link arm: upper arm L1, forearm L2. The shoulder angle is θ1. The elbow angle θ2 is measured from the upper arm. The elbow sits at <span class="f">(L1·cos θ1, L1·sin θ1)</span>. The forearm points at angle θ1 + θ2, so the hand is at:</p>
<p><span class="fbig">x = L1·cos θ1 + L2·cos(θ1 + θ2)
y = L1·sin θ1 + L2·sin(θ1 + θ2)</span></p>
<p>FK always has exactly one answer, and it is easy to compute. For a 6-joint arm we chain one transform per joint (next world: DH parameters).</p>`,
points:["FK: joint angles → hand position.","Add up the links: each link adds L·cos(angle so far) and L·sin(angle so far).","The angle of each link is the sum of the joint angles before it.","FK always has exactly one answer.","For many joints, chain transforms."],
code:{lang:"cpp",src:`
const float L1 = 10, L2 = 8;   // cm

void forwardK(float t1deg, float t2deg, float &x, float &y) {
  float t1 = radians(t1deg), t2 = radians(t2deg);
  x = L1 * cos(t1) + L2 * cos(t1 + t2);
  y = L1 * sin(t1) + L2 * sin(t1 + t2);
}`},
game:{type:"fk"},
quiz:[{q:"Forward kinematics finds…",o:["The hand position from the joint angles","The joint angles from the hand position","The battery voltage"],why:"Angles in → position out."},
{q:"With θ1 = 0° and θ2 = 0°, L1 = 10, L2 = 8, the hand is at…",o:["(18, 0)","(0, 18)","(10, 8)"],why:"The arm is straight along x."},
{q:"How many answers does FK have for one set of angles?",o:["Exactly one","Two","None"],why:"One pose → one hand position."}]},

{t:"Inverse kinematics",
story:`<p><b>Inverse kinematics</b> (IK) is the useful but harder question: “I want the hand <i>here</i>. What angles do I need?”</p>
<p>For the 2-link arm, the <b>law of cosines</b> gives the elbow: <span class="f">cos θ2 = (x² + y² − L1² − L2²) ÷ (2·L1·L2)</span>. Then <span class="f">θ1 = atan2(y, x) − atan2(L2·sin θ2, L1 + L2·cos θ2)</span>.</p>
<p>IK can have <b>two answers</b> (elbow up or elbow down), <b>one answer</b> (arm fully stretched), or <b>no answer</b> (target out of reach). For arms with many joints there can be endless answers, so robots use <b>numerical IK</b>: guess, check with FK, nudge the angles closer, repeat (using the Jacobian, or the CCD method).</p>`,
points:["IK: target position → joint angles.","2-link: law of cosines for θ2, then atan2 for θ1.","Zero, one, two (or infinite) solutions.","Check reach: |L1 − L2| ≤ distance ≤ L1 + L2.","Many joints → numerical IK (iterate and improve)."],
code:{lang:"cpp",src:`
bool inverseK(float x, float y, float &t1, float &t2, bool elbowUp) {
  float c2 = (x*x + y*y - L1*L1 - L2*L2) / (2 * L1 * L2);
  if (c2 < -1 || c2 > 1) return false;        // out of reach
  t2 = acos(c2);
  if (elbowUp) t2 = -t2;
  t1 = atan2(y, x) - atan2(L2 * sin(t2), L1 + L2 * cos(t2));
  return true;                                 // angles in radians
}`},
game:{type:"ik"},
quiz:[{q:"Inverse kinematics finds…",o:["Joint angles from a target position","Hand position from angles","Wheel speeds from GPS"],why:"Position in → angles out."},
{q:"With L1 = 10 and L2 = 8, can the hand reach a point 20 cm away?",o:["No, the maximum reach is 18 cm","Yes, easily","Only with elbow up"],why:"Max reach = L1 + L2."},
{q:"“Elbow up” and “elbow down” are…",o:["Two different IK solutions for the same point","Two different robots","FK and IK"],why:"Both reach the same target."}]},

{t:"Differential drive kinematics",
story:`<p>For a two-wheeled robot with wheel speeds vL and vR, and wheels a distance L apart:</p>
<p><span class="fbig">forward speed  v = (vR + vL) ÷ 2
turning speed  ω = (vR − vL) ÷ L</span></p>
<p>Equal speeds: ω = 0, so it drives straight. Opposite speeds: v = 0, so it spins on the spot. Different speeds: it drives an arc with radius <span class="f">R = v ÷ ω</span>.</p>
<p>To update the pose each small time step dt: <span class="f">x += v·cos θ·dt</span>, <span class="f">y += v·sin θ·dt</span>, <span class="f">θ += ω·dt</span>. Wheel speed from RPM: <span class="f">v = RPM ÷ 60 × π × D</span>.</p>`,
points:["v = (vR + vL) ÷ 2. ω = (vR − vL) ÷ L.","Equal speeds = straight. Opposite = spin. Different = arc.","Turn radius R = v ÷ ω.","Pose update: x += v cos θ dt, y += v sin θ dt, θ += ω dt.","Wheel linear speed = RPM ÷ 60 × π × diameter."],
code:{lang:"cpp",src:`
float x = 0, y = 0, th = 0;     // pose
const float L = 0.15;           // wheel spacing in m

void updatePose(float vL, float vR, float dt) {
  float v = (vR + vL) / 2;
  float w = (vR - vL) / L;
  x  += v * cos(th) * dt;
  y  += v * sin(th) * dt;
  th += w * dt;
}

// inverse: what wheel speeds give v and w?
// vR = v + w*L/2 ;  vL = v - w*L/2`},
game:{type:"diffdrive"},
quiz:[{q:"vL = 3 and vR = 3. The robot…",o:["Drives straight","Spins on the spot","Stops"],why:"ω = 0."},
{q:"vL = −2 and vR = 2. The robot…",o:["Spins on the spot","Drives straight","Drives backwards"],why:"v = 0, ω ≠ 0."},
{q:"A wheel of 0.1 m diameter at 60 RPM moves about…",o:["0.31 m/s","6 m/s","60 m/s"],why:"60 ÷ 60 × π × 0.1 ≈ 0.314 m/s."}]},

{t:"Odometry and dead reckoning",
story:`<p>Close your eyes and walk across a room counting steps. You will end up roughly where you planned, but not exactly. Robots do the same using encoders: this is <b>odometry</b> (or <b>dead reckoning</b>).</p>
<p>Each loop: read how far each wheel moved (dL, dR from ticks). Then: <span class="f">distance d = (dL + dR) ÷ 2</span> and <span class="f">turn Δθ = (dR − dL) ÷ L</span>. Add them to the pose.</p>
<p>The problem is <b>drift</b>. Wheels slip, floors are uneven, wheel sizes are a bit off. Each tiny error adds up, and the error grows the longer Bolt drives. That is why robots also use other sensors (IMU, camera, LiDAR, landmarks) to correct themselves. That is called localization (next world).</p>`,
points:["Odometry = estimate pose from wheel movement.","d = (dL + dR) ÷ 2. Δθ = (dR − dL) ÷ L.","Errors: slip, bumps, wrong wheel size, uneven floor.","Error grows over time (drift).","Correct it with other sensors."],
code:{lang:"cpp",src:`
long lastL = 0, lastR = 0;
const float CM_PER_TICK = 3.1416 * 6.5 / 20;   // wheel circumference / CPR
const float L = 15.0;                          // wheel spacing in cm

void odometry() {
  long tl = ticksL, tr = ticksR;
  float dL = (tl - lastL) * CM_PER_TICK;
  float dR = (tr - lastR) * CM_PER_TICK;
  lastL = tl; lastR = tr;
  float d = (dL + dR) / 2;
  float dth = (dR - dL) / L;
  x  += d * cos(th + dth / 2);
  y  += d * sin(th + dth / 2);
  th += dth;
}`},
game:{type:"calc",problems:[{q:"Both wheels move 50 cm. How far did the robot move?",a:50,unit:"cm"},{q:"The right wheel moves 31.4 cm more than the left, L = 20 cm. Heading change in degrees?",a:90,unit:"°",tol:1,hint:"Δθ = 31.4 ÷ 20 = 1.57 rad"},{q:"Left = 40 cm, right = 60 cm, L = 20 cm. Distance moved?",a:50,unit:"cm"}]},
quiz:[{q:"Why does odometry get worse over time?",o:["Small errors add up (drift)","Encoders get tired","The battery gets heavier"],why:"No outside correction."},
{q:"Odometry uses mainly…",o:["Wheel encoders","GPS","A microphone"],why:"Counting wheel turns."},
{q:"Which can cause odometry error?",o:["Wheel slip on a smooth floor","A blue chassis","Using millis()"],why:"The wheel turns but the robot does not move as much."}]},

{t:"DH parameters, Jacobian and singularities",
story:`<p>Real arms have 6 or 7 joints. Writing FK by hand gets messy. The <b>Denavit–Hartenberg (DH) convention</b> describes each joint with just <b>four numbers</b>: θ (joint angle), d (offset along the joint axis), a (link length) and α (twist between axes). Each row turns into a transform matrix. Multiply them all together and you get the hand’s pose. This is how engineers do FK for any arm.</p>
<p>The <b>Jacobian</b> is a table that links joint speeds to hand speed. It answers: “if I turn each joint a little, how does the hand move?” It is used for smooth straight-line motion and numerical IK.</p>
<p>At some poses the arm loses a direction of movement, for example when it is fully stretched out. This is a <b>singularity</b>. Near it, tiny hand motions need huge joint speeds, which is dangerous. Good motion planners steer away from singularities.</p>`,
points:["DH parameters: θ, d, a, α for each joint.","Multiply the joint transforms to get FK for any arm.","Jacobian: joint speeds ↔ hand speed.","Singularity: arm loses a direction; joint speeds blow up.","A fully stretched arm is at a singularity."],
game:{type:"match",pairs:[["DH parameters","Four numbers that describe each joint"],["θ (theta)","The joint angle"],["a","The link length"],["Jacobian","Links joint speeds to hand speed"],["Singularity","Pose where the arm loses a direction of motion"],["Fully stretched arm","A classic singularity"]]},
quiz:[{q:"How many DH parameters describe each joint?",o:["4","2","10"],why:"θ, d, a, α."},
{q:"What does the Jacobian tell you?",o:["How joint speeds turn into hand speed","The battery voltage","The robot’s colour"],why:"It is the speed relationship."},
{q:"Why avoid singularities?",o:["Joint speeds can become huge and unsafe","They make the arm lighter","They are illegal"],why:"The maths blows up near them."}]}
]});

/* ---------------- WORLD 11 ---------------- */
W({title:"Navigation and Mapping",tag:"Localization, sensor fusion, Kalman filter, maps, A*, obstacle avoidance, SLAM.",badge:"Pathfinder",level:"Advanced",
desc:"Teach Bolt to know where it is, build maps, and find the best way to a goal. This is how robot vacuums, delivery robots and self-driving cars find their way.",
lessons:[
{t:"Localization: where am I?",
story:`<p>Robots never know <i>exactly</i> where they are. They keep a <b>best guess</b> plus a feeling of how unsure they are: the <b>uncertainty</b>. This is called the robot’s <b>belief</b>.</p>
<p>Some clues <b>drift</b>: wheel odometry and gyro heading get worse over time. Other clues are <b>absolute</b>: GPS outdoors (a few metres), seeing a known landmark, AprilTag or QR-like marker, radio beacons (UWB, within about 10 cm), or matching a LiDAR scan to a saved map. They do not drift, but they can be noisy or not always available.</p>
<p>The trick is to combine both kinds. Drifting sensors are smooth and always there. Absolute sensors stop the drift. Combining them is the next lesson.</p>`,
points:["Localization = estimating the robot’s pose.","Belief = best guess + uncertainty.","Drifting: odometry, gyro. Absolute: GPS, landmarks, beacons, map matching.","GPS works outdoors only, to a few metres.","Combine both types for the best result."],
game:{type:"bins",bins:["Drifts over time","Absolute (does not drift)"],items:[["Wheel odometry",0],["Gyro heading",0],["GPS outdoors",1],["Seeing a known AprilTag marker",1],["Counting steps with eyes closed",0],["Matching a LiDAR scan to a saved map",1]]},
quiz:[{q:"A robot’s “belief” is…",o:["Its best guess of where it is, plus uncertainty","Its religion","Its battery level"],why:"Localization is about probability."},
{q:"Which sensor does not drift?",o:["Seeing a known landmark","Wheel odometry","Gyro integration"],why:"A landmark gives a fresh, absolute fix."},
{q:"Why do robots combine sensors?",o:["Smooth drifting sensors + noisy absolute sensors = best of both","To use more wires","Because one sensor is illegal"],why:"Each covers the other’s weakness."}]},

{t:"Sensor fusion: the complementary filter",
story:`<p>Remember the IMU? The <b>gyro</b> is smooth but drifts. The <b>accelerometer</b> does not drift but is noisy. Let’s fuse them!</p>
<p>The <b>complementary filter</b> trusts the gyro for quick changes and the accelerometer for the long-term truth:</p>
<p><span class="fbig">angle = 0.98 × (angle + gyroRate × dt) + 0.02 × accelAngle</span></p>
<p>Each loop, 98 % comes from the gyro’s update and 2 % pulls gently toward the accelerometer. Fast wiggles come from the gyro. Slow drift gets corrected by the accelerometer. It is tiny, cheap and works great on self-balancing robots and drones. The <b>Madgwick</b> and <b>Mahony</b> filters are fancier versions for full 3D.</p>`,
points:["Gyro: smooth, drifts. Accelerometer: no drift, noisy.","Complementary filter: angle = α(angle + gyro·dt) + (1−α)·accAngle.","α ≈ 0.98 is a common starting point.","Runs in a few lines on any microcontroller.","Madgwick and Mahony filters do full 3D fusion."],
code:{lang:"cpp",src:`
float angle = 0;
const float A = 0.98;

void loop() {
  float dt = 0.01;                                  // 100 Hz loop
  float gyroRate = readGyroY();                     // deg/s
  float accAngle = atan2(readAccX(), readAccZ()) * 180 / PI;
  angle = A * (angle + gyroRate * dt) + (1 - A) * accAngle;
  delay(10);
}`},
game:{type:"calc",problems:[{q:"angle = 10°, gyro = 5 °/s, dt = 0.1 s, accelAngle = 12°, α = 0.98. New angle?",a:10.53,unit:"°",tol:0.02,hint:"0.98 × (10 + 0.5) + 0.02 × 12"},{q:"Same, but the gyro reads 0 and accelAngle = 20°. New angle from 10°?",a:10.2,unit:"°",tol:0.02,hint:"0.98 × 10 + 0.02 × 20"}]},
quiz:[{q:"In the complementary filter, the gyro is trusted for…",o:["Fast, short-term changes","Long-term truth","Nothing"],why:"It is smooth but drifts slowly."},
{q:"What does the accelerometer part fix?",o:["Slow gyro drift","Fast wiggles","Battery voltage"],why:"It gently pulls toward the true tilt."},
{q:"With α = 0.98, how much does the accelerometer count each step?",o:["2 %","98 %","50 %"],why:"1 − 0.98 = 0.02."}]},

{t:"The Kalman filter",
story:`<p>The <b>Kalman filter</b> is the famous, clever way to fuse information. It even helped Apollo astronauts reach the Moon. It repeats two steps.</p>
<p><b>Predict:</b> use the motion model (“I drove 1 m forward”) to move the guess. Uncertainty grows, because motion is never perfect. <b>Update:</b> take a sensor reading and blend it with the prediction. Uncertainty shrinks.</p>
<p>How much to trust each? The <b>Kalman gain K</b> decides: <span class="f">K = P ÷ (P + R)</span>, where P is how unsure the prediction is and R is how noisy the sensor is. K near 1 means “trust the sensor”. K near 0 means “trust the prediction”. Then <span class="f">estimate = prediction + K × (measurement − prediction)</span>. <b>Q</b> says how much the motion can surprise us. For curvy, real robot motion engineers use the <b>Extended Kalman Filter (EKF)</b>.</p>`,
points:["Two steps, repeated: predict (uncertainty grows), update (uncertainty shrinks).","K = P ÷ (P + R). Between 0 (trust model) and 1 (trust sensor).","R = sensor noise. Q = motion (process) noise.","estimate = prediction + K × (measurement − prediction).","EKF handles non-straight-line (nonlinear) robots."],
code:{lang:"cpp",src:`
// 1D Kalman filter
float x = 0, P = 1;          // estimate and its uncertainty
const float Q = 0.1, R = 4;  // motion noise, sensor noise

void kalman(float u, float z) {   // u = commanded move, z = sensor
  x = x + u;         P = P + Q;    // PREDICT
  float K = P / (P + R);           // UPDATE
  x = x + K * (z - x);
  P = (1 - K) * P;
}`},
game:{type:"kalman"},
quiz:[{q:"What happens to uncertainty in the predict step?",o:["It grows","It shrinks","It disappears"],why:"Motion is never perfect."},
{q:"K is close to 1. The filter mostly trusts…",o:["The sensor","The prediction","Nothing"],why:"estimate ≈ measurement."},
{q:"A bigger R (sensor noise) makes K…",o:["Smaller (trust the sensor less)","Bigger","No change"],why:"K = P ÷ (P + R)."}]},

{t:"Maps",
story:`<p>A robot needs a map to plan. The most common is the <b>occupancy grid</b>: chop the floor into small squares (like 5 cm). Each square is <b>free</b>, <b>occupied</b> (wall) or <b>unknown</b>, stored as a probability. Robot vacuums use these.</p>
<p>Smaller cells give more detail but need more memory. A <b>topological map</b> is like a metro map: places (nodes) and connections, without exact distances. <b>Landmark maps</b> store the positions of special features. <b>Point clouds</b> are millions of 3D dots from LiDAR or depth cameras.</p>
<p>For safe planning, robots “grow” the walls on the map by the robot’s radius. This is <b>inflation</b>, and the result is a <b>costmap</b>: squares near walls cost more, so paths stay away from them.</p>`,
points:["Occupancy grid: free / occupied / unknown squares.","Smaller cells = more detail, more memory.","Topological map = places + connections.","Point clouds = 3D dots from LiDAR or depth cameras.","Costmap with inflation keeps paths away from walls."],
game:{type:"calc",problems:[{q:"A 10 m × 8 m room with 5 cm cells. How many cells?",a:32000,tol:0,hint:"200 × 160"},{q:"Same room with 10 cm cells?",a:8000,tol:0},{q:"Each cell uses 1 byte. How many kilobytes for the 5 cm map? (1 KB = 1000 bytes)",a:32,unit:"KB",tol:0.1}]},
quiz:[{q:"In an occupancy grid, each cell is…",o:["Free, occupied or unknown","A different colour","A battery"],why:"It records whether space is blocked."},
{q:"Making cells smaller gives…",o:["More detail but more memory","Less detail","No change"],why:"More cells to store."},
{q:"Why inflate obstacles on a costmap?",o:["So paths keep the robot’s body away from walls","To make walls look nicer","To save memory"],why:"The robot is not a point."}]},

{t:"Path planning: BFS, Dijkstra, A*",
story:`<p>Treat the map like a giant board game. Each square links to its neighbours. Finding a path is a <b>graph search</b>.</p>
<p><b>BFS</b> (breadth-first search) spreads out in rings, like a ripple in water. It finds the path with the fewest steps, but ignores costs like mud. <b>Dijkstra</b> always explores the cheapest square next, so it finds the <b>cheapest</b> path even with costs, but it explores everywhere. <b>A*</b> (A-star) is Dijkstra plus a <b>heuristic</b>: a guess of the distance left to the goal (like straight-line distance). It heads toward the goal and explores far fewer squares, while still finding the best path, as long as the guess never <i>over</i>estimates. <b>Greedy</b> search only follows the guess: very fast, but not always the best path.</p>
<p>For robot arms with many joints, grids get too big. Then planners like <b>RRT</b> grow a random tree of possible moves until one reaches the goal.</p>`,
points:["BFS: rings, fewest steps, ignores cost.","Dijkstra: cheapest path, explores a lot.","A*: f = g (cost so far) + h (guess to goal). Fast and optimal.","Heuristic must never overestimate (Manhattan or straight-line distance).","RRT: random trees for high-dimensional planning."],
code:{lang:"py",src:`
import heapq

def astar(grid, start, goal):
    h = lambda p: abs(p[0]-goal[0]) + abs(p[1]-goal[1])   # Manhattan guess
    open_ = [(h(start), 0, start)]
    came, g = {}, {start: 0}
    while open_:
        f, cost, cur = heapq.heappop(open_)
        if cur == goal:
            path = [cur]
            while cur in came: cur = came[cur]; path.append(cur)
            return path[::-1]
        x, y = cur
        for n in [(x+1,y), (x-1,y), (x,y+1), (x,y-1)]:
            if grid.get(n) == "wall": continue
            ng = cost + (5 if grid.get(n) == "mud" else 1)
            if ng < g.get(n, 1e9):
                g[n] = ng; came[n] = cur
                heapq.heappush(open_, (ng + h(n), ng, n))
    return None`},
game:{type:"astar"},
quiz:[{q:"What does A* add to Dijkstra?",o:["A heuristic guess of the distance to the goal","More mud","Random moves"],why:"f = g + h steers the search."},
{q:"Which planner ignores the extra cost of mud?",o:["BFS","Dijkstra","A*"],why:"BFS only counts steps."},
{q:"For A* to always find the best path, the heuristic must…",o:["Never overestimate the true distance","Always be zero","Be random"],why:"An admissible heuristic keeps A* optimal."}]},

{t:"Obstacle avoidance",
story:`<p>Planning is split in two. The <b>global planner</b> plans the whole route on the map (like A*). The <b>local planner</b> watches the sensors and dodges things that pop up: a person, a chair, a cat.</p>
<p>The simplest local method is <b>reactive</b>: if something is close, stop and turn. <b>Bug algorithms</b> drive toward the goal, follow the edge of any obstacle, then leave it when the way to the goal is clear. <b>Potential fields</b> imagine the goal pulling like a magnet and obstacles pushing away. Simple and smooth, but the robot can get stuck in a <b>local minimum</b> (like a U-shaped trap).</p>
<p>The <b>Dynamic Window Approach</b> (DWA) tries many possible speeds and turns for the next second, throws away the ones that would crash, and picks the best of the rest. Robots also keep a <b>safety bubble</b>: slow down when anything is near.</p>`,
points:["Global planner: whole route. Local planner: dodge obstacles now.","Reactive: sense → stop/turn.","Bug algorithms: follow walls, then head to the goal.","Potential fields: goal pulls, obstacles push. Can get stuck.","DWA: try many motions, choose the best safe one."],
game:{type:"match",pairs:[["Global planner","Plans the whole route on the map"],["Local planner","Dodges what is right in front, now"],["Potential field","Goal pulls, obstacles push"],["Local minimum","A trap where pushes and pulls cancel out"],["Bug algorithm","Follows the obstacle’s edge, then heads for the goal"],["DWA","Tries many speeds and picks the best safe one"]]},
quiz:[{q:"A chair appears that is not on the map. Which planner handles it?",o:["The local planner","The global planner only","Neither"],why:"Local planners react to live sensors."},
{q:"A weakness of potential fields is…",o:["Getting stuck in a local minimum","Needing too many wheels","Using colour cameras"],why:"Forces can cancel out."},
{q:"DWA chooses motion by…",o:["Trying many options and picking the best safe one","Always going straight","Asking the user"],why:"It simulates a short time ahead."}]},

{t:"SLAM: mapping and locating together",
story:`<p>In a brand new house there is no map. To make a map, Bolt must know where it is. To know where it is, Bolt needs a map. A chicken-and-egg problem! <b>SLAM</b> (Simultaneous Localization And Mapping) solves both at the same time.</p>
<p>The loop: move a little, scan with LiDAR or a camera, match the new scan to the map so far (<b>scan matching</b>), update the pose, add the scan to the map. Drift still builds up, until Bolt returns to a place it has seen before and recognises it. That is <b>loop closure</b>, and it snaps the whole map back into shape.</p>
<p>A popular way to localise is the <b>particle filter</b> (Monte Carlo localization): spread hundreds of guesses (particles), move them all, keep the ones that match what the sensors see, and repeat. Real tools: GMapping, Cartographer, SLAM Toolbox (LiDAR) and ORB-SLAM (camera).</p>`,
points:["SLAM builds the map and finds the pose at the same time.","Scan matching aligns new sensor data to the map.","Loop closure: recognising a revisited place fixes drift.","Particle filter: many guesses, keep the ones that fit the sensors.","Tools: SLAM Toolbox, Cartographer, ORB-SLAM."],

quiz:[{q:"SLAM stands for…",o:["Simultaneous Localization And Mapping","Super Large Arm Motor","Slow Light And Magnet"],why:"Mapping and locating together."},
{q:"What is loop closure?",o:["Recognising a place seen before, which fixes drift","Closing a while loop","Turning off the robot"],why:"It snaps accumulated error back."},
{q:"In a particle filter, each particle is…",o:["One guess of the robot’s pose","A piece of dust","A wheel tick"],why:"Many guesses represent uncertainty."}]}

lessons:[
{t:"Computer vision basics",
story:`<p>To a robot, an image is just a big table of numbers. How do we find a ball in it?</p>
<p>RGB is tricky because shadows change all three numbers. So we convert to <b>HSV</b>: <b>Hue</b> (which colour, 0–360°), <b>Saturation</b> (how strong the colour is) and <b>Value</b> (brightness). A blue ball keeps its hue in light and shade. Keep only pixels in the right range: this is <b>thresholding</b>, and the black-and-white result is a <b>mask</b>.</p>
<p>Group the white pixels into a <b>blob</b>, find its <b>centroid</b> (average x and y), and steer toward it! Other tools: <b>edge detection</b> (Canny), <b>contours</b> (outlines), <b>camera calibration</b> (remove lens bending), and special markers like <b>AprilTags</b> and <b>ArUco</b>. The library almost everyone uses is <b>OpenCV</b>.</p>`,
points:["Image = numbers. Convert RGB → HSV for colour finding.","Threshold → mask → blob → centroid.","Steer toward the centroid to chase an object.","Edges (Canny), contours, calibration, AprilTags.","OpenCV is the standard vision library (Python and C++)."],
code:{lang:"py",src:`
import cv2
import numpy as np

cap = cv2.VideoCapture(0)
while True:
    ok, frame = cap.read()
    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)
    # OpenCV hue is 0..179 (half of 0..360)
    mask = cv2.inRange(hsv, (95, 100, 50), (125, 255, 255))   # blue
    m = cv2.moments(mask)
    if m["m00"] > 0:
        cx = int(m["m10"] / m["m00"])           # centroid x
        error = cx - frame.shape[1] // 2        # left/right of centre
        print("steer", error)
    cv2.imshow("mask", mask)
    if cv2.waitKey(1) == 27: break`},

{t:"AI and machine learning in robots",
story:`<p>So far, we wrote every rule by hand. <b>Machine learning</b> is different: the robot learns rules from <b>examples</b>.</p>
<p>A <b>neural network</b> is layers of tiny maths units that learn patterns. In <b>supervised learning</b> we show thousands of labelled pictures (“cup”, “person”). Then it can do <b>classification</b> (what is this?), <b>object detection</b> (boxes around things: YOLO is famous) and <b>segmentation</b> (which exact pixels belong to what).</p>
<p>In <b>reinforcement learning</b>, the robot tries actions and gets <b>rewards</b> for good results. Millions of tries happen in <b>simulation</b> first. The gap between simulation and real life is the <b>sim-to-real</b> problem. In <b>imitation learning</b>, the robot learns by watching a human demonstrate. Newer <b>vision-language-action</b> models let robots follow instructions like “put the red cup in the sink”. Small AI computers like the NVIDIA Jetson run these on the robot (<b>edge AI</b>). Watch out for <b>overfitting</b>: memorising the examples instead of learning the idea.</p>`,
points:["ML learns from examples instead of hand-written rules.","Supervised: labelled data → classification, detection (YOLO), segmentation.","Reinforcement learning: trial and error with rewards, often in simulation.","Imitation learning: learn from human demonstrations.","Sim-to-real gap, overfitting, edge AI on Jetson-type boards."],
game:{type:"bins",bins:["Supervised learning","Reinforcement learning","Imitation learning"],items:[["Learn to spot cups from 10 000 labelled photos",0],["Robot dog learns to walk by trying and getting rewards",1],["Arm copies a human who guides it through folding a towel",2],["Train a detector with boxes drawn around people",0],["Simulated robot gets points for not falling over",1],["Learn to pour by watching recorded demonstrations",2]]},
quiz:[{q:"In reinforcement learning, the robot learns from…",o:["Rewards for good actions","Labelled photos only","Nothing"],why:"Trial, error and reward."},
{q:"YOLO is famous for…",o:["Fast object detection","Battery charging","Motor control"],why:"It draws boxes around objects in real time."},
{q:"The sim-to-real gap means…",o:["What works in simulation may not work on the real robot","Simulation is always perfect","Robots cannot be simulated"],why:"Real friction, noise and lighting differ."}]},

{t:"ROS 2: the robot operating system",
story:`<p>Big robots have many programs: one for the camera, one for the motors, one for planning. <b>ROS 2</b> (Robot Operating System) is not really an operating system. It is a toolkit that lets all these programs talk. It runs on Linux (usually Ubuntu).</p>
<p>Each program is a <b>node</b>. Nodes talk over <b>topics</b>, named channels like <span class="f">/cmd_vel</span> (speed commands) or <span class="f">/scan</span> (LiDAR data). A node <b>publishes</b> messages to a topic, and any node can <b>subscribe</b> to listen. It is like a radio station. Each message has a fixed type, like <b>Twist</b> (speed) or <b>LaserScan</b>.</p>
<p>A <b>service</b> is a quick question and answer. An <b>action</b> is a long task with progress updates, like “navigate to the kitchen”. Famous tools: <b>RViz</b> (see what the robot sees), <b>Gazebo</b> (simulator), <b>Nav2</b> (navigation), <b>MoveIt</b> (arm planning), <b>TF</b> (keeps track of all frames). <b>micro-ROS</b> brings ROS to microcontrollers like the ESP32.</p>`,
points:["Node = one program. Topic = named channel. Message = typed data.","Publish/subscribe: many-to-many, like a radio station.","Service = request/response. Action = long task with feedback.","RViz, Gazebo, Nav2, MoveIt, TF.","Write nodes in Python (rclpy) or C++ (rclcpp)."],
code:{lang:"py",src:`
import rclpy
from rclpy.node import Node
from geometry_msgs.msg import Twist

class Driver(Node):
    def __init__(self):
        super().__init__("driver")
        self.pub = self.create_publisher(Twist, "/cmd_vel", 10)
        self.create_timer(0.1, self.tick)       # 10 times per second

    def tick(self):
        msg = Twist()
        msg.linear.x = 0.2      # forward 0.2 m/s
        msg.angular.z = 0.5     # turn left 0.5 rad/s
        self.pub.publish(msg)

rclpy.init()
rclpy.spin(Driver())`},

{t:"Wireless control and IoT",
story:`<p>Bolt wants to talk without wires. Choose the radio for the job. <b>Bluetooth</b> (Classic or BLE) is perfect for phone control within about 10 m. <b>WiFi</b> (ESP32) has more range and speed, and can host a web page dashboard, but uses more power. <b>nRF24L01</b> and <b>433 MHz</b> modules are cheap simple radios. <b>LoRa</b> reaches kilometres but only sends tiny messages. RC transmitters at <b>2.4 GHz</b> are made for low-delay driving.</p>
<p>For IoT robots, <b>MQTT</b> is a light publish/subscribe protocol, much like ROS topics but over the internet.</p>
<p>Radio links have <b>latency</b> (delay) and <b>packet loss</b> (missing messages). The most important rule: a <b>failsafe</b>. If no command arrives for, say, 500 ms, the robot must <b>stop</b> by itself. Never let a robot keep driving because it lost the signal.</p>`,
points:["Bluetooth/BLE: phone control, about 10 m.","WiFi: more range and speed, web dashboards, more power.","nRF24L01, 433 MHz: simple and cheap. LoRa: km range, tiny data.","MQTT: publish/subscribe for IoT.","Failsafe: stop automatically when the signal is lost."],
code:{lang:"cpp",src:`
// Failsafe: stop if no command for 500 ms
unsigned long lastCmd = 0;

void loop() {
  if (Serial.available()) {          // e.g. from a Bluetooth module
    char c = Serial.read();
    lastCmd = millis();
    if (c == 'F') drive(150, 150);
    if (c == 'L') drive(-120, 120);
    if (c == 'R') drive(120, -120);
    if (c == 'S') drive(0, 0);
  }
  if (millis() - lastCmd > 500) drive(0, 0);   // FAILSAFE
}`},

{t:"Real-time systems and RTOS",
story:`<p>“Real-time” does not mean “super fast”. It means <b>always on time</b>. A motor controller that must update every 1 ms needs to <i>never</i> be late.</p>
<p>In <b>hard real-time</b> systems, missing a deadline is a failure (motor control, airbags, flight control). In <b>soft real-time</b> systems, being a bit late is annoying but OK (a video stream).</p>
<p>When one chip juggles many jobs, an <b>RTOS</b> (real-time operating system) helps. <b>FreeRTOS</b> runs on the ESP32. You split work into <b>tasks</b>, each with a <b>priority</b>. The <b>scheduler</b> runs the most important ready task. Tasks pass data through <b>queues</b> and protect shared things with <b>mutexes</b>. A <b>watchdog timer</b> resets the chip if the program ever freezes. Shaky timing is called <b>jitter</b>.</p>`,
points:["Real-time = predictable and on time, not just fast.","Hard real-time: deadlines must never be missed.","RTOS: tasks, priorities, scheduler, queues, mutexes.","FreeRTOS runs on ESP32 (it is built in).","Watchdog timer resets a frozen program."],
code:{lang:"cpp",src:`
// ESP32 + FreeRTOS: two tasks running side by side
void motorTask(void *p) {
  for (;;) { updatePID(); vTaskDelay(pdMS_TO_TICKS(5)); }      // every 5 ms
}
void telemetryTask(void *p) {
  for (;;) { sendStatus(); vTaskDelay(pdMS_TO_TICKS(200)); }   // every 200 ms
}
void setup() {
  xTaskCreate(motorTask,     "motor", 4096, NULL, 3, NULL);    // high priority
  xTaskCreate(telemetryTask, "tele",  4096, NULL, 1, NULL);    // low priority
}
void loop() {}`},

{t:"Simulation, testing and debugging",
story:`<p>Professionals rarely test brand new code on an expensive robot first. They <b>simulate</b>. <b>Wokwi</b> and <b>Tinkercad Circuits</b> simulate Arduino circuits in your browser. <b>Gazebo</b>, <b>Webots</b>, <b>CoppeliaSim</b> and <b>Isaac Sim</b> simulate whole robots. A <b>digital twin</b> is a simulated copy that mirrors a real machine.</p>
<p>Then test in small pieces: one sensor, one motor, then combine. <b>Unit tests</b> check small functions automatically. Use <b>Serial.print</b> and the <b>Serial Plotter</b> to see values live. Keep <b>logs</b>. A <b>logic analyser</b> shows digital signals (perfect for I2C and UART), and an <b>oscilloscope</b> shows voltages over time.</p>
<p>When stuck, explain your code line by line to a rubber duck (really!): this is <b>rubber duck debugging</b>. Save every working version with <b>Git</b> so you can always go back.</p>`,

{t:"Humanoids, swarms and working with people",
story:`<p><b>Humanoid robots</b> have human shapes so they can use our stairs, doors and tools. They are hard: about 30 or more joints, balance, power, and tough hands. <b>Manipulation</b> (picking things up) needs <b>grasp planning</b>: where to put each finger so the object will not slip.</p>
<p><b>Swarm robots</b> are many simple robots working as a team, like ants or birds. Each follows simple rules: do not bump into neighbours (<b>separation</b>), go the same way (<b>alignment</b>), stay close (<b>cohesion</b>). Together they show clever group behaviour.</p>
<p><b>Human-robot interaction</b> (HRI) is about robots and people understanding each other: voice, gestures, and showing intentions with lights and sounds. Other exciting areas: <b>soft robots</b> made of rubber, <b>exoskeletons</b> that help people walk or lift, and <b>surgical robots</b> that help doctors make tiny precise movements.</p>`,

{t:"Safety, ethics and the future",
story:`<p>Real robots can hurt people, so <b>safety</b> is designed in from the start. Every robot needs an <b>emergency stop</b>. Cobots limit their speed and force. Factories use safety fences, <b>light curtains</b> and safety zones that slow the robot when someone walks near. Standards such as <b>ISO 10218</b> (industrial robots) and <b>ISO/TS 15066</b> (cobots) set the rules. Design for <b>fail-safe</b>: when anything goes wrong (lost signal, low battery, sensor error), the robot goes to a safe state, usually “stop”. Engineers do a <b>risk assessment</b> before deploying.</p>
<p>Robots also raise big questions, called <b>ethics</b>. Cameras can invade <b>privacy</b>. Automation changes <b>jobs</b>. When a robot makes a mistake, who is <b>responsible</b>? AI can learn unfair <b>bias</b> from its data. Military robots are hotly debated. Asimov’s “Three Laws of Robotics” come from science fiction, not real engineering. Real safety comes from careful design, testing and rules.</p>`,
points:["Emergency stop, speed and force limits, light curtains, safety zones.","ISO 10218 (industrial) and ISO/TS 15066 (cobots).","Fail-safe: any fault → safe state (usually stop).","Risk assessment before deployment.","Ethics: privacy, jobs, responsibility, bias, military use."],

{t:"Build your first robot",
story:`<p>You made it! Now let’s plan a real robot: an <b>obstacle-avoiding car</b>. It uses almost everything you learned.</p>
<p><b>Parts:</b> Arduino Uno, a TB6612FNG or L298N motor driver, 2 yellow TT gear motors with wheels, a caster wheel, an HC-SR04 ultrasonic sensor, an SG90 servo (optional, to turn the sensor head), 2 × 18650 Li-ion cells in a holder (7.4 V, 2S) with a switch, a chassis, and jumper wires.</p>
<p><b>Plan:</b> test each part alone first (motor, sensor, servo). Then combine. Use a <b>state machine</b>: DRIVE → (obstacle closer than 25 cm) → LOOK (servo checks left and right) → TURN toward the clearer side → DRIVE. Then tune and upgrade: add a line sensor, Bluetooth with a failsafe, encoders with PID for straight driving, an ESP32 camera for vision, or ROS 2 on a Raspberry Pi. You are now a roboticist. Go build!</p>`,
points:["Parts: Uno, motor driver, 2 gear motors, caster, HC-SR04, SG90, 2S Li-ion pack, switch.","Test each part alone, then combine.","Logic: DRIVE → LOOK → TURN → DRIVE (a state machine).","Common ground. Motors on the battery, not the Arduino 5 V pin.","Upgrades: line following, Bluetooth + failsafe, encoders + PID, camera, ROS 2."],
code:{lang:"cpp",src:`
#include <Servo.h>
const int ENA=5, IN1=7, IN2=8, ENB=6, IN3=9, IN4=10, TRIG=11, ECHO=12;
Servo head;
enum State { DRIVE, LOOK, TURN };
State state = DRIVE;
int turnDir = 1;
unsigned long t0;

float distance() {
  digitalWrite(TRIG, LOW); delayMicroseconds(2);
  digitalWrite(TRIG, HIGH); delayMicroseconds(10); digitalWrite(TRIG, LOW);
  long t = pulseIn(ECHO, HIGH, 30000);
  return t == 0 ? 400 : t * 0.0343 / 2;
}

void drive(int l, int r) {
  digitalWrite(IN1, l >= 0); digitalWrite(IN2, l < 0); analogWrite(ENA, abs(l));
  digitalWrite(IN3, r >= 0); digitalWrite(IN4, r < 0); analogWrite(ENB, abs(r));
}

void setup() {
  int outs[] = {ENA, IN1, IN2, ENB, IN3, IN4, TRIG};
  for (int p : outs) pinMode(p, OUTPUT);
  pinMode(ECHO, INPUT);
  head.attach(3); head.write(90);
}

void loop() {
  switch (state) {
    case DRIVE:
      drive(160, 160);
      if (distance() < 25) { drive(0, 0); state = LOOK; }
      break;
    case LOOK: {
      head.write(20);  delay(350); float right = distance();
      head.write(160); delay(350); float left  = distance();
      head.write(90);  delay(200);
      turnDir = (left > right) ? -1 : 1;
      state = TURN; t0 = millis();
      break;
    }
    case TURN:
      drive(140 * turnDir, -140 * turnDir);
      if (millis() - t0 > 450) state = DRIVE;
      break;
  }
}`,note:"Pin numbers are examples. Match them to your own wiring."},

{g:"Kinematics & navigation",f:[["Degrees ↔ radians","rad = deg × π ÷ 180"],["Distance","d = √(dx² + dy²)"],["Angle to goal","θ = atan2(dy, dx)"],["Rotation","x′ = x cos θ − y sin θ, y′ = x sin θ + y cos θ"],["2-link FK","x = L1 cos θ1 + L2 cos(θ1+θ2), y = L1 sin θ1 + L2 sin(θ1+θ2)"],["2-link IK","cos θ2 = (x² + y² − L1² − L2²) ÷ (2 L1 L2)"],["Differential drive","v = (vR + vL) ÷ 2, ω = (vR − vL) ÷ L"],["Pose update","x += v cos θ dt, y += v sin θ dt, θ += ω dt"],["A* cost","f = g + h"]]}
);

/* ===== Mini-games part 1: framework, generic games, electronics ===== */
const G={};
const GAME_NAMES={maze:'Robot Commander',ohm:'LED Lab',divider:'Voltage Divider Lab',rescode:'Resistor Code Breaker',logic:'Logic Gate Lab',order:'Put It In Order',match:'Match Up',bins:'Sort It',calc:'Engineer’s Calculator',adc:'ADC Explorer',pwm:'PWM Speed Lab',sonar:'Echo Ranger',filter:'Noise Filter Lab',hbridge:'H-Bridge Switchboard',servo:'Servo Aim',gears:'Gearbox Builder',battery:'Battery Planner',pid:'PID Tuning Lab',linefollow:'Line Follower Race',fk:'Arm Reach (Forward Kinematics)',ik:'Arm Solver (Inverse Kinematics)',diffdrive:'Wheel Speed Driver',kalman:'Kalman Filter Lab',astar:'Path Planner',vision:'Ball Finder'};
function gameName(g){return (g&&g.title)||GAME_NAMES[g&&g.type]||'Challenge';}
function mountGame(el,cfg,win,already){
  el.innerHTML=`<div class="game"><div class="game-h"><h3>${esc(gameName(cfg))}</h3><span class="chip ${already?'won':''}">${already?'Beaten ✓':'+30 XP'}</span></div><div class="game-b"></div></div>`;
  const body=el.querySelector('.game-b'),chip=el.querySelector('.game-h .chip');
  const st=document.createElement('p');st.className='g-status';st.setAttribute('aria-live','polite');
  const status=(m,k)=>{st.innerHTML=m;st.dataset.kind=k||'';};
  let won=false;const w=()=>{if(won)return;won=true;chip.textContent='Beaten ✓';chip.classList.add('won');win();};
  try{G[cfg.type](body,cfg,w,status);}catch(err){body.insertAdjacentHTML('beforeend','<p>This mini-game could not load. Please reload the page.</p>');console.error(err);}
  body.appendChild(st);
  if(!st.innerHTML&&already)status('You already beat this one. Play again any time.');
}
function intro(root,html){root.insertAdjacentHTML('beforeend',`<p class="g-intro">${html}</p>`);}
function slider(root,o){const i=uid();root.insertAdjacentHTML('beforeend',`<div class="ctrl"><label for="${i}">${o.label}</label><input type="range" id="${i}" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.value}"><output for="${i}" id="${i}o"></output></div>`);
  const inp=root.querySelector('#'+i),out=root.querySelector('#'+i+'o'),f=o.fmt||(v=>v);const upd=()=>{out.textContent=f(+inp.value);};upd();
  return {inp,get v(){return +inp.value;},set v(x){inp.value=x;upd();},on(fn){inp.addEventListener('input',()=>{upd();fn(+inp.value);});}};}
function tasks(root,items){root.insertAdjacentHTML('beforeend',`<ul class="tasks">${items.map(t=>`<li>${t}</li>`).join('')}</ul>`);const ul=root.lastElementChild;const lis=[...ul.children];
  return {done(k){lis[k].classList.add('ok');},is(k){return lis[k].classList.contains('ok');},all(){return lis.every(l=>l.classList.contains('ok'));}};}
function seg(root,label,opts,cur,fn){const i=uid();root.insertAdjacentHTML('beforeend',`<div class="row wrap"><b style="font-size:.92rem;min-width:110px">${label}</b><div class="seg" role="group" aria-label="${label}" id="${i}">${opts.map((o,k)=>`<button data-k="${k}" aria-pressed="${k===cur}">${o}</button>`).join('')}</div></div>`);
  const g=root.querySelector('#'+i);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(+b.dataset.k);});return g;}
function readout(root,items){const i=uid();root.insertAdjacentHTML('beforeend',`<div class="readout" id="${i}">${items.map(t=>`<div>${t}<b>–</b></div>`).join('')}</div>`);const bs=[...root.querySelector('#'+i).querySelectorAll('b')];return (k,v)=>{bs[k].textContent=v;};}
function fmtOhm(v){return v>=1e6?(v/1e6)+' MΩ':v>=1000?(v/1000)+' kΩ':v+' Ω';}

/* ---- generic: calculator ---- */
function calcBlock(root,problems,done){
  const wrap=document.createElement('div');wrap.className='calc';const solved=new Set();
  problems.forEach((p,k)=>{const i=uid();const row=document.createElement('div');row.className='calc-row';
    row.innerHTML=`<label for="${i}">${k+1}. ${p.q}</label><div class="calc-in"><input id="${i}" inputmode="decimal" autocomplete="off" placeholder="answer"><span class="unit">${p.unit||''}</span><button class="btn sm">Check</button></div><p class="calc-fb" aria-live="polite"></p>`;
    const inp=row.querySelector('input'),fb=row.querySelector('.calc-fb'),b=row.querySelector('button');
    const check=()=>{const v=parseFloat(String(inp.value).replace(',','.'));if(isNaN(v)){fb.textContent='Type a number first.';fb.dataset.kind='bad';return;}
      const tol=p.tol!=null?p.tol:Math.max(Math.abs(p.a)*0.02,0.011);
      if(Math.abs(v-p.a)<=tol){fb.innerHTML='Correct! '+(p.how||'');fb.dataset.kind='ok';row.classList.add('solved');inp.disabled=true;b.disabled=true;solved.add(k);if(solved.size===problems.length)done();}
      else{fb.innerHTML='Not yet. '+(p.hint?'Hint: '+p.hint:'Check your working and try again.');fb.dataset.kind='bad';}};
    b.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});wrap.appendChild(row);});
  root.appendChild(wrap);
}
G.calc=(root,cfg,win,status)=>{intro(root,cfg.intro||'Work out each answer with the formula from the lesson. Small rounding is fine.');calcBlock(root,cfg.problems,()=>{status('All answers correct. Real engineer maths!','ok');win();});};

/* ---- generic: match ---- */
G.match=(root,cfg,win,status)=>{
  intro(root,cfg.intro||'Tap a word on the left, then tap what it means on the right.');
  const right=shuffle(cfg.pairs.map((p,i)=>({i,t:p[1]})));
  root.insertAdjacentHTML('beforeend',`<div class="match"><div class="mcol">${cfg.pairs.map((p,i)=>`<button class="mitem" data-side="L" data-i="${i}">${p[0]}</button>`).join('')}</div><div class="mcol">${right.map(x=>`<button class="mitem" data-side="R" data-i="${x.i}">${x.t}</button>`).join('')}</div></div>`);
  let sel=null,n=0;const box=root.querySelector('.match');
  box.addEventListener('click',e=>{const b=e.target.closest('.mitem');if(!b||b.classList.contains('done'))return;
    if(b.dataset.side==='L'){box.querySelectorAll('.mitem.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return;}
    if(!sel){status('First tap a word on the left side.');return;}
    if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;n++;status(`${n} of ${cfg.pairs.length} matched.`,'ok');if(n===cfg.pairs.length){status('All matched! Great memory.','ok');win();}}
    else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);status('Not a match. Try another one.','bad');}});
};

/* ---- generic: sort into bins ---- */
G.bins=(root,cfg,win,status)=>{
  intro(root,cfg.intro||'Tap an item, then tap the box where it belongs.');
  const items=shuffle(cfg.items.map((it,i)=>({t:it[0],b:it[1],h:it[2],i})));
  root.insertAdjacentHTML('beforeend',`<div class="pool">${items.map(it=>`<button class="chipbtn" data-i="${it.i}">${it.t}</button>`).join('')}</div><div class="bins">${cfg.bins.map((b,k)=>`<div class="bin" data-b="${k}" role="button" tabindex="0" aria-label="Put in ${esc(b)}"><div class="bin-h">${b}</div><div class="bin-body"></div></div>`).join('')}</div>`);
  let sel=null,n=0;const pool=root.querySelector('.pool');
  pool.addEventListener('click',e=>{const b=e.target.closest('.chipbtn');if(!b)return;pool.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;status('Now tap a box.');});
  const drop=bin=>{if(!sel){status('First tap an item at the top.');return;}const it=cfg.items[+sel.dataset.i];
    if(it[1]===+bin.dataset.b){bin.querySelector('.bin-body').appendChild(sel);sel.classList.remove('sel');sel.disabled=true;sel=null;n++;status(`${n} of ${cfg.items.length} sorted.`,'ok');if(n===cfg.items.length){status('Everything sorted!','ok');win();}}
    else{sel.classList.add('shake');const s=sel;setTimeout(()=>s.classList.remove('shake'),400);status('Not that box.'+(it[2]?' Hint: '+it[2]:' Think again.'),'bad');}};
  root.querySelectorAll('.bin').forEach(bin=>{bin.addEventListener('click',()=>drop(bin));bin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop(bin);}});});
};

/* ---- generic: order ---- */
G.order=(root,cfg,win,status)=>{
  intro(root,cfg.intro||'Tap the pieces in the right order. Tap a placed piece to send it back.');
  const items=cfg.items;let pool=shuffle(items.map((t,i)=>({t,i})));if(pool.every((p,k)=>p.i===k))pool.reverse();let ans=[];
  root.insertAdjacentHTML('beforeend',`<ol class="ord" aria-label="Your order"></ol><div class="pool"></div><div class="row"><button class="btn sm" data-chk disabled>Check order</button><button class="btn sm ghost" data-clr>Start over</button></div>`);
  const ol=root.querySelector('.ord'),pl=root.querySelector('.pool'),chk=root.querySelector('[data-chk]'),cls=cfg.code?' codechip':'';
  function draw(bad){ol.innerHTML=ans.map((a,k)=>`<li><button class="chipbtn${cls}${bad===k?' wrong':''}" data-a="${k}">${esc(a.t)}</button></li>`).join('');pl.innerHTML=pool.map((p,k)=>`<button class="chipbtn${cls}" data-p="${k}">${esc(p.t)}</button>`).join('')||'<span class="small muted">All placed. Press Check order.</span>';chk.disabled=pool.length>0;}
  pl.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;ans.push(pool.splice(+b.dataset.p,1)[0]);draw();});
  ol.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;pool.push(ans.splice(+b.dataset.a,1)[0]);draw();});
  root.querySelector('[data-clr]').onclick=()=>{pool=shuffle(items.map((t,i)=>({t,i})));ans=[];draw();status('');};
  chk.onclick=()=>{const bad=ans.findIndex((a,k)=>a.t!==items[k]);if(bad<0){status(cfg.win||'Perfect order!','ok');win();draw();}else{draw(bad);status(`Step ${bad+1} is in the wrong place. Tap it to send it back and try again.`,'bad');}};
  draw();
};

/* ---- maze / algorithms ---- */
const BOT_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="11" height="12" rx="2" fill="var(--robot)" stroke="var(--ink)" stroke-width="1.5"/><path d="M14 6.5 L18.5 10 L14 13.5 Z" fill="var(--ink)"/><circle cx="9.5" cy="7.5" r="1.4" fill="var(--ink)"/><circle cx="9.5" cy="12.5" r="1.4" fill="var(--ink)"/></svg>';
const FLAG_SVG='<svg viewBox="0 0 20 20" aria-label="goal"><line x1="5" y1="3" x2="5" y2="18" stroke="var(--ink)" stroke-width="2"/><path d="M5 3 H16 L13 6.5 L16 10 H5 Z" fill="var(--bad)"/></svg>';
G.maze=(root,cfg,win,status)=>{
  const levels=cfg.levels;let lv=0,prog=[],running=false,timer=null,map,W,H,start,goal,bot;
  intro(root,'Bolt only follows exact steps. Build a program: <b>Forward</b> moves one square, <b>Left</b> and <b>Right</b> turn on the spot. Then press <b>Run</b>. Bolt starts facing right.');
  root.insertAdjacentHTML('beforeend',`<div class="maze-wrap"><div class="maze-grid"></div><div class="maze-side"><p class="mono small">Level <span class="lv"></span> of ${levels.length}</p><p class="small muted">Your program:</p><div class="prog" aria-label="Your program"></div>
  <div class="row wrap"><button class="btn sm ghost" data-c="F">↑ Forward</button><button class="btn sm ghost" data-c="L">↺ Left</button><button class="btn sm ghost" data-c="R">↻ Right</button></div>
  <div class="row wrap"><button class="btn sm ghost" data-a="undo">Undo</button><button class="btn sm ghost" data-a="clear">Clear</button><button class="btn sm go" data-a="run">▶ Run</button></div></div></div>`);
  const grid=root.querySelector('.maze-grid'),pe=root.querySelector('.prog');const DX=[1,0,-1,0],DY=[0,1,0,-1],NM={F:'Forward',L:'Left',R:'Right'};
  function loadLevel(){map=levels[lv].map(r=>r.split(''));H=map.length;W=map[0].length;map.forEach((r,y)=>r.forEach((c,x)=>{if(c==='S')start={x,y};if(c==='G')goal={x,y};}));bot={x:start.x,y:start.y,d:0};prog=[];root.querySelector('.lv').textContent=lv+1;draw();drawProg();}
  function draw(){grid.style.gridTemplateColumns=`repeat(${W},1fr)`;let h='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=map[y][x];const isBot=bot.x===x&&bot.y===y;h+=`<div class="${c==='#'?'w':''}">${isBot?BOT_SVG.replace('<svg',`<svg style="transform:rotate(${bot.d*90}deg)"`):c==='G'?FLAG_SVG:''}</div>`;}grid.innerHTML=h;}
  function drawProg(now){pe.innerHTML=prog.length?prog.map((c,k)=>`<span class="${k===now?'now':''}">${k+1}. ${NM[c]}</span>`).join(''):'<span class="small muted" style="border:0;background:none">Empty. Tap the buttons to add steps.</span>';}
  root.querySelector('.maze-side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||running)return;
    if(b.dataset.c){if(prog.length>=30){status('That is a very long program. Try fewer steps.','bad');return;}prog.push(b.dataset.c);drawProg();}
    else if(b.dataset.a==='undo'){prog.pop();drawProg();}else if(b.dataset.a==='clear'){prog=[];drawProg();bot={x:start.x,y:start.y,d:0};draw();}
    else if(b.dataset.a==='run')run();});
  function run(){if(!prog.length){status('Add some steps first.','bad');return;}running=true;bot={x:start.x,y:start.y,d:0};draw();let i=0;status('Running…');
    timer=setInterval(()=>{
      if(i>=prog.length){clearInterval(timer);running=false;status('Bolt finished the program but is not on the flag. Change the steps and run again.','bad');drawProg();return;}
      const c=prog[i];drawProg(i);
      if(c==='L')bot.d=(bot.d+3)%4;else if(c==='R')bot.d=(bot.d+1)%4;
      else{const nx=bot.x+DX[bot.d],ny=bot.y+DY[bot.d];if(nx<0||ny<0||nx>=W||ny>=H||map[ny][nx]==='#'){clearInterval(timer);running=false;status(`Bump! Step ${i+1} drives into a wall. That is a <b>bug</b>. Fix it and run again.`,'bad');return;}bot.x=nx;bot.y=ny;}
      draw();i++;
      if(bot.x===goal.x&&bot.y===goal.y){clearInterval(timer);running=false;
        if(lv<levels.length-1){status(`Level ${lv+1} done with ${i} steps! Loading the next level…`,'ok');lv++;setTimeout(loadLevel,1100);}
        else{status('All levels done! You just wrote real algorithms.','ok');win();}}
    },RM?120:360);}
  onClean(()=>clearInterval(timer));loadLevel();
};

/* ---- LED + Ohm's law ---- */
G.ohm=(root,cfg,win,status)=>{
  intro(root,'Bolt wants a red LED on its chest. A red LED uses about <b>2 V</b> and is happy with <b>10 to 20 mA</b>. More than that can burn it. Pick the resistor.');
  const R=[47,68,100,150,220,330,470,680,1000,2200,4700,10000];let vs=5;const done={5:false,9:false};
  root.insertAdjacentHTML('beforeend','<div class="two"><div class="c1" style="display:flex;flex-direction:column;gap:12px"></div><div class="c2" style="display:grid;place-items:center"></div></div>');
  const c1=root.querySelector('.c1'),c2=root.querySelector('.c2');
  seg(c1,'Battery',['5 V','9 V'],0,k=>{vs=k?9:5;upd();});
  const sl=slider(c1,{label:'Resistor',min:0,max:R.length-1,step:1,value:6,fmt:v=>fmtOhm(R[v])});
  c1.insertAdjacentHTML('beforeend','<span class="fbig"></span>');const ro=readout(c1,['Current','LED']);
  c2.innerHTML='<svg viewBox="0 0 120 150" width="140" role="img" aria-label="LED"><defs><radialGradient id="ledglow"><stop offset="0" stop-color="#ff5a3c" stop-opacity=".95"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient></defs><circle class="glow" cx="60" cy="55" r="56" fill="url(#ledglow)" opacity="0"/><path class="dome" d="M38 90 V52 a22 22 0 0 1 44 0 V90 Z" stroke="var(--ink)" stroke-width="3"/><rect x="32" y="88" width="56" height="8" rx="2" fill="var(--ink)"/><line x1="48" y1="96" x2="48" y2="148" stroke="var(--muted)" stroke-width="4"/><line x1="72" y1="96" x2="72" y2="136" stroke="var(--muted)" stroke-width="4"/><text class="burnt" x="60" y="68" text-anchor="middle" font-size="30" font-weight="700" fill="#fff" opacity="0">✕</text></svg>';
  const T=tasks(root,['Light the LED safely (10–20 mA) with the 5 V battery','Switch to the 9 V battery and light it safely again']);
  function upd(){const r=R[sl.v],I=(vs-2)/r*1000,b=Math.min(I/20,1),burnt=I>30;
    c1.querySelector('.fbig').textContent=`I = (V − V_LED) ÷ R = (${vs} − 2) ÷ ${r} Ω = ${I.toFixed(1)} mA`;
    ro(0,I.toFixed(1)+' mA');ro(1,burnt?'Burned out!':I>20?'Too bright, risky':I>=10?'Safe and bright':I>=2?'Dim':'Almost off');
    c2.querySelector('.dome').setAttribute('fill',burnt?'#444':`rgba(230,60,35,${0.18+0.82*b})`);c2.querySelector('.glow').setAttribute('opacity',burnt?0:b*0.9);c2.querySelector('.burnt').setAttribute('opacity',burnt?1:0);
    if(I>=10&&I<=20){if(!done[vs]){done[vs]=true;T.done(vs===5?0:1);}status(`Nice! ${I.toFixed(1)} mA is safe.`,'ok');}
    else if(burnt)status('Way too much current. A real LED would burn out. Pick a bigger resistor.','bad');
    else if(I>20)status('A bit too much current. Try a slightly bigger resistor.','bad');
    else status('Not enough current, so the LED is dim. Try a smaller resistor.');
    if(done[5]&&done[9]){status('Both done! A bigger battery needs a bigger resistor.','ok');win();}}
  sl.on(upd);upd();
};

/* ---- voltage divider ---- */
G.divider=(root,cfg,win,status)=>{
  intro(root,'Bolt’s ESP32 brain can only take <b>3.3 V</b> on a pin, but the sensor sends <b>5 V</b>. Two resistors in a row split the voltage. <span class="f">Vout = Vin × R2 ÷ (R1 + R2)</span>');
  const R=[1000,1500,2200,3300,4700,10000];let r1=0,r2=0,t=0;const TG=[[3.3,0.15],[2.5,0.02]];
  seg(root,'R1 (top)',R.map(fmtOhm),0,k=>{r1=k;upd();});seg(root,'R2 (bottom)',R.map(fmtOhm),0,k=>{r2=k;upd();});
  root.insertAdjacentHTML('beforeend','<span class="fbig"></span><svg viewBox="0 0 520 54" width="100%" role="img" aria-label="Output voltage meter"><rect x="10" y="14" width="500" height="22" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><rect class="mf" x="10" y="14" width="0" height="22" rx="4" fill="var(--robot)"/><line class="mt" x1="0" x2="0" y1="6" y2="44" stroke="var(--bad)" stroke-width="3"/><text x="10" y="52" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">0 V</text><text x="510" y="52" font-size="11" fill="var(--muted)" text-anchor="end" font-family="JetBrains Mono,monospace">5 V</text></svg>');
  const T=tasks(root,['Make about 3.3 V (between 3.15 and 3.45 V)','Make exactly half of 5 V (2.5 V)']);
  function upd(){const v=5*R[r2]/(R[r1]+R[r2]);root.querySelector('.fbig').textContent=`Vout = 5 × ${fmtOhm(R[r2])} ÷ (${fmtOhm(R[r1])} + ${fmtOhm(R[r2])}) = ${v.toFixed(2)} V`;
    root.querySelector('.mf').setAttribute('width',v/5*500);const tg=TG[Math.min(t,1)][0];const mt=root.querySelector('.mt');mt.setAttribute('x1',10+tg/5*500);mt.setAttribute('x2',10+tg/5*500);
    if(t<2&&Math.abs(v-TG[t][0])<=TG[t][1]){T.done(t);t++;status(t<2?`${v.toFixed(2)} V. Task done! Now the next one.`:'Both done! Equal resistors always give half.','ok');if(t===2)win();}
    else if(t<2)status(`${v.toFixed(2)} V. Target: ${TG[t][0]} V. ${v>TG[t][0]?'Too high: make R2 smaller or R1 bigger.':'Too low: make R2 bigger or R1 smaller.'}`);}
  upd();
};

/* ---- resistor colour code ---- */
const RC=[['Black','#141414'],['Brown','#7A4218'],['Red','#D42A1E'],['Orange','#F07C00'],['Yellow','#F4D21C'],['Green','#23933F'],['Blue','#2161D0'],['Violet','#7D3CC4'],['Grey','#8C8C8C'],['White','#F2F2F2']];
G.rescode=(root,cfg,win,status)=>{
  intro(root,'Read the bands from left to right: <b>1st digit</b>, <b>2nd digit</b>, then the <b>multiplier</b> (how many zeros to add). The gold band at the end means ±5%. Build the resistor Bolt asks for.');
  const TG=cfg.targets||[220,4700,10000,1000];let k=0;const b=[1,0,0];
  root.insertAdjacentHTML('beforeend',`<p style="font-size:1.1rem">Bolt asks for: <b class="mono tg"></b> <span class="mono small muted pr"></span></p>

  ${['1st digit','2nd digit','Multiplier'].map((n,bi)=>`<div class="row wrap"><b style="font-size:.9rem;min-width:96px">${n}</b><div class="seg sw" data-b="${bi}">${RC.slice(0,bi===2?7:10).map((c,ci)=>`<button data-c="${ci}" aria-pressed="${b[bi]===ci}" aria-label="${c[0]}${bi===2?' (×'+(10**ci)+')':' = '+ci}" title="${c[0]}" style="background:${c[1]}"></button>`).join('')}</div></div>`).join('')}

  function upd(){root.querySelector('.tg').textContent=fmtOhm(TG[k]);root.querySelector('.pr').textContent=`(resistor ${k+1} of ${TG.length})`;

    const v=(b[0]*10+b[1])*10**b[2];root.querySelector('.yr').textContent=`Your bands: ${RC[b[0]][0]} ${RC[b[1]][0]} ${RC[b[2]][0]} → ${b[0]}${b[1]} × ${10**b[2]} = ${fmtOhm(v)}`;
    if(v===TG[k]){if(k<TG.length-1){status(`Correct! ${fmtOhm(v)}. Next one…`,'ok');k++;setTimeout(upd,900);}else{status('You can read resistor colour codes now!','ok');win();}}
