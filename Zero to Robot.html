/* ---- logic gates ---- */
const GATES={AND:{f:(a,b)=>a&b,n:2,say:'gives 1 only when A and B are both 1'},OR:{f:(a,b)=>a|b,n:2,say:'gives 1 when A or B (or both) is 1'},NOT:{f:a=>1-a,n:1,say:'flips the input: 1 becomes 0, 0 becomes 1'},XOR:{f:(a,b)=>a^b,n:2,say:'gives 1 only when the two inputs are different'},NAND:{f:(a,b)=>1-(a&b),n:2,say:'is NOT-AND: it gives 0 only when both are 1'},NOR:{f:(a,b)=>1-(a|b),n:2,say:'is NOT-OR: it gives 1 only when both are 0'}};
G.logic=(root,cfg,win,status)=>{
  const list=cfg.gates||['AND','OR','NOT','XOR','NAND'];let k=0,A=0,B=0,ans=[],hint=false;
  intro(root,'First flip the switches A and B to see what the gate does. Then fill in its <b>truth table</b>: tap each output to set 0 or 1, and press Check.');
  root.insertAdjacentHTML('beforeend','<div class="lgbox"></div>');const box=root.querySelector('.lgbox');
  function draw(){const name=list[k],g=GATES[name],rows=g.n===2?[[0,0],[0,1],[1,0],[1,1]]:[[0],[1]];const out=g.n===2?g.f(A,B):g.f(A);
    box.innerHTML=`<p class="mono small">Gate ${k+1} of ${list.length}</p><div class="two"><div style="display:flex;flex-direction:column;gap:10px">
    <div class="row wrap"><button class="tog" data-in="A" aria-pressed="${!!A}">A = ${A}</button>${g.n===2?`<button class="tog" data-in="B" aria-pressed="${!!B}">B = ${B}</button>`:''}
    <span style="font-family:var(--display);font-weight:900;font-size:1.9rem;padding:0 6px">${name}</span><span class="lamp ${out?'on':''}" aria-hidden="true"></span><b class="mono">Y = ${out}</b></div>
    <p class="small muted">${hint?`Hint: ${name} ${g.say}.`:'Try every switch combination.'}</p></div>
    <div><table class="tt"><thead><tr><th>A</th>${g.n===2?'<th>B</th>':''}<th>Y</th></tr></thead><tbody>${rows.map((r,ri)=>`<tr><td>${r[0]}</td>${g.n===2?`<td>${r[1]}</td>`:''}<td><button data-r="${ri}" aria-label="Output for A=${r[0]}${g.n===2?' B='+r[1]:''}">${ans[ri]==null?'?':ans[ri]}</button></td></tr>`).join('')}</tbody></table>
    <button class="btn sm" data-check style="margin-top:10px">Check table</button></div></div>`;
    box.querySelectorAll('.tog').forEach(t=>t.onclick=()=>{if(t.dataset.in==='A')A=1-A;else B=1-B;draw();});
    box.querySelectorAll('.tt button').forEach(t=>t.onclick=()=>{const r=+t.dataset.r;ans[r]=ans[r]==null?0:1-ans[r];draw();});
    box.querySelector('[data-check]').onclick=()=>{if(ans.length<rows.length||rows.some((r,ri)=>ans[ri]==null)){status('Fill every row first.','bad');return;}
      const bad=rows.findIndex((r,ri)=>(g.n===2?g.f(r[0],r[1]):g.f(r[0]))!==ans[ri]);
      if(bad<0){if(k<list.length-1){status(`${name} solved! Next gate.`,'ok');k++;ans=[];A=0;B=0;hint=false;setTimeout(draw,700);}else{status('Every gate solved. You think like a computer chip!','ok');win();}}
      else{hint=true;draw();box.querySelectorAll('.tt button')[bad].classList.add('wrong');status(`Row ${bad+1} is wrong. Test it with the switches.`,'bad');}};}
  draw();
};

/* ---- PWM ---- */
G.pwm=(root,cfg,win,status)=>{
  intro(root,'PWM switches the pin ON and OFF very fast (about 490 times a second). The <b>duty cycle</b> is how much of the time it is ON. Bolt’s motor and LED feel the <b>average</b>.');
  const sl=slider(root,{label:'Duty cycle',min:0,max:100,step:1,value:10,fmt:v=>v+' %'});
  const cv=canvasIn(root,560,130);
  root.insertAdjacentHTML('beforeend',`<div class="row wrap" style="gap:24px"><svg viewBox="0 0 60 60" width="60" role="img" aria-label="LED"><circle class="led" cx="30" cy="30" r="18" stroke="var(--ink)" stroke-width="3"/></svg>
   <svg viewBox="0 0 70 70" width="70" role="img" aria-label="Motor fan"><circle cx="35" cy="35" r="32" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/><g class="fan"><path d="M35 35 L35 8 Q46 14 35 35 M35 35 L58 48 Q47 55 35 35 M35 35 L12 48 Q12 36 35 35" fill="var(--robot)" stroke="var(--ink)" stroke-width="2"/></g><circle cx="35" cy="35" r="5" fill="var(--ink)"/></svg></div>`);
  const ro=readout(root,['analogWrite value','Average voltage','Motor speed']);
  const T=tasks(root,['Run the motor at half speed (50 %)','Slow it down to 25 %','Speed it up to 75 %']);const TG=[50,25,75];let t=0,ang=0,raf;
  function draw(){const C=colors(),x=cv.x,d=sl.v/100;x.clearRect(0,0,560,130);x.strokeStyle=C.line;x.lineWidth=1;x.setLineDash([3,4]);x.beginPath();x.moveTo(10,110-80*d);x.lineTo(550,110-80*d);x.stroke();x.setLineDash([]);
    x.fillStyle=C.muted;x.font='11px JetBrains Mono, monospace';x.fillText('5 V',12,24);x.fillText('0 V',12,124);x.fillText('average '+(5*d).toFixed(2)+' V',420,104-80*d);
    x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();const P=180;let px=40;x.moveTo(px,110);for(let k=0;k<3;k++){const on=P*d*0.92;const s=40+k*P*0.92;if(on>0){x.lineTo(s,110);x.lineTo(s,30);x.lineTo(s+on,30);x.lineTo(s+on,110);}x.lineTo(s+P*0.92,110);}x.stroke();}
  function upd(){const d=sl.v;ro(0,Math.round(d*255/100));ro(1,(5*d/100).toFixed(2)+' V');ro(2,d+' %');root.querySelector('.led').setAttribute('fill',`rgba(242,178,0,${0.08+0.92*d/100})`);draw();
    if(t<3&&Math.abs(d-TG[t])<=1){T.done(t);t++;if(t===3){status('All speeds hit! analogWrite(pin, 191) gives 75 %.','ok');win();}else status(`Done! Now set ${TG[t]} %.`,'ok');}}
  function spin(){ang+=sl.v*0.15;const f=root.querySelector('.fan');if(f)f.setAttribute('transform',`rotate(${ang} 35 35)`);raf=requestAnimationFrame(spin);}
  sl.on(upd);upd();if(!RM)raf=requestAnimationFrame(spin);onClean(()=>cancelAnimationFrame(raf));
};

/* ---- ultrasonic ---- */
G.sonar=(root,cfg,win,status)=>{
  intro(root,'Bolt’s ultrasonic sensor shouts a sound you cannot hear, then listens for the echo. Sound travels about <b>343 m/s</b> (0.0343 cm per µs). Move the wall and watch the echo time.');
  const sl=slider(root,{label:'Wall distance',min:5,max:300,step:1,value:60,fmt:v=>v+' cm'});
  const cv=canvasIn(root,560,160);const ro=readout(root,['Distance','Echo time','Sound travels']);let p=0,raf;
  function draw(){const C=colors(),x=cv.x,d=sl.v,wx=80+d/300*460;x.clearRect(0,0,560,160);
    x.fillStyle=C.robot;x.strokeStyle=C.ink;x.lineWidth=3;x.fillRect(14,48,52,64);x.strokeRect(14,48,52,64);x.fillStyle=C.ink;[66,66].forEach((_,k)=>{x.beginPath();x.arc(70,66+k*28,9,0,7);x.fill();});
    x.fillStyle=C.ink;x.fillRect(wx,10,14,140);x.strokeStyle=C.muted;x.lineWidth=1;for(let yy=14;yy<150;yy+=10){x.beginPath();x.moveTo(wx+14,yy);x.lineTo(wx+22,yy-6);x.stroke();}
    if(!RM){const go=p<0.5,f=go?p*2:(1-p)*2,cx=80+(wx-80)*f;x.strokeStyle=go?C.acc:C.ok;x.lineWidth=3;for(let k=0;k<3;k++){x.globalAlpha=1-k*0.3;x.beginPath();x.arc(cx-(go?k*10:-k*10),80,16+k*6,go?-0.7:Math.PI-0.7,go?0.7:Math.PI+0.7);x.stroke();}x.globalAlpha=1;}
    x.fillStyle=C.muted;x.font='12px JetBrains Mono, monospace';x.fillText('trig → shout',8,140);x.fillText('← echo',wx-60,30);}
  function upd(){const d=sl.v;ro(0,d+' cm');ro(1,Math.round(d*2/0.0343)+' µs');ro(2,(2*d)+' cm (there and back)');draw();}
  function loop(){p=(p+0.012)%1;draw();raf=requestAnimationFrame(loop);}
  sl.on(upd);upd();if(!RM)raf=requestAnimationFrame(loop);onClean(()=>cancelAnimationFrame(raf));
  calcBlock(root,cfg.problems,()=>{status('You can turn echo time into distance!','ok');win();});
};

/* ---- noise filter ---- */
G.filter=(root,cfg,win,status)=>{
  intro(root,'The grey dots are a noisy sensor. At sample 50 the real value jumps from 2 to 6. A <b>moving average</b> of the last N readings smooths the noise, but a big N reacts slowly. Find a good N.');
  const sl=slider(root,{label:'Window size N',min:1,max:30,step:1,value:1,fmt:v=>v+' samples'});
  const cv=canvasIn(root,600,220);const ro=readout(root,['Noise left','Delay after the jump']);
  const T=tasks(root,['Cut the noise to about a third (36 % or less)','…while reacting to the jump within 12 samples']);
  function upd(){const r=filterRun(sl.v),C=colors(),x=cv.x,X=i=>20+i*4.8,Y=v=>200-v*22;x.clearRect(0,0,600,220);
    x.strokeStyle=C.line;x.lineWidth=1;[0,2,4,6,8].forEach(v=>{x.beginPath();x.moveTo(20,Y(v));x.lineTo(590,Y(v));x.stroke();x.fillStyle=C.muted;x.font='10px JetBrains Mono, monospace';x.fillText(v,4,Y(v)+3);});
    x.fillStyle=C.muted;r.raw.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v),2.4,0,7);x.fill();});
    x.setLineDash([5,5]);x.strokeStyle=C.ok;x.lineWidth=2;x.beginPath();r.truth.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.setLineDash([]);
    x.strokeStyle=C.ink;x.lineWidth=5;x.beginPath();r.filt.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.strokeStyle=C.robot;x.lineWidth=2.5;x.stroke();
    x.fillStyle=C.muted;x.fillText('grey: raw   dashed: true value   yellow: filtered',300,14);
    ro(0,Math.round(r.ratio*100)+' %');ro(1,r.lag+' samples');
    if(r.ratio<=0.36)T.done(0);if(r.ratio<=0.36&&r.lag<=12)T.done(1);
    if(r.win){status(`N = ${sl.v} works: smooth and still quick.`,'ok');win();}
    else status(r.ratio>0.36?'Still too shaky. Make N bigger.':'Smooth, but too slow to follow the jump. Make N smaller.','bad');}
  sl.on(upd);upd();
};

/* ---- H-bridge ---- */
G.hbridge=(root,cfg,win,status)=>{
  intro(root,'Four switches make an <b>H</b> around the motor. Tap a switch to open or close it. Make the motor spin both ways. Careful: closing two switches on the <b>same side</b> connects + straight to ground. That is a short circuit!');
  const sw=[0,0,0,0];
  root.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 360 260" width="100%" style="max-width:520px" role="group" aria-label="H-bridge">
  <line x1="40" y1="30" x2="320" y2="30" stroke="var(--bad)" stroke-width="4"/><text x="180" y="20" text-anchor="middle" font-size="13" fill="var(--bad)" font-family="JetBrains Mono,monospace">+ 9 V</text>
  <line x1="40" y1="230" x2="320" y2="230" stroke="var(--ink)" stroke-width="4"/><text x="180" y="252" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="JetBrains Mono,monospace">GND (0 V)</text>
  ${[[80,30,1],[280,30,2],[80,130,3],[280,130,4]].map(([xx,y0,n])=>`<line x1="${xx}" y1="${y0}" x2="${xx}" y2="${y0+30}" stroke="var(--ink)" stroke-width="3"/><line x1="${xx}" y1="${y0+70}" x2="${xx}" y2="${y0+100}" stroke="var(--ink)" stroke-width="3"/><circle cx="${xx}" cy="${y0+30}" r="4" fill="var(--ink)"/><circle cx="${xx}" cy="${y0+70}" r="4" fill="var(--ink)"/><line class="s${n}" x1="${xx}" y1="${y0+30}" x2="${xx+24}" y2="${y0+64}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><text x="${xx<180?xx-40:xx+18}" y="${y0+56}" font-size="14" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono,monospace">S${n}</text><rect data-s="${n-1}" x="${xx-34}" y="${y0+22}" width="68" height="56" fill="transparent" style="cursor:pointer" tabindex="0" role="button" aria-label="Switch S${n}"/>`).join('')}
  <line x1="80" y1="130" x2="152" y2="130" stroke="var(--ink)" stroke-width="3"/><line x1="208" y1="130" x2="280" y2="130" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="180" cy="130" r="28" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/><g class="rotor"><path d="M180 108 L186 130 L180 152 L174 130 Z" fill="var(--robot)" stroke="var(--ink)" stroke-width="2"/></g><text x="180" y="176" text-anchor="middle" font-size="12" font-family="JetBrains Mono,monospace" fill="var(--muted)">MOTOR</text>
  </svg>`);
  const ro=readout(root,['Switches closed','Motor']);const T=tasks(root,['Spin the motor forward','Spin it in reverse']);let ang=0,dir=0,raf;
  function upd(){sw.forEach((s,i)=>{const l=root.querySelector('.s'+(i+1)),x1=+l.getAttribute('x1');l.setAttribute('x2',s?x1:x1+24);l.setAttribute('y2',s?+l.getAttribute('y1')+40:+l.getAttribute('y1')+34);l.setAttribute('stroke',s?'var(--ok)':'var(--ink)');});
    const [a,b,c,d]=sw;ro(0,sw.map((s,i)=>s?'S'+(i+1):'').filter(Boolean).join(' + ')||'none');
    if((a&&c)||(b&&d)){dir=0;ro(1,'SHORT CIRCUIT!');status('Short circuit! S1+S3 or S2+S4 connects + straight to GND. In real life the driver would burn. This is called shoot-through.','bad');return;}
    if(a&&d&&!b&&!c){dir=1;ro(1,'Forward ↻');T.done(0);status('Forward! Current flows S1 → motor → S4.','ok');}
    else if(b&&c&&!a&&!d){dir=-1;ro(1,'Reverse ↺');T.done(1);status('Reverse! Current flows S2 → motor → S3, the other way.','ok');}
    else if((c&&d&&!a&&!b)||(a&&b&&!c&&!d)){dir=0;ro(1,'Brake');status('Brake: both motor wires are joined, so the motor stops quickly.');}
    else{dir=0;ro(1,'Off (coasting)');status('No full path for current, so the motor is off.');}
    if(T.all())win();}
  root.querySelectorAll('rect[data-s]').forEach(r=>{const f=()=>{sw[+r.dataset.s]^=1;upd();};r.addEventListener('click',f);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});});
  function loop(){ang+=dir*6;const g=root.querySelector('.rotor');if(g)g.setAttribute('transform',`rotate(${ang} 180 130)`);raf=requestAnimationFrame(loop);}
  upd();if(!RM)raf=requestAnimationFrame(loop);onClean(()=>cancelAnimationFrame(raf));
};

/* ---- gears ---- */
function gearDraw(x,C,cx,cy,teeth,ang,fill){const r=teeth*1.6,ro=r+4,ri=r-4;x.beginPath();for(let i=0;i<teeth;i++){const a=ang+i*2*Math.PI/teeth,s=Math.PI/teeth;[[ri,a-s*0.5],[ro,a-s*0.3],[ro,a+s*0.3],[ri,a+s*0.5]].forEach(([rr,aa],k)=>{const px=cx+rr*Math.cos(aa),py=cy+rr*Math.sin(aa);(i||k)?x.lineTo(px,py):x.moveTo(px,py);});x.lineTo(cx+ri*Math.cos(a+s*1.5),cy+ri*Math.sin(a+s*1.5));}
  x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=C.ink;x.lineWidth=2;x.stroke();x.beginPath();x.arc(cx,cy,Math.max(4,r*0.18),0,7);x.fillStyle=C.ink;x.fill();x.strokeStyle=C.ink;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+ri*0.8*Math.cos(ang),cy+ri*0.8*Math.sin(ang));x.lineWidth=3;x.stroke();}
G.gears=(root,cfg,win,status)=>{
  intro(root,'Bolt’s motor spins at <b>100 RPM</b> with <b>0.5 N·m</b> of torque (turning force). Gears trade speed for torque. <span class="f">ratio = driven teeth ÷ driver teeth</span>');
  const D1=[10,12,15,20],D2=[10,20,30,40,60];let a=3,b=1,ang=0,raf;

  function draw(){const C=colors(),x=cv.x;x.clearRect(0,0,520,230);const t1=D1[a],t2=D2[b],r1=t1*1.6,r2=t2*1.6,cx1=260-(r1+r2)/2,cx2=cx1+r1+r2;

/* ---- battery planner ---- */
G.battery=(root,cfg,win,status)=>{

/* ===== Mini-games part 2: control, kinematics, navigation, vision ===== */

/* ---- PID tuning ---- */
G.pid=(root,cfg,win,status)=>{
  intro(root,'Bolt’s cart must drive to the flag at <b>1.0 m</b> and stop there. A hill keeps pushing it back. Tune the three numbers. To win: overshoot <b>10 % or less</b>, settles within <b>3 s</b>, ends within <b>2 cm</b> of the flag.');
  root.insertAdjacentHTML('beforeend','<div class="row wrap"><span class="small muted">Quick tries:</span><button class="btn sm ghost" data-p="2,0,0">P weak</button><button class="btn sm ghost" data-p="20,0,0">P strong</button><button class="btn sm ghost" data-p="20,0,2">PD</button><button class="btn sm ghost" data-p="10,5,0">PI</button></div>');
  const kp=slider(root,{label:'Kp · now',min:0,max:30,step:0.5,value:2,fmt:v=>v.toFixed(1)});
  const ki=slider(root,{label:'Ki · past',min:0,max:20,step:0.5,value:0,fmt:v=>v.toFixed(1)});
  const kd=slider(root,{label:'Kd · future',min:0,max:10,step:0.1,value:0,fmt:v=>v.toFixed(1)});
  const strip=canvasIn(root,600,80),cv=canvasIn(root,600,240);const ro=readout(root,['Overshoot','Settling time','Final error']);
  let r,raf,t0;const X=t=>44+t/8*546,Y=v=>214-(v+0.6)/2.2*196;
  function plot(tc){const C=colors(),x=cv.x;x.clearRect(0,0,600,240);
    x.fillStyle=C.tint;x.fillRect(44,Y(1.05),546,Y(0.95)-Y(1.05));
    x.font='10px JetBrains Mono, monospace';x.lineWidth=1;[-0.5,0,0.5,1,1.5].forEach(v=>{x.strokeStyle=C.line;x.beginPath();x.moveTo(44,Y(v));x.lineTo(590,Y(v));x.stroke();x.fillStyle=C.muted;x.fillText(v.toFixed(1)+' m',2,Y(v)+3);});
    [0,2,4,6,8].forEach(t=>{x.fillStyle=C.muted;x.fillText(t+' s',X(t)-8,234);});
    x.setLineDash([6,5]);x.strokeStyle=C.bad;x.lineWidth=2;x.beginPath();x.moveTo(44,Y(1));x.lineTo(590,Y(1));x.stroke();x.setLineDash([]);
    x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();r.xs.forEach((v,i)=>{const px=X(i*r.tS),py=Math.max(-20,Math.min(260,Y(v)));i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();
    if(tc!=null){x.strokeStyle=C.robot;x.lineWidth=2;x.beginPath();x.moveTo(X(tc),10);x.lineTo(X(tc),220);x.stroke();}
    x.fillStyle=C.muted;x.fillText('position over time · red dashed = flag · shaded = within 5 %',50,14);}
  function cart(t){const C=colors(),x=strip.x,i=Math.min(r.xs.length-1,Math.round(t/r.tS)),pos=r.xs[i],PX=v=>70+(v+0.6)/2.2*500;x.clearRect(0,0,600,80);
    x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.moveTo(10,64);x.lineTo(590,64);x.stroke();
    x.fillStyle=C.muted;x.font='11px JetBrains Mono, monospace';x.fillText('← hill pushes back',10,78);
    const fx=PX(1);x.strokeStyle=C.ink;x.lineWidth=2;x.beginPath();x.moveTo(fx,64);x.lineTo(fx,14);x.stroke();x.fillStyle=C.bad;x.beginPath();x.moveTo(fx,14);x.lineTo(fx+22,20);x.lineTo(fx,27);x.fill();
    const cx=Math.max(-30,Math.min(630,PX(pos)));x.fillStyle=C.robot;x.strokeStyle=C.ink;x.lineWidth=2.5;x.fillRect(cx-22,36,44,20);x.strokeRect(cx-22,36,44,20);x.fillStyle=C.ink;[cx-13,cx+13].forEach(wx=>{x.beginPath();x.arc(wx,58,6,0,7);x.fill();});
    x.fillStyle=C.ink;x.fillText(pos.toFixed(2)+' m',cx-18,30);}
  function anim(now){const t=Math.min(8,(now-t0)/1000*2);cart(t);plot(t);if(t<8)raf=requestAnimationFrame(anim);}
  function upd(){r=simPID(kp.v,ki.v,kd.v);ro(0,r.over.toFixed(1)+' %');ro(1,isFinite(r.settle)?r.settle.toFixed(2)+' s':'never');ro(2,(r.sse*100).toFixed(1)+' cm');
    cancelAnimationFrame(raf);if(RM){cart(8);plot();}else{t0=performance.now();raf=requestAnimationFrame(anim);}
    if(r.win){status(`Tuned! Overshoot ${r.over.toFixed(1)} %, settles in ${r.settle.toFixed(2)} s. You are a control engineer.`,'ok');win();}
    else if(r.xs[r.xs.length-1]<0.2)status('The hill wins and the cart rolls back. Kp is far too small.','bad');
    else if(r.sse>0.02&&ki.v===0)status('It stops short of the flag. That gap is steady-state error. Add some Ki.'+(r.over>10?' It also overshoots, so keep some Kd.':''),'bad');
    else if(r.over>10)status('It shoots past the flag (overshoot). Add Kd to brake, or lower Kp or Ki.','bad');
    else if(r.settle>3)status('Close, but it takes too long to settle. Try a bit more Kp, or adjust Ki and Kd.','bad');
    else status('Almost there. Small changes now.','');}
  root.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const [p,i,d]=b.dataset.p.split(',').map(Number);kp.v=p;ki.v=i;kd.v=d;upd();});
  kp.on(upd);ki.on(upd);kd.on(upd);upd();onClean(()=>cancelAnimationFrame(raf));
};

/* ---- line follower ---- */
G.linefollow=(root,cfg,win,status)=>{
  intro(root,'Bolt follows the black line using an IR sensor bar on its nose. The sensor says how far Bolt is from the line: the <b>error</b>. <span class="f">steering = Kp × error + Kd × change in error</span> Get Bolt round one full lap.');
  const kp=slider(root,{label:'Kp',min:0,max:10,step:0.5,value:4,fmt:v=>v.toFixed(1)});const kd=slider(root,{label:'Kd',min:0,max:2,step:0.05,value:0,fmt:v=>v.toFixed(2)});
  root.insertAdjacentHTML('beforeend','<div class="row"><button class="btn sm go" data-run>▶ Start</button><button class="btn sm ghost" data-reset>Reset</button></div>');
  const cv=canvasIn(root,600,360);const ro=readout(root,['Error now','Lap progress','Time']);const P=trackPts();
  let sim=LineSim(kp.v,kd.v),running=false,raf,last;
  function draw(){const C=colors(),x=cv.x;x.clearRect(0,0,600,360);x.lineJoin='round';x.strokeStyle=C.ink;x.lineWidth=12;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
    x.strokeStyle=C.robot;x.lineWidth=4;x.beginPath();x.moveTo(P[0][0]-20,P[0][1]);x.lineTo(P[0][0]+20,P[0][1]);x.stroke();x.fillStyle=C.muted;x.font='11px JetBrains Mono, monospace';x.fillText('START',P[0][0]+24,P[0][1]+4);
    x.strokeStyle=C.bad;x.lineWidth=2;x.beginPath();sim.trail.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    x.save();x.translate(sim.x,sim.y);x.rotate(sim.th);x.fillStyle=C.ink;x.fillRect(-12,-15,12,4);x.fillRect(-12,11,12,4);x.fillStyle=C.robot;x.strokeStyle=C.ink;x.lineWidth=2.5;x.fillRect(-16,-11,26,22);x.strokeRect(-16,-11,26,22);x.fillStyle=C.ink;x.fillRect(11,-18,5,36);x.restore();}
  function hud(){ro(0,sim.e.toFixed(2));ro(1,Math.max(0,Math.min(100,Math.round(sim.prog/sim.N*100))));ro(2,sim.t.toFixed(1)+' s');}
  function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;let n=Math.max(1,Math.round(dt*120));while(n--){sim.step(1/120);if(sim.crashed||sim.lap)break;}
    sim.trail.push([sim.x,sim.y]);if(sim.trail.length>1200)sim.trail.shift();draw();hud();
    if(sim.lap){running=false;status(`Full lap in ${sim.t.toFixed(1)} s! ${kd.v>0?'Kd damped the wobble.':''}`,'ok');win();return;}
    if(sim.crashed){running=false;status(sim.t>39?'Bolt is going round in circles. Try other values.':kd.v===0&&kp.v>=1.5?'Bolt wobbled more and more and left the line. That growing wobble is what P alone does. Add some Kd to calm it.':kp.v<1.5?'Bolt could not turn hard enough on the curve. Raise Kp.':'Off the line! Try a different mix of Kp and Kd.','bad');return;}
    raf=requestAnimationFrame(loop);}
  function reset(){cancelAnimationFrame(raf);running=false;sim=LineSim(kp.v,kd.v);draw();hud();}
  root.querySelector('[data-run]').onclick=()=>{if(running)return;if(sim.crashed||sim.lap||sim.t>0)reset();running=true;status('Racing…');last=performance.now();raf=requestAnimationFrame(loop);};
  root.querySelector('[data-reset]').onclick=()=>{reset();status('Reset. Press Start.');};
  const ch=()=>{reset();status('New settings. Press Start.');};kp.on(ch);kd.on(ch);reset();onClean(()=>cancelAnimationFrame(raf));
};

/* ---- arm helpers ---- */
function armGrid(x,C,bx,by,S,R){x.clearRect(0,0,420,330);x.strokeStyle=C.line;x.lineWidth=1;for(let g=-20;g<=20;g+=2){x.beginPath();x.moveTo(bx+g*S,0);x.lineTo(bx+g*S,by);x.stroke();}for(let g=0;g<=28;g+=2){x.beginPath();x.moveTo(0,by-g*S);x.lineTo(420,by-g*S);x.stroke();}
  x.setLineDash([4,6]);x.strokeStyle=C.muted;x.beginPath();x.arc(bx,by,R*S,Math.PI,2*Math.PI);x.stroke();x.setLineDash([]);x.fillStyle=C.muted;x.font='10px JetBrains Mono, monospace';x.fillText('1 square = 2 cm · dashed = max reach',8,14);}
function star(x,cx,cy,r,fill,stroke){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;i?x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):x.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=1.5;x.stroke();}

/* ---- forward kinematics ---- */
G.fk=(root,cfg,win,status)=>{
  intro(root,'Bolt’s arm has two parts: upper arm <b>L1 = 10 cm</b> and forearm <b>L2 = 8 cm</b>. Set the two joint angles. The maths tells you where the hand ends up. Touch each red target.');
  const a1=slider(root,{label:'θ1 shoulder',min:0,max:180,step:1,value:90,fmt:v=>v+'°'}),a2=slider(root,{label:'θ2 elbow',min:-160,max:160,step:1,value:0,fmt:v=>v+'°'});
  const cv=canvasIn(root,420,330);root.insertAdjacentHTML('beforeend','<span class="fbig"></span>');
  const TG=[[60,-30],[120,45],[30,90]].map(([p,q])=>{const r1=p*Math.PI/180,r2=q*Math.PI/180;return [10*Math.cos(r1)+8*Math.cos(r1+r2),10*Math.sin(r1)+8*Math.sin(r1+r2)];});
  const T=tasks(root,['Touch target 1','Touch target 2','Touch target 3']);let t=0;const S=11,bx=210,by=300;
  function upd(){const C=colors(),x=cv.x,t1=a1.v*Math.PI/180,t2=a2.v*Math.PI/180,hx=10*Math.cos(t1)+8*Math.cos(t1+t2),hy=10*Math.sin(t1)+8*Math.sin(t1+t2);
    let msg='';if(t<3){const d=Math.hypot(hx-TG[t][0],hy-TG[t][1]);if(d<=0.6){T.done(t);t++;msg=t<3?'Touched! Next target.':'All targets touched. That is forward kinematics!';if(t===3)win();}}
    armGrid(x,C,bx,by,S,18);
    if(t<3){const [gx,gy]=TG[t];x.strokeStyle=C.bad;x.lineWidth=3;x.beginPath();x.arc(bx+gx*S,by-gy*S,9,0,7);x.stroke();x.fillStyle=C.bad;x.beginPath();x.arc(bx+gx*S,by-gy*S,3,0,7);x.fill();}
    drawArm(x,C,bx,by,10*S,8*S,t1,t2,16);x.fillStyle=C.ink;x.font='12px JetBrains Mono, monospace';x.fillText(`hand (${hx.toFixed(1)}, ${hy.toFixed(1)})`,Math.min(330,bx+hx*S+12),Math.max(28,by-hy*S-12));
    root.querySelector('.fbig').textContent=`x = 10·cos(${a1.v}°) + 8·cos(${a1.v+a2.v}°) = ${hx.toFixed(1)} cm\ny = 10·sin(${a1.v}°) + 8·sin(${a1.v+a2.v}°) = ${hy.toFixed(1)} cm`;
    if(msg)status(msg,'ok');else if(t<3)status(`Target ${t+1} is at (${TG[t][0].toFixed(1)}, ${TG[t][1].toFixed(1)}) cm. Your hand is ${Math.hypot(hx-TG[t][0],hy-TG[t][1]).toFixed(1)} cm away.`);}
  a1.on(upd);a2.on(upd);upd();
};

/* ---- inverse kinematics ---- */
G.ik=(root,cfg,win,status)=>{
  intro(root,'Now the other way round. <b>Drag the red target</b> and the arm works out θ1 and θ2 by itself. Most points have two answers: elbow up and elbow down.');
  root.insertAdjacentHTML('beforeend','<div class="row"><button class="tog" data-elb aria-pressed="false">Elbow: down</button></div>');
  const cv=canvasIn(root,420,330);root.insertAdjacentHTML('beforeend','<span class="fbig"></span>');
  const T=tasks(root,['Drag the target out of the arm’s reach (it turns grey)','Switch between elbow up and elbow down','Put the target on the gold star']);
  const S=11,bx=210,by=300,SX=-6,SY=9;let tx=8,ty=8,up=false,drag=false;const eb=root.querySelector('[data-elb]');
  eb.onclick=()=>{up=!up;eb.setAttribute('aria-pressed',up);eb.textContent='Elbow: '+(up?'up':'down');T.done(1);upd();};
  function solve(){const d2=tx*tx+ty*ty,d=Math.sqrt(d2);const reach=d<=18&&d>=2;let t1,t2,c2=(d2-164)/160;
    if(!reach){t1=Math.atan2(ty,tx);t2=d>18?0:(up?-1:1)*Math.PI*0.92;}else{t2=Math.acos(Math.max(-1,Math.min(1,c2)));if(up)t2=-t2;t1=Math.atan2(ty,tx)-Math.atan2(8*Math.sin(t2),10+8*Math.cos(t2));}
    return {t1,t2,reach,c2};}
  function upd(){const C=colors(),x=cv.x,s=solve();armGrid(x,C,bx,by,S,18);star(x,bx+SX*S,by-SY*S,12,C.robot,C.ink);drawArm(x,C,bx,by,10*S,8*S,s.t1,s.t2,16);
    x.strokeStyle=s.reach?C.bad:C.muted;x.lineWidth=3;x.beginPath();x.arc(bx+tx*S,by-ty*S,10,0,7);x.moveTo(bx+tx*S-15,by-ty*S);x.lineTo(bx+tx*S+15,by-ty*S);x.moveTo(bx+tx*S,by-ty*S-15);x.lineTo(bx+tx*S,by-ty*S+15);x.stroke();
    const D=v=>Math.round(v*180/Math.PI);
    root.querySelector('.fbig').textContent=s.reach?`target (${tx.toFixed(1)}, ${ty.toFixed(1)}) cm\ncos θ2 = (x² + y² − 10² − 8²) ÷ (2·10·8) = ${s.c2.toFixed(2)}  →  θ2 = ${D(s.t2)}°\nθ1 = atan2(y, x) − atan2(8·sin θ2, 10 + 8·cos θ2) = ${D(s.t1)}°`:`target (${tx.toFixed(1)}, ${ty.toFixed(1)}) cm is ${Math.hypot(tx,ty).toFixed(1)} cm away.\nThe arm reaches only between 2 cm and 18 cm. No answer exists!`;
    if(!s.reach)T.done(0);if(Math.hypot(tx-SX,ty-SY)<=0.6&&s.reach)T.done(2);
    if(T.all()){status('IK master! The arm found its own angles.','ok');win();}else status(s.reach?`θ1 = ${D(s.t1)}°, θ2 = ${D(s.t2)}°`:'Out of reach. No angles can get there.',s.reach?'':'bad');}
  const mv=e=>{const [px,py]=cv.pt(e);tx=(px-bx)/S;ty=(by-py)/S;upd();};
  cv.c.addEventListener('pointerdown',e=>{drag=true;try{cv.c.setPointerCapture(e.pointerId);}catch(_){}mv(e);});cv.c.addEventListener('pointermove',e=>{if(drag)mv(e);});
  ['pointerup','pointercancel'].forEach(n=>cv.c.addEventListener(n,()=>{drag=false;}));upd();
};

/* ---- differential drive ---- */
G.diffdrive=(root,cfg,win,status)=>{
  intro(root,'Bolt has two wheels, <b>2 units apart</b>. Set each wheel’s speed and how long to drive, then press Drive. <span class="f">v = (vR + vL) ÷ 2</span> <span class="f">ω = (vR − vL) ÷ 2</span> Each run starts again from the start.');
  const vl=slider(root,{label:'Left wheel vL',min:-5,max:5,step:0.5,value:2,fmt:v=>v.toFixed(1)}),vr=slider(root,{label:'Right wheel vR',min:-5,max:5,step:0.5,value:1,fmt:v=>v.toFixed(1)}),tm=slider(root,{label:'Drive time',min:0.5,max:6,step:0.1,value:2,fmt:v=>v.toFixed(1)+' s'});
  root.insertAdjacentHTML('beforeend','<div class="row"><button class="btn sm go" data-go2>▶ Drive</button></div>');
  const cv=canvasIn(root,560,340);const ro=readout(root,['Forward speed v','Turn speed ω','Turn radius']);
  const GO=[[6,0],[3,3]],T=tasks(root,['Drive straight onto flag 1','Curve onto flag 2']);let g=0,path=[],raf,pose=[0,0,0];
  const PX=(x,y)=>[60+x*40,300-y*40];
  function info(){const v=(vr.v+vl.v)/2,w=(vr.v-vl.v)/2;ro(0,v.toFixed(2));ro(1,w.toFixed(2)+' rad/s');ro(2,Math.abs(w)<1e-9?'straight line':Math.abs(v)<1e-9?'spins on the spot':(Math.abs(v/w)).toFixed(2)+' units');}
  function draw(){const C=colors(),x=cv.x;x.clearRect(0,0,560,340);x.strokeStyle=C.line;x.lineWidth=1;for(let i=0;i<=13;i++){const [a]=PX(i,0);x.beginPath();x.moveTo(a,0);x.lineTo(a,340);x.stroke();}for(let j=-1;j<=7;j++){const [,b]=PX(0,j);x.beginPath();x.moveTo(0,b);x.lineTo(560,b);x.stroke();}
    GO.forEach(([gx,gy],k)=>{if(k<g)return;const [a,b]=PX(gx,gy);x.globalAlpha=k===g?1:0.3;x.strokeStyle=C.bad;x.lineWidth=2;x.beginPath();x.arc(a,b,16,0,7);x.stroke();x.strokeStyle=C.ink;x.beginPath();x.moveTo(a,b);x.lineTo(a,b-28);x.stroke();x.fillStyle=C.bad;x.beginPath();x.moveTo(a,b-28);x.lineTo(a+16,b-23);x.lineTo(a,b-18);x.fill();x.globalAlpha=1;x.fillStyle=C.muted;x.font='11px JetBrains Mono, monospace';x.fillText('flag '+(k+1),a+8,b+28);});
    x.strokeStyle=C.ink;x.lineWidth=2.5;x.beginPath();path.forEach((p,i)=>{const [a,b]=PX(p[0],p[1]);i?x.lineTo(a,b):x.moveTo(a,b);});x.stroke();
    const [a,b]=PX(pose[0],pose[1]);x.save();x.translate(a,b);x.rotate(-pose[2]);x.fillStyle=C.ink;x.fillRect(-12,-20,22,6);x.fillRect(-12,14,22,6);x.fillStyle=C.robot;x.strokeStyle=C.ink;x.lineWidth=2.5;x.fillRect(-16,-15,32,30);x.strokeRect(-16,-15,32,30);x.fillStyle=C.ink;x.beginPath();x.moveTo(16,-7);x.lineTo(24,0);x.lineTo(16,7);x.fill();x.restore();}
  root.querySelector('[data-go2]').onclick=()=>{cancelAnimationFrame(raf);const v=(vr.v+vl.v)/2,w=(vr.v-vl.v)/2,dt=0.01,n=Math.round(tm.v/dt);let p=[0,0,0];const pts=[[0,0,0]];for(let i=0;i<n;i++){p=[p[0]+v*Math.cos(p[2])*dt,p[1]+v*Math.sin(p[2])*dt,p[2]+w*dt];pts.push(p);}

      const [gx,gy]=GO[Math.min(g,1)],d=Math.hypot(pose[0]-gx,pose[1]-gy);

};

/* ---- Kalman ---- */
G.kalman=(root,cfg,win,status)=>{
  intro(root,'Bolt drives back and forth. Its <b>motion model</b> says where it should be, but the wheels slip. Its <b>position sensor</b> is very noisy (grey dots). The Kalman filter mixes both. Tune how much it trusts each. Win: make the filter error at most 60 % of the sensor error.');
  const rs=slider(root,{label:'R · sensor noise (higher = trust sensor less)',min:0,max:100,step:1,value:0,fmt:v=>(0.5*Math.pow(100,v/100)).toFixed(2)});
  const qs=slider(root,{label:'Q · motion noise (higher = trust model less)',min:0,max:100,step:1,value:100,fmt:v=>(0.01*Math.pow(500,v/100)).toFixed(2)});
  const cv=canvasIn(root,600,240);const ro=readout(root,['Sensor error','Filter error','Kalman gain K']);
  function upd(){const R=0.5*Math.pow(100,rs.v/100),Q=0.01*Math.pow(500,qs.v/100),r=kalmanRun(R,Q),C=colors(),x=cv.x;x.clearRect(0,0,600,240);
    const all=r.truth.concat(r.meas),mn=Math.min(...all),mx=Math.max(...all),X=i=>30+i*7.1,Y=v=>220-(v-mn)/(mx-mn)*200;
    x.strokeStyle=C.line;x.lineWidth=1;for(let k=0;k<=4;k++){x.beginPath();x.moveTo(30,20+k*50);x.lineTo(590,20+k*50);x.stroke();}
    x.fillStyle=C.muted;r.meas.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v),2.6,0,7);x.fill();});
    x.setLineDash([5,5]);x.strokeStyle=C.ok;x.lineWidth=2;x.beginPath();r.truth.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.setLineDash([]);
    x.strokeStyle=C.ink;x.lineWidth=5;x.beginPath();r.est.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.strokeStyle=C.robot;x.lineWidth=2.5;x.stroke();
    x.fillStyle=C.muted;x.font='10px JetBrains Mono, monospace';x.fillText('grey: sensor   dashed: real position   yellow: Kalman estimate',34,14);
    ro(0,r.rawE.toFixed(2)+' m');ro(1,r.estE.toFixed(2)+' m');ro(2,r.K.toFixed(2));
    if(r.win){status(`Balanced! The filter is ${Math.round((1-r.estE/r.rawE)*100)} % better than the raw sensor.`,'ok');win();}
    else if(r.K>0.5)status('K is near 1, so it copies the noisy sensor. Raise R or lower Q.','bad');
    else if(r.K<0.12)status('K is near 0, so it trusts the slipping wheels and drifts away. Lower R or raise Q.','bad');
    else status('Getting closer. Keep balancing R and Q.');}
  rs.on(upd);qs.on(upd);upd();
};

/* ---- path planning ---- */
G.astar=(root,cfg,win,status)=>{
  intro(root,'Draw on the map (tap or drag), then let a planner find a path from <b>S</b> to <b>G</b>. Mud squares cost <b>5</b> to cross, normal squares cost 1. Compare how many squares each planner explores. Run at least two different planners.');
  const W=24,H=14,CS=25;let cells=new Uint8Array(W*H),brush=1,res=null,shown=0,raf,algoName='';const st=[2,7],gl=[21,7],used=new Set();
  const preset=()=>{cells=new Uint8Array(W*H);for(let y=1;y<13;y++)if(y!==11)cells[y*W+12]=1;for(let x=4;x<9;x++)for(let y=5;y<10;y++)cells[y*W+x]=2;};preset();
  seg(root,'Brush',['Wall','Mud','Eraser'],0,k=>{brush=[1,2,0][k];});
  root.insertAdjacentHTML('beforeend','<div class="row wrap"><button class="btn sm" data-a="bfs">BFS</button><button class="btn sm" data-a="dijkstra">Dijkstra</button><button class="btn sm" data-a="astar">A*</button><button class="btn sm" data-a="greedy">Greedy</button><button class="btn sm ghost" data-clear>Clear map</button><button class="btn sm ghost" data-preset>Example map</button></div>');
  const cv=canvasIn(root,W*CS,H*CS);const ro=readout(root,['Planner','Squares explored','Path steps','Path cost']);
  const NM={bfs:'BFS',dijkstra:'Dijkstra',astar:'A*',greedy:'Greedy'};
  function draw(){const C=colors(),x=cv.x;x.clearRect(0,0,W*CS,H*CS);
    for(let i=0;i<W*H;i++){const cx=(i%W)*CS,cy=Math.floor(i/W)*CS;x.fillStyle=cells[i]===1?C.ink:cells[i]===2?'#8B6B43':C.panel;x.fillRect(cx,cy,CS,CS);if(cells[i]===2){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(cx+5,cy+8,6,3);x.fillRect(cx+14,cy+15,6,3);}}
    if(res){x.fillStyle=C.tint;x.globalAlpha=1;res.order.slice(0,shown).forEach(i=>{if(cells[i]!==1){x.fillStyle='rgba(242,178,0,.38)';x.fillRect((i%W)*CS+1,Math.floor(i/W)*CS+1,CS-2,CS-2);}});
      if(shown>=res.order.length&&res.path.length){x.strokeStyle=C.bad;x.lineWidth=4;x.lineJoin='round';x.beginPath();res.path.forEach((i,k)=>{const px=(i%W)*CS+CS/2,py=Math.floor(i/W)*CS+CS/2;k?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();}}
    x.strokeStyle=C.line;x.lineWidth=1;for(let i=0;i<=W;i++){x.beginPath();x.moveTo(i*CS,0);x.lineTo(i*CS,H*CS);x.stroke();}for(let j=0;j<=H;j++){x.beginPath();x.moveTo(0,j*CS);x.lineTo(W*CS,j*CS);x.stroke();}
    [[st,'S',C.ok],[gl,'G',C.bad]].forEach(([p,l,c])=>{x.fillStyle=c;x.fillRect(p[0]*CS+2,p[1]*CS+2,CS-4,CS-4);x.fillStyle='#fff';x.font='bold 14px JetBrains Mono, monospace';x.textAlign='center';x.fillText(l,p[0]*CS+CS/2,p[1]*CS+CS/2+5);x.textAlign='left';});}
  function run(a){cancelAnimationFrame(raf);res=planGrid(W,H,cells,st,gl,a);shown=0;algoName=a;ro(0,NM[a]);ro(1,'…');ro(2,'…');ro(3,'…');
    const step=()=>{shown=Math.min(res.order.length,shown+(RM?9999:5));draw();if(shown<res.order.length){raf=requestAnimationFrame(step);return;}
      ro(1,res.order.length);ro(2,res.path.length?res.path.length-1:'none');ro(3,res.path.length?res.pathCost:'none');
      if(!res.path.length){status('No path! The goal is walled off. Erase a wall.','bad');return;}
      used.add(a);const tips={bfs:'BFS spreads out in rings and ignores mud cost.',dijkstra:'Dijkstra always finds the cheapest path, but explores a lot.',astar:'A* uses a guess of the distance to the goal, so it explores far fewer squares and still finds the cheapest path.',greedy:'Greedy rushes toward the goal. Fast, but the path is not always the cheapest.'};
      status(tips[a]+(used.size>=2?' You compared planners!':' Now try another planner.'),used.size>=2?'ok':'');if(used.size>=2)win();};
    raf=requestAnimationFrame(step);}
  root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(b.dataset.a));
  root.querySelector('[data-clear]').onclick=()=>{cells=new Uint8Array(W*H);res=null;draw();};root.querySelector('[data-preset]').onclick=()=>{preset();res=null;draw();};
  let painting=false;const paint=e=>{const [px,py]=cv.pt(e);const cx=Math.floor(px/CS),cy=Math.floor(py/CS);if(cx<0||cy<0||cx>=W||cy>=H)return;if((cx===st[0]&&cy===st[1])||(cx===gl[0]&&cy===gl[1]))return;const i=cy*W+cx;if(cells[i]!==brush){cells[i]=brush;res=null;draw();}};
  cv.c.addEventListener('pointerdown',e=>{painting=true;try{cv.c.setPointerCapture(e.pointerId);}catch(_){}paint(e);});cv.c.addEventListener('pointermove',e=>{if(painting)paint(e);});['pointerup','pointercancel'].forEach(n=>cv.c.addEventListener(n,()=>{painting=false;}));
  draw();onClean(()=>cancelAnimationFrame(raf));
};

/* ---- computer vision ---- */
G.vision=(root,cfg,win,status)=>{
  intro(root,'Bolt’s camera sees the picture on the left. Every pixel has a <b>hue</b> (which colour, 0–360°), a <b>saturation</b> (how strong the colour is) and a <b>brightness</b>. Choose ranges so that only the <b>blue ball</b> turns white in the mask on the right.');
  const sc=visionScene();
  const hb=canvasIn(root,600,20);{const x=hb.x;for(let h=0;h<360;h++){x.fillStyle=`hsl(${h},85%,55%)`;x.fillRect(h/360*600,0,600/360+1,20);}}
  const h1=slider(root,{label:'Hue from',min:0,max:360,step:1,value:0,fmt:v=>v+'°'}),h2=slider(root,{label:'Hue to',min:0,max:360,step:1,value:360,fmt:v=>v+'°'}),s1=slider(root,{label:'Min saturation',min:0,max:100,step:1,value:0,fmt:v=>v+' %'}),v1=slider(root,{label:'Min brightness',min:0,max:100,step:1,value:0,fmt:v=>v+' %'});
  root.insertAdjacentHTML('beforeend','<div class="two vis"></div>');const box=root.querySelector('.vis');const cam=canvasIn(box,320,200),msk=canvasIn(box,320,200);
  const ro=readout(root,['Match with the real ball','White pixels','Ball centre']);
  const off=document.createElement('canvas');off.width=sc.w;off.height=sc.h;const oc=off.getContext('2d');const img=oc.createImageData(sc.w,sc.h);for(let i=0;i<sc.w*sc.h;i++){img.data[i*4]=sc.px[i*3];img.data[i*4+1]=sc.px[i*3+1];img.data[i*4+2]=sc.px[i*3+2];img.data[i*4+3]=255;}
  const off2=document.createElement('canvas');off2.width=sc.w;off2.height=sc.h;const oc2=off2.getContext('2d');const im2=oc2.createImageData(sc.w,sc.h);
  function upd(){const r=visionMask(sc,h1.v,h2.v,s1.v,v1.v),C=colors();
    oc.putImageData(img,0,0);cam.x.imageSmoothingEnabled=false;cam.x.drawImage(off,0,0,320,200);
    for(let i=0;i<sc.w*sc.h;i++){const v=r.m[i]?255:0;im2.data[i*4]=v;im2.data[i*4+1]=v;im2.data[i*4+2]=v;im2.data[i*4+3]=255;}oc2.putImageData(im2,0,0);msk.x.imageSmoothingEnabled=false;msk.x.drawImage(off2,0,0,320,200);
    if(r.count&&r.count<sc.w*sc.h*0.5){[cam.x,msk.x].forEach(x=>{x.strokeStyle=C.bad;x.lineWidth=2;const cx=r.cx*2,cy=r.cy*2;x.beginPath();x.moveTo(cx-14,cy);x.lineTo(cx+14,cy);x.moveTo(cx,cy-14);x.lineTo(cx,cy+14);x.stroke();x.beginPath();x.arc(cx,cy,8,0,7);x.stroke();});}
    const x=hb.x;for(let h=0;h<360;h++){x.fillStyle=`hsl(${h},85%,55%)`;x.fillRect(h/360*600,0,600/360+1,20);}x.fillStyle='rgba(0,0,0,.55)';const a=h1.v/360*600,b=h2.v/360*600;if(h1.v<=h2.v){x.fillRect(0,0,a,20);x.fillRect(b,0,600-b,20);}else x.fillRect(b,0,a-b,20);
    ro(0,Math.round(r.iou*100)+' %');ro(1,r.count);ro(2,r.count?`x ${Math.round(r.cx)}, y ${Math.round(r.cy)}`:'–');
    if(r.win){status('Ball found! Bolt can now steer toward the red cross.','ok');win();}
    else if(r.count>sc.w*sc.h*0.3)status('Almost everything is white. Narrow the hue range to blue (look at the colour bar).','bad');
    else if(r.iou<0.75&&r.count>0)status(`${Math.round(r.iou*100)} % match. ${s1.v<25?'The grey-blue stripe is sneaking in. Raise min saturation.':'Adjust the ranges a little more.'}`,'bad');
    else status('Nothing selected. Widen your ranges.','bad');}
  [h1,h2,s1,v1].forEach(s=>s.on(upd));upd();

/* ===== Engine: state, routing, views ===== */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='zero-to-robot-v1';
const S={xp:0,L:{},boss:{},free:false,last:null};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&typeof d==='object')Object.assign(S,d);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const RANKS=[[0,'Rookie'],[300,'Tinkerer'],[900,'Builder'],[1800,'Maker'],[3000,'Engineer'],[4800,'Roboticist'],[7000,'Robot Master']];
function rank(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return {name:RANKS[i][1],at:RANKS[i][0],next:RANKS[i+1]||null};}
function ls(id){return S.L[id]||(S.L[id]={done:false,quiz:0,perfect:false,game:false});}
function stars(id){const l=S.L[id];if(!l)return 0;return (l.done?1:0)+(l.perfect?1:0)+(l.game?1:0);}
function starHTML(n){return `<span class="stars" aria-label="${n} of 3 stars"><b>${'★'.repeat(n)}</b>${'★'.repeat(3-n)}</span>`;}
let CLEAN=[];function onClean(f){CLEAN.push(f);}function cleanup(){CLEAN.forEach(f=>{try{f();}catch(e){}});CLEAN=[];}
let UID=0;const uid=()=>'u'+(++UID);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const DPR=Math.min(window.devicePixelRatio||1,2);
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function colors(){return {ink:tok('--ink'),paper:tok('--paper'),panel:tok('--panel'),muted:tok('--muted'),line:tok('--line'),robot:tok('--robot'),ok:tok('--ok'),bad:tok('--bad'),tint:tok('--tint'),acc:tok('--accent-text')};}
function canvasIn(parent,w,h){const c=document.createElement('canvas');c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);c.className='gcanvas';const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);parent.appendChild(c);
  return {c,x,w,h,pt(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*h/r.height];}};}
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* index lessons */
WORLDS.forEach((w,wi)=>{w.n=wi+1;w.lessons.forEach((l,li)=>{l.id=`${w.n}-${li+1}`;l.w=w;l.i=li;});});
const ALL=WORLDS.flatMap(w=>w.lessons);
const lessonBy=id=>ALL.find(l=>l.id===id);
function worldOpen(n){return S.free||n===1||!!S.boss[n-1];}
function bossOpen(w){return S.free||w.lessons.every(l=>S.L[l.id]&&S.L[l.id].done);}
function nextLesson(){
  if(S.last){const l=lessonBy(S.last);if(l&&!(S.L[l.id]&&S.L[l.id].done))return l;}
  for(const l of ALL){if(worldOpen(l.w.n)&&!(S.L[l.id]&&S.L[l.id].done))return l;}
  return ALL[0];
}

/* toasts + XP */
function toast(msg,big){const t=document.createElement('div');t.className='toast'+(big?' big':'');t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),big?3600:2400);}
function addXP(n,why){const before=rank(S.xp).name;S.xp+=n;save();toast(`+${n} XP · ${why}`);const after=rank(S.xp).name;if(after!==before)setTimeout(()=>toast(`Rank up! You are now a ${after}.`,true),700);renderStats();}
function renderStats(){
  const r=rank(S.xp);const st=ALL.reduce((a,l)=>a+stars(l.id),0);const badges=Object.keys(S.boss).filter(k=>S.boss[k]).length;
  const pct=r.next?Math.round((S.xp-r.at)/(r.next[0]-r.at)*100):100;
  document.getElementById('stats').innerHTML=`<span class="rank">${r.name}</span>
  <div class="stat"><span>XP</span><b>${S.xp}</b><div class="xpbar" title="${r.next?`${r.next[0]-S.xp} XP to ${r.next[1]}`:'Top rank'}"><i style="width:${pct}%"></i></div></div>
  <div class="stat"><span>Stars</span><b>★ ${st}/${ALL.length*3}</b></div>
  <div class="stat"><span>Badges</span><b>${badges}/${WORLDS.length}</b></div>`;
  const h=(location.hash.slice(1)||'home');
  document.getElementById('nav-home').toggleAttribute('aria-current',false);document.getElementById('nav-formulas').toggleAttribute('aria-current',false);
  if(h==='home')document.getElementById('nav-home').setAttribute('aria-current','page');
  if(h==='formulas')document.getElementById('nav-formulas').setAttribute('aria-current','page');
}

/* routing */
function go(h){if(location.hash==='#'+h)render();else location.hash=h;}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.hasAttribute('aria-disabled')){e.preventDefault();go(g.dataset.go);}});
window.addEventListener('hashchange',()=>render(true));
function render(scroll){
  cleanup();const h=location.hash.slice(1)||'home';let m;
  if((m=h.match(/^world-(\d+)$/))&&WORLDS[+m[1]-1])viewWorld(+m[1]);
  else if((m=h.match(/^lesson-(\d+)-(\d+)$/))&&lessonBy(m[1]+'-'+m[2]))viewLesson(m[1]+'-'+m[2]);
  else if((m=h.match(/^boss-(\d+)$/))&&WORLDS[+m[1]-1])viewBoss(+m[1]);
  else if(h==='formulas')viewFormulas();
  else viewHome();
  if(scroll)window.scrollTo(0,0);
  renderStats();
}

/* ---------- home ---------- */
function worldCard(w){
  const open=worldOpen(w.n),done=w.lessons.filter(l=>S.L[l.id]&&S.L[l.id].done).length,st=w.lessons.reduce((a,l)=>a+stars(l.id),0);
  const pct=Math.round(done/w.lessons.length*100);
  const status=S.boss[w.n]?`Badge earned: ${esc(w.badge)}`:open?(done===w.lessons.length?'Boss challenge ready':'Open'):`Locked · beat the World ${w.n-1} boss`;
  return `<button class="wcard ${open?'':'locked'} ${S.boss[w.n]?'beaten':''}" data-go="world-${w.n}">
  <span class="chip lvl">${w.level}</span>
  <span class="wnum">${String(w.n).padStart(2,'0')}</span>
  <h3>${esc(w.title)}</h3><p>${esc(w.tag)}</p>
  <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <div class="wfoot"><span>${done}/${w.lessons.length} lessons</span><span>★ ${st}/${w.lessons.length*3}</span></div>
  <div class="wstatus">${status}</div></button>`;
}
function viewHome(){
  const nl=nextLesson();const started=S.xp>0;
  const tiers=['Beginner','Intermediate','Advanced'];
  app.innerHTML=`<section class="hero">
  <div>
    <p class="eyebrow">${WORLDS.length} worlds · ${ALL.length} lessons · beginner to advanced</p>
    <h1>Learn <em>robotics</em> by playing.</h1>
    <p class="lede">Every lesson is a short story in simple words, a mini-game and a quick quiz. You start with “what is a robot?” and finish with PID control, path planning, computer vision and ROS.</p>
    <div class="row">
      <button class="btn" data-go="lesson-${nl.id}">${started?'Continue':'Start'}: ${nl.id.replace('-','.')} ${esc(nl.t)}</button>
      <button class="btn ghost" data-go="formulas">Formula sheet</button>
    </div>
  </div>
  <figure class="hero-arm"><div id="heroArm"></div>
    <figcaption>Move your pointer (or finger) in the box. The arm works out its two joint angles by itself: shoulder <b id="ha1">0°</b>, elbow <b id="ha2">0°</b>. This is called inverse kinematics. You will learn it in World 10.</figcaption></figure>
  </section>
  <section>
    <div class="map-head"><h2>World map</h2>
      <label class="toggle"><input type="checkbox" id="freeRoam" ${S.free?'checked':''}> Free roam: open every world now</label></div>
    ${tiers.map(t=>`<div class="tier">${t}</div><div class="worlds">${WORLDS.filter(w=>w.level===t).map(worldCard).join('')}</div>`).join('')}
  </section>`;
  document.getElementById('freeRoam').onchange=e=>{S.free=e.target.checked;save();render();};
  heroArm(document.getElementById('heroArm'));
}
function heroArm(el){
  const cv=canvasIn(el,520,340);cv.c.classList.remove('gcanvas');
  const L1=120,L2=100,bx=260,by=300;let tx=380,ty=150,user=false,t0=performance.now(),raf;
  const solve=(x,y)=>{let dx=x-bx,dy=by-y;let d=Math.hypot(dx,dy);const mx=L1+L2-0.5,mn=Math.abs(L1-L2)+0.5;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}if(d<mn){dx*=mn/(d||1);dy*=mn/(d||1);d=mn;}
    const c2=(dx*dx+dy*dy-L1*L1-L2*L2)/(2*L1*L2);const t2=Math.acos(Math.max(-1,Math.min(1,c2)));const t1=Math.atan2(dy,dx)-Math.atan2(L2*Math.sin(t2),L1+L2*Math.cos(t2));return [t1,t2];};
  function draw(now){
    if(!user&&!RM){const t=(now-t0)/1000;tx=260+150*Math.cos(t*0.7);ty=150+70*Math.sin(t*1.1);}
    const C=colors(),x=cv.x;x.clearRect(0,0,520,340);
    x.strokeStyle=C.line;x.lineWidth=1;for(let gx=0;gx<=520;gx+=20){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,340);x.stroke();}for(let gy=0;gy<=340;gy+=20){x.beginPath();x.moveTo(0,gy);x.lineTo(520,gy);x.stroke();}
    x.setLineDash([4,6]);x.strokeStyle=C.muted;x.beginPath();x.arc(bx,by,L1+L2,Math.PI,2*Math.PI);x.stroke();x.setLineDash([]);
    const [t1,t2]=solve(tx,ty);
    drawArm(x,C,bx,by,L1,L2,t1,t2,22);
    x.strokeStyle=C.bad;x.lineWidth=2;x.beginPath();x.arc(tx,ty,9,0,7);x.moveTo(tx-14,ty);x.lineTo(tx+14,ty);x.moveTo(tx,ty-14);x.lineTo(tx,ty+14);x.stroke();
    const a1=document.getElementById('ha1'),a2=document.getElementById('ha2');if(a1){a1.textContent=Math.round(t1*180/Math.PI)+'°';a2.textContent=Math.round(t2*180/Math.PI)+'°';}
    if(!RM||user)raf=requestAnimationFrame(draw);
  }
  const mv=e=>{user=true;[tx,ty]=cv.pt(e);if(RM)draw(performance.now());};
  cv.c.addEventListener('pointermove',mv);cv.c.addEventListener('pointerdown',mv);
  cv.c.addEventListener('pointerleave',()=>{user=false;t0=performance.now();});
  raf=requestAnimationFrame(draw);onClean(()=>cancelAnimationFrame(raf));
}
function drawArm(x,C,bx,by,L1,L2,t1,t2,wd){
  const ex=bx+L1*Math.cos(t1),ey=by-L1*Math.sin(t1),hx=ex+L2*Math.cos(t1+t2),hy=ey-L2*Math.sin(t1+t2);
  x.fillStyle=C.ink;x.fillRect(bx-wd*1.6,by-6,wd*3.2,wd*0.9+6);
  x.lineCap='round';
  x.strokeStyle=C.ink;x.lineWidth=wd+4;x.beginPath();x.moveTo(bx,by);x.lineTo(ex,ey);x.lineTo(hx,hy);x.stroke();
  x.strokeStyle=C.robot;x.lineWidth=wd;x.beginPath();x.moveTo(bx,by);x.lineTo(ex,ey);x.stroke();
  x.lineWidth=wd*0.8;x.beginPath();x.moveTo(ex,ey);x.lineTo(hx,hy);x.stroke();
  [[bx,by,wd*0.62],[ex,ey,wd*0.5]].forEach(([px,py,r])=>{x.fillStyle=C.panel;x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.stroke();x.fillStyle=C.ink;x.beginPath();x.arc(px,py,r*0.3,0,7);x.fill();});
  const a=t1+t2;x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();
  const g=wd*0.55;const px=-Math.sin(a),py=-Math.cos(a);
  x.moveTo(hx+px*g,hy+py*g);x.lineTo(hx+Math.cos(a)*g*1.3+px*g,hy-Math.sin(a)*g*1.3+py*g);
  x.moveTo(hx-px*g,hy-py*g);x.lineTo(hx+Math.cos(a)*g*1.3-px*g,hy-Math.sin(a)*g*1.3-py*g);
  x.moveTo(hx+px*g,hy+py*g);x.lineTo(hx-px*g,hy-py*g);x.stroke();
  return [hx,hy];
}

/* ---------- world ---------- */
function lockBox(n){

function viewWorld(n){

  <button class="lrow boss" data-go="boss-${n}" ${bo?'':'aria-disabled="true"'}><span class="idx">BOSS</span><span class="lt">${S.boss[n]?'Boss beaten':'Boss challenge'}: ${esc(w.badge)} badge<span class="lg">${bo?`6 mixed questions from this world. Get 5 right to win${n<WORLDS.length?` and open World ${n+1}`:''}.`:'Finish every lesson in this world to unlock (or use free roam).'}</span></span><span class="stars">${S.boss[n]?'<b>◆</b>':'◇'}</span></button></div>`;

/* ---------- lesson ---------- */
const BOLT=`<svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true"><line x1="31" y1="4" x2="31" y2="13" stroke="var(--ink)" stroke-width="3"/><circle cx="31" cy="5" r="4" fill="var(--robot)" stroke="var(--ink)" stroke-width="2"/><rect x="9" y="13" width="44" height="34" rx="7" fill="var(--robot)" stroke="var(--ink)" stroke-width="3"/><rect x="16" y="21" width="30" height="15" rx="4" fill="var(--ink)"/><circle cx="24" cy="28.5" r="3.4" fill="var(--robot)"/><circle cx="38" cy="28.5" r="3.4" fill="var(--robot)"/><path d="M24 41 h14" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><rect x="4" y="24" width="5" height="12" rx="2" fill="var(--ink)"/><rect x="53" y="24" width="5" height="12" rx="2" fill="var(--ink)"/><rect x="20" y="47" width="22" height="9" rx="2" fill="var(--ink)"/></svg>`;
function hl(src,lang){
  const e=src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const KW='void|int|float|long|unsigned|bool|char|const|volatile|if|else|for|while|return|switch|case|break|default|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|byte|double|static|struct|enum|def|import|from|class|self|None|True|False|in|and|or|not|elif|pass|lambda|with|as';
  const re=lang==='py'?new RegExp('(#[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','g')
    :new RegExp('(\\/\\/[^\\n]*)|(#[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','g');
  return lang==='py'?e.replace(re,(m,c,s,k,n)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:`<span class="n">${n}</span>`)
    :e.replace(re,(m,c,p,s,k,n)=>c?`<span class="c">${c}</span>`:p?`<span class="p">${p}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:`<span class="n">${n}</span>`);
}
function viewLesson(id){
  const l=lessonBy(id),w=l.w;if(!worldOpen(w.n))return lockBox(w.n);
  S.last=id;save();
  const prev=w.lessons[l.i-1],next=w.lessons[l.i+1];
  const st=ls(id);
  app.innerHTML=`<article class="lesson">
  <nav class="crumbs"><button data-go="home">World map</button><span>/</span><button data-go="world-${w.n}">World ${w.n}: ${esc(w.title)}</button><span>/</span><span>Lesson ${id.replace('-','.')}</span></nav>
  <p class="eyebrow">Lesson ${id.replace('-','.')} of World ${w.n} · ${w.level}</p>
  <h1>${esc(l.t)}</h1>
  <div class="lmeta"><span id="lstars">${starHTML(stars(id))}</span><span class="chip">★ Read & finish</span><span class="chip">★ All quiz answers right first time</span><span class="chip">★ Beat the mini-game</span></div>
  <section class="sec"><div class="sec-h">Story</div><div class="story">${BOLT}<div class="txt">${l.story}</div></div></section>
  <section class="sec"><div class="sec-h">Key ideas</div><ul class="points">${l.points.map(p=>`<li>${p}</li>`).join('')}</ul></section>
  ${l.code?`<section class="sec"><div class="sec-h">Code</div><div class="code"><div class="lang"><span>${l.code.lang==='py'?'Python':'Arduino C++'}</span><button class="copy">Copy</button></div><pre><code>${hl(l.code.src.replace(/^\n/,''),l.code.lang)}</code></pre></div>${l.code.note?`<p class="code-note">${l.code.note}</p>`:''}</section>`:''}
  <section class="sec"><div class="sec-h">Try it</div><div id="gameMount"></div></section>
  <section class="sec"><div class="sec-h">Quick check</div><div id="quiz"></div></section>
  <div class="finish" id="finish"></div>
  <nav class="nextnav">${prev?`<button class="btn ghost sm" data-go="lesson-${prev.id}">← ${prev.id.replace('-','.')} ${esc(prev.t)}</button>`:`<span></span>`}
  ${next?`<button class="btn ghost sm" data-go="lesson-${next.id}">${next.id.replace('-','.')} ${esc(next.t)} →</button>`:`<button class="btn ghost sm" data-go="boss-${w.n}">Boss challenge →</button>`}</nav>
  </article>`;
  const cp=app.querySelector('.copy');if(cp)cp.onclick=()=>{navigator.clipboard.writeText(l.code.src.replace(/^\n/,'')).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1500);}).catch(()=>{cp.textContent='Select the code to copy';});};
  mountGame(document.getElementById('gameMount'),l.game,()=>{
    if(!st.game){st.game=true;save();addXP(30,'mini-game beaten');refreshStars();}
  },st.game);
  runQuiz(l);
  function refreshStars(){document.getElementById('lstars').innerHTML=starHTML(stars(id));const fs=document.getElementById('fstars');if(fs)fs.innerHTML=starHTML(stars(id));}
  l._refresh=refreshStars;
}
function runQuiz(l){
  const box=document.getElementById('quiz'),fin=document.getElementById('finish');const st=ls(l.id);
  let answered=0,right=0;
  box.innerHTML=l.quiz.map((q,qi)=>{const ord=shuffle(q.o.map((o,i)=>i));return `<div class="q" data-qi="${qi}"><p class="q-text">Q${qi+1}. ${q.q}</p><div class="opts">${ord.map(oi=>`<button class="opt" data-oi="${oi}">${q.o[oi]}</button>`).join('')}</div><p class="why" hidden></p></div>`;}).join('');
  box.onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const qd=b.closest('.q'),q=l.quiz[+qd.dataset.qi],a=q.a||0,oi=+b.dataset.oi;
    qd.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.oi===a)x.classList.add('right');});
    const ok=oi===a;if(!ok)b.classList.add('wrong');answered++;if(ok)right++;
    const why=qd.querySelector('.why');why.hidden=false;why.className='why'+(ok?'':' bad');why.innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+(q.why||'');
    drawFinish();};
  function drawFinish(){
    const total=l.quiz.length,doneAll=answered===total;
    fin.innerHTML=`<span id="fstars">${starHTML(stars(l.id))}</span>
      <button class="btn" id="finBtn" ${doneAll?'':'disabled'}>${st.done?'Save quiz score':'Finish lesson'} (+${st.done?0:50} XP)</button>
      <span class="small muted">${doneAll?`Quiz: ${right}/${total} right first time.`:`Answer all ${total} questions to finish. (${answered}/${total})`}</span>
      ${doneAll?'<button class="btn ghost sm" id="retry">Retry quiz</button>':''}`;
    const fb=document.getElementById('finBtn');
    fb.onclick=()=>{
      if(!st.done){st.done=true;addXP(50,'lesson finished');}
      if(right>st.quiz){const gain=(right-st.quiz)*10;st.quiz=right;addXP(gain,'quiz answers');}
      if(right===total)st.perfect=true;save();l._refresh&&l._refresh();
      const nx=l.w.lessons[l.i+1];
      fin.innerHTML=`<span id="fstars">${starHTML(stars(l.id))}</span><strong>Lesson ${l.id.replace('-','.')} complete.</strong>
      ${nx?`<button class="btn" data-go="lesson-${nx.id}">Next: ${esc(nx.t)} →</button>`:`<button class="btn" data-go="boss-${l.w.n}">Boss challenge →</button>`}
      ${right<total?'<button class="btn ghost sm" id="retry">Retry quiz for a star</button>':''}`;
      const rb=document.getElementById('retry');if(rb)rb.onclick=()=>runQuiz(l);
    };
    const rb=document.getElementById('retry');if(rb)rb.onclick=()=>runQuiz(l);
  }
  drawFinish();
}

/* ---------- boss ---------- */
function viewBoss(n){
  const w=WORLDS[n-1];if(!worldOpen(n))return lockBox(n);
  if(!bossOpen(w)){app.innerHTML=`<nav class="crumbs"><button data-go="home">World map</button><span>/</span><button data-go="world-${n}">World ${n}</button></nav><div class="lockbox"><h2 style="font-size:2rem;text-transform:uppercase">Boss locked</h2><p>Finish every lesson in World ${n} first. ${w.lessons.filter(l=>!(S.L[l.id]&&S.L[l.id].done)).length} lessons left.</p><div class="row"><button class="btn" data-go="world-${n}">Back to World ${n}</button></div></div>`;return;}
  const pool=shuffle(w.lessons.flatMap(l=>l.quiz.map(q=>Object.assign({from:l.id},q))));const qs=pool.slice(0,6);const need=Math.min(5,qs.length);
  let i=0,score=0;const res=[];
  app.innerHTML=`<div class="boss-card"><nav class="crumbs"><button data-go="home">World map</button><span>/</span><button data-go="world-${n}">World ${n}</button><span>/</span><span>Boss</span></nav>
  <p class="eyebrow">World ${n} boss challenge</p><h1 style="font-size:clamp(2.3rem,5vw,3.4rem);text-transform:uppercase">${esc(w.title)}</h1>
  <div class="boss-top"><div class="pips" id="pips"></div><span class="mono small" id="bscore"></span></div><div id="bq"></div></div>`;
  function pips(){document.getElementById('pips').innerHTML=qs.map((q,k)=>`<i class="${k<res.length?(res[k]?'ok':'bad'):k===i?'now':''}"></i>`).join('');document.getElementById('bscore').textContent=`${score} right · need ${need} of ${qs.length}`;}
  function show(){
    pips();const bq=document.getElementById('bq');
    if(i>=qs.length){const pass=score>=need;const first=pass&&!S.boss[n];
      if(first){S.boss[n]=true;save();addXP(100,'boss beaten');setTimeout(()=>toast(`Badge unlocked: ${w.badge}`,true),500);}
      bq.innerHTML=pass?`<div class="badge"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M27 3 L49 15 V39 L27 51 L5 39 V15 Z" fill="var(--robot)" stroke="var(--ink)" stroke-width="3"/><text x="27" y="34" text-anchor="middle" font-family="Big Shoulders Display,sans-serif" font-weight="900" font-size="20" fill="#1B1F23">${String(n).padStart(2,'0')}</text></svg><div><strong style="font-size:1.2rem">${score}/${qs.length}. You beat the boss!</strong><br>Badge: ${esc(w.badge)}${n<WORLDS.length?` · World ${n+1} is open.`:' · You finished the whole game. You are ready to build real robots.'}</div></div>
        <div class="row wrap" style="margin-top:18px">${n<WORLDS.length?`<button class="btn" data-go="world-${n+1}">Go to World ${n+1} →</button>`:''}<button class="btn ghost" data-go="home">World map</button></div>`
      :`<div class="lockbox"><strong style="font-size:1.2rem">${score}/${qs.length}. So close.</strong><p>You need ${need}. Look back at the lessons for the ones you missed, then try again. The questions change each time.</p><div class="row wrap"><button class="btn" id="again">Try again</button><button class="btn ghost" data-go="world-${n}">Review lessons</button></div></div>`;
      const ag=document.getElementById('again');if(ag)ag.onclick=()=>viewBoss(n);renderStats();return;}
    const q=qs[i];const ord=shuffle(q.o.map((o,k)=>k));
    bq.innerHTML=`<div class="q"><p class="q-text">Question ${i+1} of ${qs.length} <span class="chip">from lesson ${q.from.replace('-','.')}</span><br>${q.q}</p><div class="opts">${ord.map(oi=>`<button class="opt" data-oi="${oi}">${q.o[oi]}</button>`).join('')}</div><p class="why" hidden></p></div><div class="row" style="margin-top:6px"><button class="btn" id="bnext" hidden>Next →</button></div>`;
    bq.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const a=q.a||0,ok=+b.dataset.oi===a;
      bq.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.oi===a)x.classList.add('right');});if(!ok)b.classList.add('wrong');
      if(ok)score++;res.push(ok);const why=bq.querySelector('.why');why.hidden=false;why.className='why'+(ok?'':' bad');why.innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+(q.why||'');
      const nb=document.getElementById('bnext');nb.hidden=false;nb.focus();nb.onclick=()=>{i++;show();};pips();};
  }
  show();
}

function viewFormulas(){

/* reset */
(function(){const b=document.getElementById('reset');let armed=false,t;b.onclick=()=>{if(!armed){armed=true;b.textContent='Click again to erase all progress';t=setTimeout(()=>{armed=false;b.textContent='Reset progress';},3000);return;}
  clearTimeout(t);S.xp=0;S.L={};S.boss={};S.free=false;S.last=null;save();armed=false;b.textContent='Reset progress';toast('Progress erased. Fresh start!');go('home');};})();

/* boot */
function start(d){
  load();
  if(d&&d.S&&typeof d.S==='object')Object.assign(S,d.S);
  if(d&&d.hash&&d.hash!==location.hash){location.hash=d.hash;return;}
  render(false);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:JSON.parse(JSON.stringify(S)),hash:location.hash}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
