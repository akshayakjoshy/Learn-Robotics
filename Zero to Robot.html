W({title:"The Robot Brain",tag:"Microcontrollers, Arduino code, pins, ADC, PWM, timing, interrupts, communication.",badge:"Code Pilot",level:"Beginner",
desc:"Give Bolt a brain. Learn what is inside a microcontroller, write Arduino code, read buttons and knobs, control brightness with PWM, and make chips talk to each other.",
lessons:[
{t:"What is a microcontroller?",
story:`<p>A <b>microcontroller</b> is a tiny computer on one chip. Inside it has a <b>CPU</b> (does the thinking), <b>Flash</b> memory (stores your program even when power is off), <b>SRAM</b> (scratch memory, wiped when power is off), sometimes <b>EEPROM</b> (small memory for settings that stay), and <b>GPIO pins</b> (legs to talk to the world). A <b>clock</b> ticks to set the speed. The Arduino Uno ticks 16 million times a second (16 MHz).</p>
<p>Popular brains: the <b>Arduino Uno</b> (ATmega328P chip, 5 V, 32 KB Flash, 2 KB SRAM), the <b>ESP32</b> (3.3 V, 240 MHz, WiFi and Bluetooth built in), and the <b>Raspberry Pi Pico</b>. A <b>Raspberry Pi 4 or 5</b> is different. It is a full mini computer that runs Linux. It is great for cameras and AI, but not as good at exact timing.</p>`,
points:["Microcontroller = CPU + memory + pins + clock on one chip.","Flash keeps the program. SRAM is working memory. EEPROM keeps small settings.","Arduino Uno: 5 V, 16 MHz. ESP32: 3.3 V, WiFi + Bluetooth.","Never feed 5 V into a 3.3 V board’s pin.","Microcontroller = simple and exact timing. Single-board computer (Raspberry Pi) = runs Linux, more power."],
game:{type:"match",pairs:[["Flash","Stores your program even with power off"],["SRAM","Working memory, wiped when power is off"],["Clock","Ticks that set the speed (16 MHz on Uno)"],["GPIO pin","General purpose input/output leg"],["ESP32","Microcontroller with WiFi and Bluetooth"],["Raspberry Pi 5","Small full computer that runs Linux"]]},
quiz:[{q:"Where is your program stored so it survives power off?",o:["Flash memory","SRAM","The battery"],why:"Flash is non-volatile: it keeps data without power."},
{q:"Which board has built-in WiFi?",o:["ESP32","Arduino Uno","A breadboard"],why:"The ESP32 has WiFi and Bluetooth."},
{q:"An ESP32 pin works at 3.3 V. Can you safely feed it 5 V?",o:["No, use a voltage divider or level shifter","Yes, always","Only on Sundays"],why:"5 V can damage a 3.3 V pin."}]},

{t:"Your first program: Blink",
story:`<p>Every Arduino program (called a <b>sketch</b>) has two parts. <b>setup()</b> runs <i>once</i> when the board starts. <b>loop()</b> runs <i>again and again forever</i>.</p>
<p>In setup we tell pin 13 to be an <b>OUTPUT</b>. In loop we turn it ON (HIGH), wait 1000 ms, turn it OFF (LOW), wait again. Pin 13 has a tiny LED on the board, so it blinks. This is the “Hello world” of robotics.</p>
<p>You write the code in the <b>Arduino IDE</b>, press <b>Verify</b> (it is <b>compiled</b> into machine code), then <b>Upload</b> through the USB cable. Every line ends with a semicolon <b>;</b> and blocks live inside curly brackets <b>{ }</b>.</p>`,
points:["setup() runs once. loop() repeats forever.","pinMode(pin, OUTPUT) prepares a pin to send signals.","digitalWrite(pin, HIGH) = ON, LOW = OFF.","delay(1000) waits 1000 milliseconds = 1 second.","Compile (Verify), then Upload over USB."],
code:{lang:"cpp",src:`
void setup() {
  pinMode(13, OUTPUT);      // pin 13 will send signals
}

void loop() {
  digitalWrite(13, HIGH);   // LED on
  delay(1000);              // wait 1 second
  digitalWrite(13, LOW);    // LED off
  delay(1000);              // wait 1 second
}`},
game:{type:"order",code:true,intro:"The Blink sketch got scrambled! Tap the lines in the right order.",items:["void setup() {","  pinMode(13, OUTPUT);","}","void loop() {","  digitalWrite(13, HIGH);","  delay(1000);","  digitalWrite(13, LOW);","  delay(1000);","}"],win:"Blink rebuilt! Upload it and the LED will flash."},
quiz:[{q:"How many times does setup() run?",o:["Once, at the start","Forever","Never"],why:"setup() is for one-time preparation."},
{q:"delay(500) waits…",o:["Half a second","500 seconds","5 seconds"],why:"500 milliseconds = 0.5 seconds."},
{q:"Every Arduino statement ends with…",o:["A semicolon ;","A full stop .","A comma ,"],why:"C/C++ uses ; to end statements."}]},

{t:"Code basics: variables, if, loops, functions",
story:`<p>A <b>variable</b> is a labelled box that holds a value. <span class="f">int speed = 150;</span> makes a box called speed holding 150. Common types: <b>int</b> (whole numbers), <b>float</b> (decimals), <b>bool</b> (true/false), <b>char</b> (a letter), <b>long</b> (big numbers), <b>byte</b> (0–255). Use <b>const</b> for values that never change.</p>
<p><b>if / else</b> makes decisions: <span class="f">if (distance &lt; 20) { stop(); } else { forward(); }</span>. Use <b>==</b> to compare (a single = means “put into the box”).</p>
<p>A <b>for loop</b> repeats a set number of times. A <b>while loop</b> repeats while something is true. A <b>function</b> is a named mini-program you can reuse, and it can take inputs and give back an answer. An <b>array</b> is a row of boxes: <span class="f">int sensors[5];</span>. Watch out: in C, <span class="f">7 / 2 = 3</span> with ints. Use 7.0 / 2 for 3.5.</p>`,
points:["Variables have a type and a name: int, float, bool, char, long, byte.","= stores a value. == compares two values.","if / else if / else for decisions.","for and while for repeating.","Functions package code so you can reuse it.","Integer division throws away the decimal part."],
code:{lang:"cpp",src:`
const int LED = 13;

void blinkTimes(int n) {            // a function with an input
  for (int i = 0; i < n; i++) {     // repeat n times
    digitalWrite(LED, HIGH); delay(200);
    digitalWrite(LED, LOW);  delay(200);
  }
}

void setup() { pinMode(LED, OUTPUT); }

void loop() {
  int distance = 15;                // pretend sensor value (cm)
  if (distance < 20) {
    blinkTimes(3);                  // warning!
  } else {
    blinkTimes(1);
  }
  delay(1000);
}`},
game:{type:"calc",intro:"Be the computer! Work out what each piece of code gives.",problems:[{q:"int x = 3; x = x * 2 + 1; What is x?",a:7,tol:0},{q:"int count = 0; for (int i = 0; i < 5; i++) { count++; } What is count?",a:5,tol:0},{q:"int a = 7 / 2; What is a?",a:3,tol:0,hint:"With int, the decimal part is thrown away."},{q:"float b = 7.0 / 2; What is b?",a:3.5,tol:0.001},{q:"int s = 0; for (int i = 1; i <= 4; i++) { s = s + i; } What is s?",a:10,tol:0,hint:"1 + 2 + 3 + 4"}]},
quiz:[{q:"Which type holds a decimal number like 3.14?",o:["float","int","bool"],why:"float is for numbers with decimals."},
{q:"What is the difference between = and ==?",o:["= stores a value, == compares","They are the same","== stores twice"],why:"x = 5 stores. x == 5 asks “is x five?”."},
{q:"Why use functions?",o:["To reuse code and keep programs tidy","To make the board heavier","To use more power"],why:"Functions avoid repeating the same code."}]},

{t:"Digital input and output",
story:`<p>Pins can <b>talk</b> (OUTPUT) or <b>listen</b> (INPUT). <span class="f">digitalRead(pin)</span> listens and returns HIGH or LOW.</p>
<p>If an input pin is connected to nothing, it <b>floats</b>. It picks up random electrical noise like an antenna and reads HIGH and LOW randomly. The fix is a <b>pull-up</b> resistor (to 5 V) or <b>pull-down</b> resistor (to GND), which gently holds the pin in one state until a button changes it.</p>
<p>The Arduino has a built-in pull-up: <span class="f">pinMode(2, INPUT_PULLUP)</span>. Wire the button from the pin to GND. Now the logic is upside down: <b>not pressed = HIGH</b>, <b>pressed = LOW</b>. Remember: a pin can only give about 20 mA. Use it for LEDs and signals, never motors.</p>`,
points:["pinMode(pin, INPUT) or OUTPUT. digitalRead returns HIGH or LOW.","A floating pin gives random readings.","Pull-up resistor → reads HIGH by default. Pull-down → LOW by default.","INPUT_PULLUP uses the chip’s internal resistor. Pressed = LOW.","Max about 20 mA per pin."],
code:{lang:"cpp",src:`
const int BUTTON = 2;
const int LED = 13;

void setup() {
  pinMode(BUTTON, INPUT_PULLUP);  // internal pull-up
  pinMode(LED, OUTPUT);
}

void loop() {
  if (digitalRead(BUTTON) == LOW) {  // LOW means pressed!
    digitalWrite(LED, HIGH);
  } else {
    digitalWrite(LED, LOW);
  }
}`},
game:{type:"bins",bins:["Reads HIGH","Reads LOW"],items:[["INPUT_PULLUP, button not pressed",0],["INPUT_PULLUP, button pressed (pin connected to GND)",1],["Pull-down resistor, button not pressed",1],["Pull-down resistor, button pressed (pin connected to 5 V)",0],["Pin wired straight to GND",1],["Pin wired straight to 5 V",0]]},
quiz:[{q:"A pin connected to nothing gives random readings. This is called…",o:["Floating","Grounding","Blinking"],why:"A floating input picks up noise."},
{q:"With INPUT_PULLUP and the button to GND, pressing the button reads…",o:["LOW","HIGH","Random"],why:"The button pulls the pin down to 0 V."},
{q:"What does a pull-down resistor do?",o:["Holds the pin LOW until something pulls it HIGH","Makes the pin a motor","Measures temperature"],why:"It sets a safe default state."}]},

{t:"Analog input and the ADC",
story:`<p>Many sensors give a voltage that can be anything between 0 and 5 V, like a volume knob (a <b>potentiometer</b>). To read it, the microcontroller uses an <b>ADC</b> (analog-to-digital converter). It turns the voltage into a number.</p>
<p>The Arduino Uno’s ADC is <b>10-bit</b>, so it gives numbers from <b>0 to 1023</b>. 0 V → 0, 5 V → 1023. <span class="f">value = V ÷ 5 × 1023</span>. Each step is about 5 ÷ 1024 ≈ <b>4.9 mV</b>. This is the <b>resolution</b>. The ESP32 is 12-bit: 0 to 4095 at 3.3 V.</p>
<p>The <span class="f">map()</span> function rescales numbers, for example turning 0–1023 into 0–180 degrees for a servo.</p>`,
points:["analogRead(A0) returns 0–1023 on an Uno (10 bits).","value = V ÷ Vref × 1023. Voltage = value ÷ 1023 × Vref.","Resolution = Vref ÷ 1024 ≈ 4.9 mV on a 5 V Uno.","ESP32: 12 bits, 0–4095, 3.3 V.","map(value, 0, 1023, 0, 180) rescales ranges."],
code:{lang:"cpp",src:`
void setup() {
  Serial.begin(9600);
}

void loop() {
  int raw = analogRead(A0);              // 0..1023
  float volts = raw * 5.0 / 1023.0;       // back to volts
  int angle = map(raw, 0, 1023, 0, 180);  // for a servo
  Serial.print(raw);   Serial.print("  ");
  Serial.print(volts); Serial.print(" V  ");
  Serial.println(angle);
  delay(200);
}`},
game:{type:"adc",problems:[{q:"What does analogRead give for 2.5 V?",a:511.5,tol:1,hint:"2.5 ÷ 5 × 1023"},{q:"What does it give for 1 V?",a:204.6,tol:1},{q:"analogRead gives 768. About how many volts is that?",a:3.75,tol:0.03,unit:"V",hint:"768 ÷ 1023 × 5"}]},
quiz:[{q:"What range does analogRead give on an Arduino Uno?",o:["0 to 1023","0 to 255","0 to 5"],why:"10 bits = 1024 values."},
{q:"An ADC turns…",o:["A voltage into a number","A number into a motor","Light into sound"],why:"Analog to digital."},
{q:"An ESP32 ADC is 12-bit. Its biggest value is…",o:["4095","1023","255"],why:"2¹² = 4096 values: 0 to 4095."}]},

{t:"PWM: fake analog output",
story:`<p>An Arduino Uno cannot output, say, 2.5 V. Its pins are only fully ON (5 V) or fully OFF (0 V). So it cheats. It switches the pin ON and OFF very fast. This is <b>PWM</b> (pulse-width modulation).</p>
<p>The <b>duty cycle</b> is how much of each cycle the pin is ON. 50% duty means ON half the time. An LED blinks so fast you cannot see it. You just see half brightness. A motor feels the <b>average voltage</b>: <span class="f">V_avg = duty × 5 V</span>.</p>
<p><span class="f">analogWrite(pin, value)</span> takes 0 (always off) to 255 (always on). 127 ≈ 50%. Only pins marked <b>~</b> can do PWM (3, 5, 6, 9, 10, 11 on the Uno). The Uno’s PWM runs at about 490 Hz (980 Hz on pins 5 and 6). PWM controls LED brightness, motor speed, and servo position.</p>`,
points:["PWM = switching fast between ON and OFF.","Duty cycle = ON time ÷ total time, in %.","Average voltage = duty × supply voltage.","analogWrite(pin, 0..255). value = duty% × 255 ÷ 100.","Only ~ pins can do PWM."],
code:{lang:"cpp",src:`
const int LED = 9;   // a ~ PWM pin

void setup() { pinMode(LED, OUTPUT); }

void loop() {
  for (int b = 0; b <= 255; b++) {  // fade up
    analogWrite(LED, b);
    delay(5);
  }
  for (int b = 255; b >= 0; b--) {  // fade down
    analogWrite(LED, b);
    delay(5);
  }
}`},
game:{type:"pwm"},
quiz:[{q:"A 25% duty cycle on 5 V gives an average of…",o:["1.25 V","2.5 V","5 V"],why:"0.25 × 5 = 1.25 V."},
{q:"analogWrite(9, 255) means…",o:["Always ON (100%)","Always OFF","Half"],why:"255 is the maximum."},
{q:"Which pins can do PWM on an Uno?",o:["Pins marked with ~","Every pin","Only A0"],why:"Only some pins have PWM timers."}]},

{t:"Timing: delay() vs millis()",
story:`<p>Imagine Bolt is driving and you write <span class="f">delay(3000)</span>. For 3 seconds Bolt is <b>frozen</b>. It cannot read its sensors, so it drives into a wall! <b>delay()</b> is <b>blocking</b>: nothing else can happen.</p>
<p><b>millis()</b> returns how many milliseconds have passed since the board started. Instead of waiting, Bolt checks the clock: “Has 1000 ms passed since my last blink? No? Then do other jobs.” This is <b>non-blocking</b> code, and it lets one small chip juggle many tasks at once.</p>
<p>Store times in <b>unsigned long</b>. millis() rolls over to 0 after about 49 days, but the subtraction trick <span class="f">now − last ≥ interval</span> still works. For very short times use <b>micros()</b>.</p>`,
points:["delay() freezes the whole program (blocking).","millis() = ms since start. Use it to check time without waiting.","Pattern: if (millis() − last ≥ interval) { last = millis(); doTask(); }","Use unsigned long for time variables.","Non-blocking code lets the robot sense and act at the same time."],
code:{lang:"cpp",src:`
unsigned long lastBlink = 0;
const unsigned long INTERVAL = 500;
bool ledOn = false;

void setup() { pinMode(13, OUTPUT); }

void loop() {
  unsigned long now = millis();
  if (now - lastBlink >= INTERVAL) {   // time to blink?
    lastBlink = now;
    ledOn = !ledOn;
    digitalWrite(13, ledOn);
  }
  checkObstacle();   // runs every loop, never blocked
}

void checkObstacle() {
  // read the distance sensor here
}`},
game:{type:"bins",bins:["Blocks the program","Does not block"],items:[["delay(1000)",0],["if (millis() - last >= 500) { … }",1],["while (digitalRead(btn) == HIGH) { } (waiting for a press)",0],["Reading a sensor once and moving on",1],["delay(5) inside a loop of 1000 steps",0,"5 ms × 1000 = 5 whole seconds frozen."],["An interrupt that counts wheel ticks",1]]},
quiz:[{q:"Why is delay() a problem in robots?",o:["The robot cannot sense anything while waiting","It uses too much battery","It breaks the board"],why:"delay() blocks everything."},
{q:"millis() tells you…",o:["Milliseconds since the board started","The battery level","The room temperature"],why:"It is a running clock."},
{q:"What type should store millis() values?",o:["unsigned long","bool","char"],why:"It needs a big, never-negative number."}]},

{t:"Interrupts",
story:`<p>Imagine waiting for a parcel. You could keep opening the front door every minute to check. That is <b>polling</b>. Or you can wait for the <b>doorbell</b>. That is an <b>interrupt</b>.</p>
<p>With an interrupt, hardware taps the CPU on the shoulder the moment a pin changes. The CPU pauses, runs a tiny function called an <b>ISR</b> (interrupt service routine), then goes back to what it was doing. Interrupts are perfect for fast signals like wheel encoder ticks or an emergency-stop button.</p>
<p>Rules for ISRs: keep them <b>very short</b>, no delay(), no Serial printing. Variables shared with the main code must be <b>volatile</b>. On an Uno, pins 2 and 3 have interrupts. Trigger modes: <b>RISING</b> (LOW→HIGH), <b>FALLING</b> (HIGH→LOW), <b>CHANGE</b> (either). <b>Timer interrupts</b> run code at exact intervals.</p>`,
points:["Polling = checking again and again. Interrupt = hardware calls you.","attachInterrupt(digitalPinToInterrupt(2), isr, RISING);","ISR: short, no delay(), no Serial.","Shared variables must be declared volatile.","Read multi-byte shared variables with interrupts paused: noInterrupts() … interrupts()."],
code:{lang:"cpp",src:`
volatile long ticks = 0;        // shared with the ISR

void countTick() {              // the ISR: tiny and fast
  ticks++;
}

void setup() {
  Serial.begin(115200);
  pinMode(2, INPUT_PULLUP);
  attachInterrupt(digitalPinToInterrupt(2), countTick, RISING);
}

void loop() {
  noInterrupts();               // copy safely
  long t = ticks;
  interrupts();
  Serial.println(t);
  delay(500);
}`},
game:{type:"match",pairs:[["Polling","Checking again and again"],["Interrupt","Hardware taps the CPU on the shoulder"],["ISR","Small function that runs when the interrupt fires"],["volatile","Tells the compiler a variable can change at any moment"],["RISING","Trigger when the signal goes LOW → HIGH"],["FALLING","Trigger when the signal goes HIGH → LOW"]]},
quiz:[{q:"An interrupt is like…",o:["A doorbell","Checking the door every minute","Locking the door"],why:"It alerts the CPU only when something happens."},
{q:"Which is a good rule for an ISR?",o:["Keep it very short","Put a long delay() in it","Print lots of text in it"],why:"Long ISRs block everything else."},
{q:"A variable changed inside an ISR should be…",o:["volatile","const","deleted"],why:"volatile makes the compiler always read the fresh value."}]},

{t:"Talking to other chips: UART, I2C, SPI",
story:`<p>Robots have many chips that must chat. They use agreed languages called <b>protocols</b>.</p>
<p><b>UART (Serial)</b> uses two wires: <b>TX</b> (talk) and <b>RX</b> (listen), crossed over: my TX goes to your RX. Both sides must agree on the speed, the <b>baud rate</b> (like 9600 or 115200 bits per second). The common format is <b>8N1</b>: a start bit, 8 data bits, no parity bit, 1 stop bit. The Serial Monitor uses UART: your best debugging friend.</p>
<p><b>I2C</b> uses two wires, <b>SDA</b> (data) and <b>SCL</b> (clock), shared by many devices. Each device has an <b>address</b>, like 0x3C for an OLED screen or 0x68 for an MPU6050 motion sensor. It needs pull-up resistors. <b>SPI</b> uses four wires (MOSI, MISO, SCK, CS) and is much faster: good for SD cards and displays. Each device gets its own CS (chip select) wire. Big robots and cars use <b>CAN bus</b>, which is very robust over long wires.</p>`,
points:["UART: TX→RX and RX→TX, same baud rate on both sides, usually 8N1.","I2C: SDA + SCL, many devices, each with an address, needs pull-ups.","SPI: MOSI, MISO, SCK + one CS per device. Fast.","CAN bus: tough, long-distance network for cars and big robots.","Always connect the grounds of chips that talk."],
code:{lang:"cpp",src:`
#include <Wire.h>          // I2C library

void setup() {
  Serial.begin(115200);    // UART to the computer
  Wire.begin();            // start I2C
  Serial.println("Scanning I2C...");
  for (byte addr = 1; addr < 127; addr++) {
    Wire.beginTransmission(addr);
    if (Wire.endTransmission() == 0) {   // someone answered
      Serial.print("Found device at 0x");
      Serial.println(addr, HEX);
    }
  }
}

void loop() {}`,note:"This is an I2C scanner. It finds the address of every I2C device you connect."},
game:{type:"match",pairs:[["UART","TX and RX wires, needs matching baud rate"],["I2C","SDA and SCL, devices have addresses"],["SPI","Fast, with MOSI, MISO, SCK and chip select"],["Baud rate","Bits per second, like 115200"],["8N1","Start bit, 8 data bits, no parity, 1 stop bit"],["CAN bus","Robust network used in cars and big robots"]]},
quiz:[{q:"In UART, the TX of one board connects to…",o:["The RX of the other board","The TX of the other board","Nothing"],why:"Talk goes to listen."},
{q:"How do many I2C devices on the same two wires know who is being called?",o:["Each has its own address","They take turns randomly","They use different colours"],why:"The address picks the device."},
{q:"Which protocol is usually fastest for an SD card or display?",o:["SPI","I2C","UART at 9600"],why:"SPI has separate data lines and a fast clock."}]}
]});

W({title:"Sensors",tag:"Buttons, light, distance, encoders, IMU, cameras and filtering noise.",badge:"Super Senses",level:"Intermediate",
desc:"Give Bolt senses. Learn how each sensor turns the world into electricity, how to read it in code, and how to clean up noisy readings.",
lessons:[
{t:"How sensors work",
story:`<p>A sensor is a <b>translator</b>. It turns something in the world (light, distance, heat, tilt) into an electrical signal the brain can read. A part that changes one kind of energy into another is called a <b>transducer</b>.</p>
<p>Some sensors give an <b>analog</b> voltage (read with analogRead). Others give <b>digital</b> data (a HIGH/LOW pin, or numbers over I2C, SPI or UART).</p>
<p>Engineers judge sensors by: <b>range</b> (smallest to biggest value it can measure), <b>resolution</b> (smallest change it can notice), <b>accuracy</b> (how close to the true value) and <b>precision</b> (how repeatable). Think of darts: all darts close together = precise. All darts near the centre = accurate. Every sensor has <b>noise</b>. We fix offsets with <b>calibration</b>. Sensors that measure the robot itself (wheel turns, tilt) are <b>proprioceptive</b>. Sensors that measure the outside world (distance, camera) are <b>exteroceptive</b>.</p>`,
points:["Sensor = transducer: physical thing → electrical signal.","Analog output (a voltage) or digital output (pins or data bus).","Range, resolution, accuracy, precision, noise, sample rate.","Accuracy = close to the truth. Precision = repeatable.","Calibration fixes offset and scale errors.","Proprioceptive (inside) vs exteroceptive (outside) sensors."],
game:{type:"bins",bins:["Inside sensor (proprioceptive)","Outside sensor (exteroceptive)"],items:[["Wheel encoder",0],["Battery voltage sensor",0],["Gyroscope",0],["Motor current sensor",0],["Camera",1],["Ultrasonic distance sensor",1],["Bump switch",1,"It feels the world outside the robot."],["LiDAR",1]]},
quiz:[{q:"All your darts land close together but far from the centre. The sensor is…",o:["Precise but not accurate","Accurate but not precise","Both"],why:"Repeatable (precise) but wrong (not accurate)."},
{q:"Resolution means…",o:["The smallest change the sensor can notice","The sensor’s price","Its colour"],why:"It is the smallest step it can tell apart."},
{q:"Calibration is used to…",o:["Correct offset and scale errors","Make the sensor heavier","Change I2C addresses"],why:"You compare with known values and correct the readings."}]},

{t:"Buttons, switches and debouncing",
story:`<p>Press a button once and you might expect one click. But inside, metal contacts <b>bounce</b> like a dropped ball. In a few milliseconds the signal flickers ON-OFF-ON-OFF. The fast Arduino might count 5 presses! This is <b>contact bounce</b>.</p>
<p>The fix is <b>debouncing</b>: ignore changes until the signal has been steady for 20–50 ms. You can do it in code with millis(), or in hardware with a resistor and capacitor (often with a Schmitt trigger chip).</p>
<p>Robots use many switches. A <b>limit switch</b> tells an arm or 3D printer it reached the end of travel. Moving to it at start-up to find “zero” is called <b>homing</b>. <b>Bump switches</b> tell a robot it touched something. A <b>reed switch</b> closes when a magnet comes near. A <b>tilt switch</b> notices when it is tipped.</p>`,
points:["Contact bounce causes many fake presses in a few ms.","Debounce: accept a change only after it is stable for about 20–50 ms.","Limit switch: end-of-travel sensor. Homing: finding the zero position.","Bump switch: touch sensor for collisions.","Reed switch: magnet-operated."],
code:{lang:"cpp",src:`
const int BTN = 2;
int stableState = HIGH, lastReading = HIGH;
unsigned long lastChange = 0;
int presses = 0;

void setup() { pinMode(BTN, INPUT_PULLUP); Serial.begin(9600); }

void loop() {
  int reading = digitalRead(BTN);
  if (reading != lastReading) lastChange = millis();   // it moved: restart timer
  if (millis() - lastChange > 30 && reading != stableState) {
    stableState = reading;                              // steady for 30 ms
    if (stableState == LOW) { presses++; Serial.println(presses); }
  }
  lastReading = reading;
}`},
game:{type:"match",pairs:[["Contact bounce","Metal contacts flicker on and off for a few ms"],["Debounce","Ignore changes until the signal is steady"],["Limit switch","Tells a moving part it reached the end"],["Homing","Moving to a limit switch to find zero"],["Bump switch","Robot feels it hit something"],["Reed switch","Closes when a magnet comes near"]]},
quiz:[{q:"You press once but the code counts 4 presses. Why?",o:["Contact bounce","The battery is full","The LED is red"],why:"The contacts bounce and make extra pulses."},
{q:"A typical debounce time is about…",o:["20–50 ms","5 seconds","1 hour"],why:"Bounce is over within a few ms, so tens of ms is safe."},
{q:"A 3D printer moves each axis to a switch at start-up. This is called…",o:["Homing","Bouncing","Blinking"],why:"It finds its zero position."}]},

{t:"Light and infrared sensors",
story:`<p>An <b>LDR</b> (light-dependent resistor) has lower resistance in bright light and higher resistance in the dark. Put it in a voltage divider with a fixed resistor and read it with analogRead. Easy light sensor!</p>
<p><b>Photodiodes</b> and <b>phototransistors</b> react much faster. An <b>IR sensor</b> pairs an infrared LED (it shines invisible light) with a receiver. White surfaces bounce the IR back strongly. Black surfaces swallow it. This is how <b>line-following robots</b> see a black line (the TCRT5000 is a popular one). Strong sunlight contains IR too and can confuse these sensors, so shield them.</p>
<p>TV remotes use IR blinking at <b>38 kHz</b> so receivers can ignore normal light. <b>Colour sensors</b> (like TCS34725) measure red, green and blue light separately.</p>`,
points:["LDR: resistance drops in bright light. Use it in a voltage divider.","IR reflective sensor: IR LED + receiver. White reflects, black absorbs.","Line followers use rows of IR sensors.","Sunlight contains IR and can confuse IR sensors.","IR remotes use 38 kHz pulses."],
code:{lang:"cpp",src:`
// IR line sensor on A0: more reflected IR changes the reading
const int THRESHOLD = 500;   // find yours by testing!

void setup() { Serial.begin(9600); }

void loop() {
  int v = analogRead(A0);
  if (v > THRESHOLD) Serial.println("BLACK line");
  else               Serial.println("white floor");
  delay(100);
}`,note:"Some modules give HIGH on black, some give LOW. Always test your own sensor and print the values."},
game:{type:"calc",intro:"An LDR sits in a divider: 5 V → 10 kΩ fixed resistor (top) → LDR (bottom) → GND. Vout is measured across the LDR.",problems:[{q:"Room light: the LDR is 10 kΩ. What is Vout?",a:2.5,unit:"V",hint:"5 × 10 ÷ (10 + 10)"},{q:"Dark: the LDR is 90 kΩ. What is Vout?",a:4.5,unit:"V",hint:"5 × 90 ÷ (10 + 90)"},{q:"Bright sun: the LDR is 1 kΩ. What is Vout?",a:0.4545,unit:"V",tol:0.01,hint:"5 × 1 ÷ (10 + 1)"}]},
quiz:[{q:"In bright light, an LDR’s resistance…",o:["Goes down","Goes up","Stays exactly the same"],why:"More light, less resistance."},
{q:"Why can an IR sensor see a black line on a white floor?",o:["White reflects IR, black absorbs it","Black is warmer","It reads the colour name"],why:"The difference in reflected IR shows the line."},
{q:"What can confuse an IR sensor outdoors?",o:["Sunlight, which contains IR","Wind","Gravity"],why:"The sun is a huge IR source."}]},

{t:"Distance sensors",
story:`<p>Bats find walls by shouting and listening for the echo. The <b>HC-SR04 ultrasonic sensor</b> does the same. Send a 10 µs pulse on <b>TRIG</b>. It shouts 8 sound pulses at 40 kHz (too high for us to hear). The <b>ECHO</b> pin stays HIGH until the echo comes back.</p>
<p>Sound travels about 343 m/s, which is <b>0.0343 cm per microsecond</b>. The sound goes there <i>and back</i>, so divide by 2: <span class="f">distance = time × 0.0343 ÷ 2</span>. Range is about 2–400 cm in a cone of about 15°. Soft things (curtains) absorb sound, and slanted surfaces bounce it away.</p>
<p>Other choices: <b>IR distance sensors</b> (Sharp, 10–80 cm, analog, not a straight line graph). <b>Time-of-flight laser</b> sensors (VL53L0X, up to about 2 m, I2C, very narrow beam). <b>LiDAR</b> spins a laser to measure distances all around: 360° scans for mapping.</p>`,
points:["Ultrasonic: distance = echo time × 0.0343 ÷ 2 (cm, with time in µs).","HC-SR04: about 2–400 cm, wide cone, problems with soft or slanted surfaces.","IR distance: short range, analog output.","Time-of-flight laser: narrow, accurate, I2C.","LiDAR: spinning laser, 360° distance scan."],
code:{lang:"cpp",src:`
const int TRIG = 9, ECHO = 10;

void setup() {
  pinMode(TRIG, OUTPUT); pinMode(ECHO, INPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(TRIG, LOW);  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH); delayMicroseconds(10);   // 10 us shout
  digitalWrite(TRIG, LOW);
  long t = pulseIn(ECHO, HIGH, 30000);   // echo time in us (timeout 30 ms)
  float cm = t * 0.0343 / 2;
  Serial.println(cm);
  delay(60);
}`},
game:{type:"sonar",problems:[{q:"The echo time is 1166 µs. How far is the wall?",a:20,unit:"cm",tol:0.4,hint:"1166 × 0.0343 ÷ 2"},{q:"The echo time is 5830 µs. How far is the wall?",a:100,unit:"cm",tol:1},{q:"A wall is 50 cm away. What echo time do you expect?",a:2915,unit:"µs",tol:30,hint:"time = 2 × 50 ÷ 0.0343"}]},
quiz:[{q:"Why divide by 2 in the ultrasonic formula?",o:["The sound goes there and back","Sound is slow on Tuesdays","The sensor has 2 pins"],why:"Echo time covers the round trip."},
{q:"Which surface is hardest for an ultrasonic sensor?",o:["A soft curtain","A flat wall","A wooden door facing it"],why:"Soft materials absorb the sound."},
{q:"Which sensor makes 360° distance scans for mapping?",o:["LiDAR","LDR","Push button"],why:"LiDAR spins a laser all the way round."}]},

{t:"Encoders: counting wheel turns",
story:`<p>How far did Bolt drive? Count how much the wheels turned! An <b>encoder</b> does this. An <b>optical</b> encoder has a disc with slots and a light beam. Each slot passing makes a pulse, a <b>tick</b>. A <b>magnetic</b> encoder uses a magnet and a Hall sensor.</p>
<p>The number of ticks for one full turn is the <b>CPR</b> (counts per revolution). Distance: <span class="f">distance = ticks ÷ CPR × π × D</span>, where D is the wheel diameter.</p>
<p>One channel cannot tell forward from backward. A <b>quadrature</b> encoder has two channels, A and B, a quarter step apart. Which one changes first tells the direction. Counting every edge of both channels gives 4× more resolution. <b>Incremental</b> encoders count changes. <b>Absolute</b> encoders know their exact angle even after power off.</p>`,
points:["Encoder ticks measure rotation.","distance = ticks ÷ CPR × π × wheel diameter.","Quadrature (A and B channels) gives direction and ×4 resolution.","Incremental = counts changes. Absolute = knows the exact angle.","Use interrupts to count fast ticks."],
code:{lang:"cpp",src:`
volatile long ticks = 0;
const int A = 2, B = 4;

void onA() {                     // runs on each rising edge of A
  if (digitalRead(B) == LOW) ticks++;   // B tells direction
  else                       ticks--;
}

void setup() {
  pinMode(A, INPUT_PULLUP); pinMode(B, INPUT_PULLUP);
  attachInterrupt(digitalPinToInterrupt(A), onA, RISING);
  Serial.begin(115200);
}

void loop() {
  const float CPR = 20, D = 6.5;  // wheel diameter in cm
  noInterrupts(); long t = ticks; interrupts();
  Serial.println(t / CPR * 3.1416 * D);   // distance in cm
  delay(200);
}`},
game:{type:"calc",problems:[{q:"Wheel diameter 6.5 cm, CPR = 20. After 100 ticks, how far did it roll?",a:102.1,unit:"cm",tol:1,hint:"100 ÷ 20 = 5 turns. 5 × π × 6.5"},{q:"CPR = 20. In 0.5 s you count 40 ticks. How many RPM is that?",a:240,unit:"RPM",tol:1,hint:"40 ÷ 20 = 2 turns in 0.5 s = 4 turns per second"},{q:"A quadrature encoder has 20 slots. Counting every edge of A and B, what CPR do you get?",a:80,tol:0,hint:"×4"}]},
quiz:[{q:"Why have two channels (A and B) in an encoder?",o:["To know the direction of turning","To use more power","For decoration"],why:"Which channel changes first tells the direction."},
{q:"CPR means…",o:["Counts per revolution","Current per resistor","Cells per row"],why:"Ticks in one full turn."},
{q:"Which encoder still knows its angle after power off?",o:["Absolute","Incremental","Neither"],why:"Absolute encoders read the exact position directly."}]},

{t:"IMU: accelerometer, gyro, compass",
story:`<p>An <b>IMU</b> (inertial measurement unit) is Bolt’s inner ear. It usually has three sensors inside.</p>
<p>The <b>accelerometer</b> measures acceleration, including gravity. When still, it shows which way is down, so you can find <b>tilt</b>. But vibrations make it very noisy. The <b>gyroscope</b> measures how fast it is turning (degrees per second). Add up (integrate) the gyro to get the angle. It is smooth but slowly <b>drifts</b> away from the truth. The <b>magnetometer</b> is a compass. It finds north, but motors and steel confuse it.</p>
<p>The three rotation angles are <b>roll</b> (tip sideways), <b>pitch</b> (nose up/down) and <b>yaw</b> (turn left/right). A 6-DOF IMU (like MPU6050) has accel + gyro. A 9-DOF one adds the compass. Later you will combine them with sensor fusion.</p>`,
points:["Accelerometer: tilt from gravity (when still); noisy with vibration.","Gyroscope: turn speed in °/s. Integrate for angle. Drifts over time.","Magnetometer: compass heading; disturbed by motors and metal.","Roll, pitch, yaw = the three rotation angles.","MPU6050 (6-DOF, I2C 0x68), BNO055 (9-DOF with built-in fusion)."],
code:{lang:"cpp",src:`
// Tilt from the accelerometer (robot standing still)
// ax, ay, az are accelerations read from the IMU
float pitch = atan2(-ax, sqrt(ay * ay + az * az)) * 180.0 / PI;
float roll  = atan2(ay, az) * 180.0 / PI;

// Angle from the gyro: add up turn speed x time
gyroAngle = gyroAngle + gyroZ * dt;   // drifts slowly!`},
game:{type:"bins",bins:["Accelerometer","Gyroscope","Magnetometer"],items:[["Which way is down (when still)",0],["How fast am I spinning?",1],["Which way is north?",2],["Feel a sudden bump or crash",0],["Turning angle that slowly drifts",1],["Gets confused near motors and steel",2]]},
quiz:[{q:"Which IMU sensor slowly drifts over time?",o:["Gyroscope","Accelerometer","Push button"],why:"Small errors add up when you integrate the gyro."},
{q:"Nose up or down is called…",o:["Pitch","Roll","Yaw"],why:"Pitch = nose up/down. Roll = tip sideways. Yaw = turn."},
{q:"Why is the accelerometer bad for angle on a driving, shaking robot?",o:["Vibrations and motion add lots of noise","It only works at night","It measures colour"],why:"It feels every shake, not just gravity."}]},

{t:"More sensors: a quick tour",
story:`<p>Bolt can sense much more. <b>Temperature</b>: LM35 (10 mV per °C), thermistors, DHT11/DHT22 (also humidity). <b>Force and weight</b>: FSR pads, and <b>load cells</b> with an HX711 amplifier for weighing. <b>Current sensors</b> (ACS712, INA219) show when a motor is stuck (stalled) because the current jumps.</p>
<p><b>Hall effect</b> sensors detect magnets. <b>PIR</b> sensors detect warm moving bodies (people). <b>Gas sensors</b> (MQ-2) smell smoke. <b>Microphones</b> hear sounds. <b>Capacitive touch</b> feels a finger. <b>Barometers</b> measure air pressure, which tells a drone its height. <b>GPS</b> gives outdoor position, usually within 2 to 5 m, but not indoors.</p>`,
points:["Temperature: LM35, thermistor, DHT22.","Weight: load cell + HX711. Force: FSR.","Current sensor: detect motor stalls and battery use.","Hall sensor: magnets. PIR: people moving. MQ-2: smoke and gas.","Barometer: altitude. GPS: outdoor position (metres, not cm)."],

quiz:[{q:"How can a robot notice its motor is stuck?",o:["A current sensor shows the current jump","The LED changes colour","GPS signal drops"],why:"A stalled motor draws much more current."},
{q:"Why can’t GPS guide a robot inside a building?",o:["The satellite signals do not reach well indoors","GPS only works at night","It is too accurate"],why:"Walls and roofs block the signals."},
{q:"An LM35 gives 250 mV. What temperature is it?",o:["25 °C","250 °C","2.5 °C"],why:"10 mV per °C: 250 ÷ 10 = 25."}]},

{t:"Cameras and depth sensors",
story:`<p>A camera is a grid of tiny light sensors called <b>pixels</b>. A 640 × 480 image has 307 200 of them. Each colour pixel has three numbers: <b>Red, Green, Blue</b> (RGB), each 0 to 255. So one picture is just a huge table of numbers!</p>
<p>Important camera specs: <b>resolution</b> (how many pixels), <b>frame rate</b> (pictures per second, like 30 fps), and <b>field of view</b> (how wide it sees). More pixels and frames need more computing power, so cameras often go on a Raspberry Pi or NVIDIA Jetson. The ESP32-CAM is a tiny, cheap option.</p>
<p>A normal camera does not know distance. <b>Depth cameras</b> do. <b>Stereo</b> cameras use two lenses like your two eyes. <b>Structured light</b> cameras shine a dot pattern. <b>ToF</b> cameras time how long light takes to bounce back. <b>Thermal cameras</b> see heat.</p>`,
points:["An image is a grid of pixels. Each colour pixel = R, G, B values from 0 to 255.","Resolution, frame rate (fps) and field of view.","Images are big data. Vision needs strong processors.","Depth cameras: stereo, structured light, time-of-flight.","Thermal cameras see heat."],
game:{type:"calc",problems:[{q:"How many pixels in a 640 × 480 image?",a:307200,tol:0},{q:"Each pixel needs 3 bytes (R, G, B). How many bytes for one 640 × 480 frame?",a:921600,tol:0},{q:"At 30 frames per second, how many megabytes per second is that? (1 MB = 1 000 000 bytes)",a:27.648,unit:"MB/s",tol:0.3}]},
quiz:[{q:"A colour pixel is stored as…",o:["Three numbers: red, green, blue","One letter","A sound"],why:"RGB, each 0–255."},
{q:"How do stereo cameras find depth?",o:["They compare two views, like your two eyes","They listen for echoes","They weigh the object"],why:"The difference between the two images gives distance."},
{q:"30 fps means…",o:["30 pictures every second","30 pixels","30 metres range"],why:"Frames per second."}]},

{t:"Noise and filtering",
story:`<p>Even when Bolt is still, its sensor readings jump around a little: 20.1, 19.8, 20.4, 19.9… That jitter is <b>noise</b>. We tame it with <b>filters</b>.</p>
<p>A <b>moving average</b> keeps the last N readings and averages them. A <b>median filter</b> picks the middle value. It is brilliant at removing single crazy spikes (common with ultrasonic sensors). An <b>exponential filter</b> (a simple low-pass filter) blends new and old: <span class="f">smooth = α × new + (1 − α) × smooth</span>, with α between 0 and 1.</p>
<p>There is always a <b>trade-off</b>. More smoothing means more <b>lag</b>: the filter is slow to notice real changes. A robot that reacts too slowly can crash. Pick just enough smoothing.</p>`,
points:["Noise = random jitter in readings.","Moving average: mean of the last N samples.","Median filter: removes spikes.","Exponential filter: smooth = α·new + (1−α)·smooth.","Smoother = slower (more lag). Balance them."],
code:{lang:"cpp",src:`
float smooth = 0;
const float ALPHA = 0.2;   // 0..1, smaller = smoother but slower

void loop() {
  float raw = readDistance();
  smooth = ALPHA * raw + (1 - ALPHA) * smooth;

  // moving average of the last 5 readings
  static float buf[5]; static int i = 0;
  buf[i] = raw; i = (i + 1) % 5;
  float avg = (buf[0] + buf[1] + buf[2] + buf[3] + buf[4]) / 5;
}`},
game:{type:"filter"},
quiz:[{q:"Which filter is best at removing a single crazy spike?",o:["Median filter","No filter","Bigger battery"],why:"The middle value ignores one extreme reading."},
{q:"What is the downside of heavy smoothing?",o:["It reacts slowly to real changes (lag)","It uses more wires","It makes readings negative"],why:"More smoothing, more delay."},
{q:"In smooth = α·new + (1−α)·smooth, a smaller α gives…",o:["Smoother but slower output","Faster but noisier output","No change"],why:"Small α trusts old values more."}]}
]});

W({title:"Motors and Actuators",tag:"DC motors, H-bridges, PWM speed, servos, steppers, BLDC, gears.",badge:"Motor Master",level:"Intermediate",

{t:"What is an actuator?",
story:`<p>An <b>actuator</b> turns energy into motion. It is the muscle of the robot. Most hobby robots use <b>electric motors</b>: DC motors, servos, steppers and brushless (BLDC) motors.</p>
<p>Some actuators spin (<b>rotary</b>). Others push and pull in a straight line (<b>linear</b>). A <b>solenoid</b> is a coil that snaps a metal rod in or out, like a door lock. A <b>linear actuator</b> uses a motor and a screw to push slowly and strongly.</p>
<p>Big machines use fluid power. <b>Pneumatic</b> actuators use air pressure: fast and springy, great for soft grippers. <b>Hydraulic</b> actuators use oil: huge force, like the arm of a JCB excavator. There are also odd ones: <b>shape-memory wires</b> that shrink when heated, and <b>piezo</b> actuators that move tiny, precise amounts.</p>`,
points:["Actuator = energy → motion.","Rotary (spins) or linear (straight line).","Electric: DC, servo, stepper, BLDC, solenoid, linear actuator.","Pneumatic (air): fast, soft. Hydraulic (oil): very strong.","Shape-memory alloy and piezo are special small actuators."],
game:{type:"bins",bins:["Rotary (spins)","Linear (straight line)"],items:[["DC motor",0],["Solenoid door lock",1],["Servo motor",0],["Air cylinder (pneumatic)",1],["Stepper motor",0],["Lead-screw linear actuator",1],["Excavator arm cylinder (hydraulic)",1],["Drone propeller motor",0]]},
quiz:[{q:"An actuator is…",o:["A part that makes motion","A part that measures distance","A type of battery"],why:"Actuators are the muscles."},
{q:"Which uses oil to make very large forces?",o:["Hydraulic","Pneumatic","Piezo"],why:"Hydraulics use liquid under high pressure."},
{q:"A solenoid moves…",o:["In a straight line (in and out)","In circles","Not at all"],why:"It is a linear actuator."}]},

{t:"DC motors",
story:`<p>Inside a <b>DC motor</b> are magnets and coils of wire. When current flows through a coil, it becomes a magnet and gets pushed by the fixed magnets, so the shaft spins. <b>Brushes</b> keep switching the current so it keeps turning. Swap the two wires and it spins the other way.</p>
<p><b>More voltage → more speed.</b> <b>More load → more current.</b> If you hold the shaft so it cannot turn, it is <b>stalled</b>. Stall current is very high, maybe 5 to 10 times normal, and it can burn the motor or the driver. A spinning motor also makes its own voltage, like a generator. This is <b>back-EMF</b>.</p>
<p>Small motors spin very fast but are weak, so we add a <b>gearbox</b>: the yellow “TT” motors and tiny N20 motors are gear motors. Motors make electrical noise, so solder a 100 nF capacitor across the terminals. And never connect one directly to an Arduino pin.</p>`,
points:["Swap the wires → reverse direction.","Speed rises with voltage. Current rises with load.","Stall current is very high and dangerous for drivers.","Gear motors trade speed for torque.","Add a 100 nF capacitor across the motor to reduce noise."],
game:{type:"match",pairs:[["Higher voltage","Motor spins faster"],["Swap the two wires","Motor spins the other way"],["Shaft blocked (stalled)","Current jumps very high and it heats up"],["Heavier load","Slows down and draws more current"],["Gearbox","Less speed, more torque"],["Back-EMF","A spinning motor makes its own voltage"]]},
quiz:[{q:"How do you reverse a DC motor?",o:["Swap its two wires (reverse the current)","Add more voltage","Paint it"],why:"Reversing current reverses the force."},
{q:"When is a DC motor’s current highest?",o:["When it is stalled (blocked)","When spinning freely","When switched off"],why:"No back-EMF to oppose the supply."},
{q:"Why use a gear motor in a robot car?",o:["The motor alone is too fast and too weak","Gears make it lighter","To change the colour"],why:"Gears give more torque at lower speed."}]},

{t:"H-bridges and motor drivers",
story:`<p>To spin a motor both ways, we need to flip which wire gets + and which gets ground. Four switches arranged like the letter <b>H</b> do this: the <b>H-bridge</b>. Close the top-left and bottom-right switches: current flows one way. Close top-right and bottom-left: it flows the other way.</p>
<p>Never close both switches on the <b>same side</b>. That connects + straight to ground: a short called <b>shoot-through</b>. Driver chips prevent this for you.</p>
<p>Popular <b>motor driver</b> boards: <b>L298N</b> (old, cheap, but wastes about 2 V as heat), <b>L293D</b>, <b>TB6612FNG</b> (efficient, about 1.2 A per motor), <b>DRV8833</b>, and <b>BTS7960</b> for big motors. Control is simple: IN1 = 1, IN2 = 0 → forward. 0, 1 → reverse. 0, 0 → coast. 1, 1 → brake.</p>`,
points:["H-bridge = 4 switches that let current flow either way through the motor.","Forward: S1 + S4. Reverse: S2 + S3.","Same-side switches together = shoot-through short.","IN1/IN2: 10 forward, 01 reverse, 00 coast, 11 brake.","TB6612FNG is more efficient than the L298N."],
code:{lang:"cpp",src:`
const int IN1 = 7, IN2 = 8;

void forward() { digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);  }
void reverse() { digitalWrite(IN1, LOW);  digitalWrite(IN2, HIGH); }
void coast()   { digitalWrite(IN1, LOW);  digitalWrite(IN2, LOW);  }
void brake()   { digitalWrite(IN1, HIGH); digitalWrite(IN2, HIGH); }

void setup() { pinMode(IN1, OUTPUT); pinMode(IN2, OUTPUT); }

void loop() {
  forward(); delay(1500);
  brake();   delay(300);
  reverse(); delay(1500);
  coast();   delay(1000);
}`},
game:{type:"hbridge"},
quiz:[{q:"What does an H-bridge let you do?",o:["Spin a motor in both directions","Measure distance","Charge a battery"],why:"It can reverse the current through the motor."},
{q:"Closing both switches on one side of the H causes…",o:["A short circuit (shoot-through)","Faster spinning","Nothing"],why:"+ connects straight to ground."},
{q:"On a typical driver, IN1 = LOW, IN2 = HIGH means…",o:["Reverse","Forward","Brake"],why:"01 is the opposite of 10."}]},

{t:"Controlling motor speed",
story:`<p>Direction comes from IN1 and IN2. <b>Speed</b> comes from <b>PWM</b> on the driver’s enable pin (often called ENA or PWMA). <span class="f">analogWrite(ENA, 0..255)</span>. 255 is full speed.</p>
<p>Very low PWM values may not move the motor at all, because friction wins. This is the <b>dead band</b>. Find the smallest value that starts your motor.</p>
<p>Do not jump from 0 to full speed instantly. The wheels slip and the current spikes. Instead <b>ramp</b>: increase speed a little each loop. To turn a two-wheeled robot, drive the wheels at <b>different speeds</b>: right faster than left turns left. Opposite directions make it spin on the spot.</p>`,
points:["Speed: PWM on the enable pin. Direction: IN1 and IN2.","value = speed% × 255 ÷ 100.","Dead band: low PWM may not overcome friction.","Ramp speed up and down smoothly.","Turn by giving the two wheels different speeds."],
code:{lang:"cpp",src:`
const int ENA = 5, IN1 = 7, IN2 = 8;   // left motor
const int ENB = 6, IN3 = 9, IN4 = 10;  // right motor

void drive(int left, int right) {      // -255..255 each
  digitalWrite(IN1, left >= 0);  digitalWrite(IN2, left < 0);
  digitalWrite(IN3, right >= 0); digitalWrite(IN4, right < 0);
  analogWrite(ENA, abs(left));
  analogWrite(ENB, abs(right));
}

void loop() {
  for (int s = 0; s <= 200; s += 5) { drive(s, s); delay(20); } // ramp up
  drive(120, 200);  delay(1000);   // curve left
  drive(150, -150); delay(600);    // spin right on the spot
  drive(0, 0);      delay(1000);
}`},
game:{type:"calc",problems:[{q:"To run a motor at 60 % speed, what analogWrite value?",a:153,tol:1,hint:"0.6 × 255"},{q:"analogWrite(ENA, 64) is about what percent speed?",a:25,unit:"%",tol:1},{q:"A 12 V battery and 50 % duty. Average motor voltage?",a:6,unit:"V"}]},
quiz:[{q:"Which pin sets motor speed on a driver?",o:["The enable (PWM) pin","The ground pin","Any LED pin"],why:"PWM on enable controls power."},
{q:"Why ramp the speed up slowly?",o:["To avoid wheel slip and current spikes","To save code space","To make it louder"],why:"Sudden starts jerk and draw big current."},
{q:"Left wheel 200, right wheel 100. The robot…",o:["Curves to the right","Curves to the left","Goes straight"],why:"The faster left wheel pushes it to the right."}]},

{t:"Servo motors",
story:`<p>A <b>servo</b> is a DC motor with a gearbox, a <b>potentiometer</b> (to sense its angle) and a tiny control circuit, all in one box. You tell it an angle, and it goes there and <b>holds</b> it. That is a <b>closed loop</b>: it keeps checking and correcting.</p>
<p>It has three wires: brown/black = GND, red = power (about 5–6 V), orange/yellow = signal. The signal is a pulse sent every <b>20 ms</b> (50 Hz). <b>1 ms</b> means 0°, <b>1.5 ms</b> means 90°, <b>2 ms</b> means 180° (many servos actually use 0.5–2.5 ms).</p>
<p>The Arduino <b>Servo library</b> makes the pulses for you: <span class="f">myServo.write(90)</span>. Strength is given as torque in kg·cm: an SG90 gives about 1.8 kg·cm, an MG996R about 10. Power big servos from a separate supply, not the Arduino 5 V pin. A <b>continuous rotation</b> servo spins like a wheel, and write() sets speed instead of angle.</p>`,
points:["Servo = motor + gears + angle sensor + controller (closed loop).","Wires: GND (brown/black), + (red), signal (orange/yellow).","Pulse every 20 ms: 1 ms = 0°, 1.5 ms = 90°, 2 ms = 180°.","Servo library: attach(pin), write(angle).","Torque in kg·cm. Use separate power for bigger servos."],
code:{lang:"cpp",src:`
#include <Servo.h>
Servo head;

void setup() {
  head.attach(9);          // signal wire on pin 9
}

void loop() {
  for (int a = 0; a <= 180; a += 2) { head.write(a); delay(15); }  // sweep
  for (int a = 180; a >= 0; a -= 2) { head.write(a); delay(15); }
}`},
game:{type:"servo"},
quiz:[{q:"A 1.5 ms pulse usually means…",o:["90°","0°","180°"],why:"1 ms = 0°, 2 ms = 180°, so the middle is 90°."},
{q:"Why is a servo called closed-loop?",o:["It measures its own angle and corrects itself","It has a round case","It uses a loop of wire"],why:"Feedback from the internal potentiometer."},
{q:"How often does a servo expect a pulse?",o:["Every 20 ms (50 Hz)","Every 1 second","Once only"],why:"It needs a fresh pulse 50 times a second."}]},

{t:"Stepper motors",
story:`<p>A <b>stepper motor</b> moves in exact little jumps called <b>steps</b>. A common one moves <b>1.8° per step</b>, so <span class="f">360 ÷ 1.8 = 200 steps</span> make a full turn. The driver energises the coils in order, and the shaft clicks from step to step. It also has strong <b>holding torque</b>: it stays put when stopped (while powered).</p>
<p>Steppers are used in 3D printers and CNC machines because you can move a precise amount just by counting steps. No sensor needed: this is <b>open-loop</b> control. But if the load is too heavy, it can <b>skip steps</b> and never know it.</p>
<p>Drivers like <b>A4988</b>, <b>DRV8825</b> and the quiet <b>TMC2209</b> need just two pins: <b>STEP</b> (one pulse = one step) and <b>DIR</b> (direction). <b>Microstepping</b> splits each step into smaller ones (like 1/16) for smooth, quiet motion. The cheap 28BYJ-48 with a ULN2003 board is a geared stepper with about 2048 steps per turn.</p>`,
points:["Step angle 1.8° → 200 steps per revolution.","Open-loop: count steps, no feedback. Can skip steps if overloaded.","Driver pins: STEP and DIR.","Microstepping (1/2 … 1/16 …) = smoother and finer.","Great for printers, CNC, camera sliders."],
code:{lang:"cpp",src:`
const int STEP = 3, DIR = 4;

void moveSteps(long n, bool cw) {
  digitalWrite(DIR, cw ? HIGH : LOW);
  for (long i = 0; i < n; i++) {
    digitalWrite(STEP, HIGH); delayMicroseconds(800);
    digitalWrite(STEP, LOW);  delayMicroseconds(800);
  }
}

void setup() { pinMode(STEP, OUTPUT); pinMode(DIR, OUTPUT); }

void loop() {
  moveSteps(200, true);  delay(500);   // one full turn
  moveSteps(50, false);  delay(500);   // quarter turn back
}`},
game:{type:"calc",problems:[{q:"Step angle is 1.8°. Steps per full turn?",a:200,tol:0},{q:"With 1/16 microstepping, how many microsteps per turn?",a:3200,tol:0},{q:"200 steps per turn. How many steps to turn 90°?",a:50,tol:0},{q:"A lead screw moves 8 mm per turn, 200 steps per turn. Steps to move 2 mm?",a:50,tol:0,hint:"2 mm is a quarter turn"}]},
quiz:[{q:"Why can a stepper work without a position sensor?",o:["It moves an exact angle for each step","It has GPS","It never moves"],why:"Counting steps tells you the position (open loop)."},
{q:"What is the danger of open-loop stepper control?",o:["It can skip steps under heavy load without knowing","It explodes","It only works backwards"],why:"No feedback means lost steps go unnoticed."},
{q:"Microstepping makes motion…",o:["Smoother and finer","Rougher","Faster only"],why:"Each full step is split into smaller steps."}]},

{t:"Brushless motors and ESCs",
story:`<p>Drones and electric scooters use <b>brushless DC motors</b> (BLDC). The magnets spin and the coils stay still. There are no brushes to wear out, so they are <b>efficient, powerful and long-lasting</b>.</p>
<p>Without brushes, something must switch the coils at the right moment. That is the <b>ESC</b> (electronic speed controller). It has three thick wires to the motor. You control an ESC with a servo-style pulse (1–2 ms). Most ESCs need an <b>arming</b> step at start-up for safety.</p>
<p>Brushless motors have a <b>KV rating</b>: RPM per volt with no load. <span class="f">RPM ≈ KV × V</span>. A 1000 KV motor on 11.1 V spins about 11 100 RPM. High KV = fast and weak (small propellers). Low KV = slower and strong (big propellers, robot joints). Robot dogs and gimbals use clever control called <b>FOC</b> (field-oriented control) for smooth, quiet, strong motion.</p>`,
points:["BLDC: no brushes, efficient, long life.","ESC switches the 3 phases. Control it with servo-style pulses.","KV = RPM per volt (no load). RPM ≈ KV × V.","High KV: fast, weak. Low KV: slow, strong.","FOC gives smooth torque control for robot joints."],
game:{type:"calc",problems:[{q:"A 1000 KV motor on a 3S LiPo (11.1 V). No-load RPM?",a:11100,unit:"RPM",tol:50},{q:"A 2300 KV motor on 2S (7.4 V). No-load RPM?",a:17020,unit:"RPM",tol:80},{q:"You need about 5000 RPM from a 12 V supply. What KV?",a:416.7,unit:"KV",tol:5}]},
quiz:[{q:"What does an ESC do?",o:["Switches the brushless motor’s coils to make it spin","Stores energy","Measures distance"],why:"Brushless motors need electronic switching."},
{q:"KV rating means…",o:["RPM per volt","Kilovolts","Kilograms per volt"],why:"No-load speed for each volt."},
{q:"Why are BLDC motors used in drones?",o:["Efficient, powerful and light","They are the cheapest","They need no power"],why:"Great power for their weight."}]},

{t:"Torque, speed and gears",
story:`<p><b>Torque</b> is turning force. Push a door at the handle and it opens easily. Push near the hinges and it is hard. Torque = force × distance: <span class="f">τ = F × r</span>, in newton-metres (N·m) or kg·cm.</p>
<p>Gears trade speed for torque. A small gear (driver) turning a big gear (driven) makes the output <b>slower but stronger</b>. <span class="f">ratio = driven teeth ÷ driver teeth</span>. Output speed = input speed ÷ ratio. Output torque ≈ input torque × ratio (a bit less, due to friction). Power stays about the same: <span class="f">power = torque × speed</span>.</p>
<p>Gear types: <b>spur</b> (simple), <b>worm</b> (very high ratio, cannot be turned backwards, so it holds position), <b>planetary</b> (compact and strong), <b>belts and pulleys</b> (quiet, longer distances), and <b>rack and pinion</b> (turns rotation into a straight line).</p>`,
points:["Torque τ = F × r (N·m). 1 kg·cm ≈ 0.098 N·m.","Gear ratio = driven teeth ÷ driver teeth.","Big ratio: slower, stronger. Small ratio: faster, weaker.","Power = torque × angular speed stays about the same.","Worm gears hold position. Rack and pinion makes linear motion."],
game:{type:"gears"},
quiz:[{q:"A 10-tooth gear drives a 40-tooth gear. The ratio is…",o:["4 : 1 (slower, 4× stronger)","1 : 4 (faster)","40 : 1"],why:"40 ÷ 10 = 4."},
{q:"Which gear type can hold a robot arm up even with power off?",o:["Worm gear","Spur gear","No gear can"],why:"Worm gears cannot be back-driven easily."},
{q:"Torque is…",o:["Turning force = force × distance","Speed in a straight line","Electric charge"],why:"τ = F × r."}]}
]});

W({title:"Power and Batteries",tag:"Battery types, capacity, runtime, regulators and safe wiring.",badge:"Power Keeper",level:"Intermediate",
desc:"A robot is only as good as its power. Learn to choose batteries, calculate runtime, make the right voltages, and wire it all safely.",
lessons:[
{t:"Battery types",
story:`<p>Batteries are made of <b>cells</b>. Each chemistry gives a different voltage per cell. <b>Alkaline AA</b>: 1.5 V, not rechargeable, weak for motors. <b>NiMH AA</b>: 1.2 V, rechargeable. <b>Li-ion</b> (like the 18650 cell): 3.7 V nominal, 4.2 V full, about 3.0 V empty. <b>LiPo</b> pouches: also 3.7 V per cell, light, and can give huge currents: perfect for drones. <b>LiFePO4</b>: 3.2 V, safer and long-lasting.</p>
<p>Cells in <b>series</b> add voltage: 2 Li-ion cells = <b>2S</b> = 7.4 V. Cells in <b>parallel</b> add capacity. A pack labelled <b>3S1P</b> has 3 in series, 1 in parallel = 11.1 V.</p>
<p>LiPo safety: never go below about 3.0 V per cell, never puncture or bend, charge with a proper <b>balance charger</b> inside a fire-safe bag, never charge unattended, and retire any puffy (swollen) battery. A <b>BMS</b> (battery management system) board protects Li-ion packs.</p>`,
points:["Alkaline 1.5 V, NiMH 1.2 V, Li-ion / LiPo 3.7 V, LiFePO4 3.2 V per cell.","Series adds voltage (S). Parallel adds capacity (P).","Li-ion: 4.2 V full, about 3.0 V empty per cell.","LiPo: balance charger, fire-safe bag, never over-discharge.","BMS boards protect lithium packs."],
game:{type:"calc",problems:[{q:"3 Li-ion cells in series (3S). Nominal voltage?",a:11.1,unit:"V"},{q:"The same 3S pack fully charged?",a:12.6,unit:"V",hint:"4.2 V per cell"},{q:"4 alkaline AA cells in series?",a:6,unit:"V"},{q:"Two 2000 mAh cells in parallel. Total capacity?",a:4000,unit:"mAh",tol:0}]},
quiz:[{q:"What does 2S mean on a battery?",o:["2 cells in series","2 spare cells","2 seconds"],why:"S = series. Voltages add."},
{q:"A LiPo battery is puffed up. You should…",o:["Stop using it and dispose of it safely","Charge it faster","Squeeze it flat"],why:"Swelling means damage and fire risk."},
{q:"Connecting cells in parallel increases…",o:["Capacity (how long it lasts)","Voltage","Weight only"],why:"Parallel adds mAh, voltage stays the same."}]},

{t:"Capacity, runtime and C rating",
story:`<p>Battery <b>capacity</b> is in milliamp-hours (<b>mAh</b>). 2000 mAh can give 2000 mA for 1 hour, or 1000 mA for 2 hours, or 500 mA for 4 hours. So: <span class="f">runtime (h) = capacity (mAh) ÷ current (mA)</span>.</p>
<p>In real life we only use about <b>80 %</b>, to protect the battery and because voltage drops near the end. Add up the current of every part to make a <b>power budget</b>.</p>
<p>The <b>C rating</b> says how fast a battery can safely give current: <span class="f">max current = C × capacity</span>. A 2200 mAh (2.2 Ah) 25C LiPo can give 25 × 2.2 = 55 A. Drones need high C. Slow robots do not.</p>`,
points:["runtime ≈ capacity × 0.8 ÷ total current.","Make a power budget: list every part and its current.","Max discharge current = C rating × capacity (in Ah).","Motors usually use the most current.","Measure real current with a multimeter or current sensor."],
game:{type:"battery"},
quiz:[{q:"A 3000 mAh battery and a 1000 mA robot. Ideal runtime?",o:["3 hours","3000 hours","0.3 hours"],why:"3000 ÷ 1000 = 3 h (less in real life)."},
{q:"A 1000 mAh 20C battery can give at most…",o:["20 A","20 mA","1 A"],why:"20 × 1 Ah = 20 A."},
{q:"Why plan for only about 80 % of the capacity?",o:["To protect the battery and allow for voltage drop","Because batteries are 20 % air","For no reason"],why:"Draining fully damages lithium cells."}]},

{t:"Voltage regulators",
story:`<p>Different parts want different voltages: Arduino 5 V, ESP32 3.3 V, motors 6–12 V. A <b>regulator</b> makes a steady voltage from a bigger one.</p>
<p>A <b>linear regulator</b> (7805 for 5 V, AMS1117 for 3.3 V) is simple and quiet, but it burns the extra voltage as heat: <span class="f">heat = (Vin − Vout) × I</span>. From 12 V to 5 V at 1 A, it wastes 7 W. Ouch, very hot! It also needs a <b>dropout</b> gap: the input must be 1–2 V above the output (an <b>LDO</b> needs less).</p>
<p>A <b>switching regulator</b> is smarter and about <b>85–95 % efficient</b>. A <b>buck</b> converter steps voltage <i>down</i>. A <b>boost</b> converter steps voltage <i>up</i>. A <b>buck-boost</b> does both. For battery robots, buck converters are usually the best choice.</p>`,
points:["Linear regulator heat = (Vin − Vout) × I.","Linear needs dropout headroom; an LDO needs less.","Buck = step down, boost = step up, both ≈ 90 % efficient.","Input power ≈ output power ÷ efficiency.","Use a buck converter for 5 V from a 2S/3S battery."],
game:{type:"calc",problems:[{q:"A 7805 makes 5 V from 12 V at 0.5 A. Heat wasted?",a:3.5,unit:"W",hint:"(12 − 5) × 0.5"},{q:"A buck converter gives 5 V at 2 A. Output power?",a:10,unit:"W"},{q:"If it is 90 % efficient, what input power does it need?",a:11.11,unit:"W",tol:0.1,hint:"10 ÷ 0.9"},{q:"From a 12 V battery, what input current is that?",a:0.926,unit:"A",tol:0.02,hint:"11.11 ÷ 12"}]},
quiz:[{q:"What does a buck converter do?",o:["Steps voltage down efficiently","Steps voltage up","Stores charge"],why:"Buck = down. Boost = up."},
{q:"Why do linear regulators get hot?",o:["They burn the extra voltage as heat","They are made of iron","They spin"],why:"Heat = voltage drop × current."},
{q:"You need 5 V from 3.7 V. Which regulator?",o:["Boost converter","Buck converter","7805 linear"],why:"You need to step up."}]},

{t:"Safe power wiring",
story:`<p>Here is a classic beginner bug: the robot works on the desk, but every time the motors start, the Arduino <b>resets</b>. Why? The motors grab a big gulp of current, the battery voltage dips, and the Arduino’s brain browns out. This is a <b>brownout</b>.</p>
<p>The fixes: power motors and logic separately (or through separate regulators), always join the <b>grounds</b>, add a big capacitor (100–470 µF) near the motor driver and 100 nF near each chip, and use thick wires for motor current.</p>
<p>Add protection: a main <b>switch</b>, a <b>fuse</b>, and <b>reverse-polarity protection</b> (a diode or MOSFET) so a backwards battery does no damage. Use proper connectors like XT60 for LiPos and JST for small parts. Twist motor wires together to reduce noise. Keep high-current paths short.</p>`,
points:["Brownout: voltage dips when motors start, so the brain resets.","Separate motor and logic power, but connect the grounds.","Capacitors: big ones near motors, 100 nF near chips.","Thick wires for motor current (check the wire gauge, AWG).","Main switch + fuse + reverse-polarity protection."],
game:{type:"bins",bins:["Good practice","Bad practice"],items:[["Connect the motor driver ground to the Arduino ground",0],["Power big motors from the Arduino 5V pin",1,"The Arduino’s 5 V pin cannot supply motor currents."],["Add a fuse near the battery",0],["Use thin jumper wires for 3 A motor current",1],["Put a 100 nF capacitor near each chip",0],["No main power switch",1],["Use a separate regulator for the logic",0],["Twist the two motor wires together",0]]},
quiz:[{q:"Your Arduino resets whenever the motors start. The most likely cause is…",o:["Brownout: the voltage dips","Too much code","The LED is broken"],why:"Motors pull the supply voltage down."},
{q:"Separate motor and logic batteries should…",o:["Share a common ground","Never touch at all","Be connected + to +"],why:"Signals need the same 0 V reference."},
{q:"What protects against plugging the battery in backwards?",o:["Reverse-polarity protection (diode or MOSFET)","A bigger LED","More code"],why:"It blocks current in the wrong direction."}]}
]});

W({title:"Mechanics and Robot Bodies",tag:"Forces, torque, joints, DOF, wheels, legs, materials and grippers.",badge:"Chassis Crafter",level:"Intermediate",
desc:"Electronics need a body. Learn the physics that keeps robots upright and strong, how joints and wheels move, and how to build and grip.",
lessons:[
{t:"Forces, friction and balance",
story:`<p>A <b>force</b> is a push or a pull, measured in <b>newtons (N)</b>. Newton’s rule: <span class="f">F = m × a</span> (force = mass × acceleration). Gravity pulls with <span class="f">weight = m × g</span>, where g ≈ 9.8 m/s². A 1 kg robot weighs about 9.8 N.</p>
<p><b>Friction</b> is the grip between surfaces. Wheels need it to push. Too little and they spin and slip. Maximum friction = <span class="f">μ × weight</span>, where μ is the grip number of the two surfaces (rubber on wood is high, plastic on tiles is low).</p>
<p>Every robot has a <b>centre of mass</b> (CoM): its balance point. The area between its wheels or feet touching the ground is the <b>support polygon</b>. If the CoM stays above it, the robot stays up. Keep heavy parts (batteries) <b>low and central</b>. A robot that stays up while standing still is <b>statically stable</b>.</p>`,
points:["F = m × a. Weight = m × 9.8.","Friction max = μ × weight. Wheels need grip.","Centre of mass must stay over the support polygon.","Keep heavy parts low and central.","Static stability = stays up when stopped."],
game:{type:"calc",problems:[{q:"A robot has a mass of 2 kg. Its weight?",a:19.6,unit:"N"},{q:"You push a 2 kg robot with 4 N (no friction). Acceleration?",a:2,unit:"m/s²"},{q:"Weight is 20 N and μ = 0.5. Maximum friction force?",a:10,unit:"N"}]},
quiz:[{q:"To make a robot harder to tip over, you should…",o:["Put heavy parts low and central","Put the battery on top","Make the wheels closer together"],why:"Low CoM and wide base = stable."},
{q:"Why do wheels slip on a shiny floor?",o:["Low friction (small μ)","Too much gravity","The motors are too slow"],why:"Not enough grip."},
{q:"F = m × a. A bigger mass with the same force gives…",o:["Less acceleration","More acceleration","The same acceleration"],why:"a = F ÷ m."}]},

{t:"Torque for arms and wheels",
story:`<p>Bolt’s arm holds a 0.5 kg bottle 20 cm from its shoulder. The bottle’s weight is about 4.9 N. The shoulder must give <span class="f">τ = 4.9 × 0.2 = 0.98 N·m</span>. In hobby units that is about <b>10 kg·cm</b> (0.5 kg × 20 cm). Quick trick: <span class="f">kg·cm = mass (kg) × distance (cm)</span>.</p>
<p>The <b>shoulder</b> carries the load <i>and</i> the rest of the arm, so it needs the biggest motor. Joints near the hand can be smaller. Engineers add a <b>safety factor</b> of 1.5–2× because real life has friction, speed-ups and surprises.</p>
<p>For wheels: <span class="f">push force = wheel torque ÷ wheel radius</span>. Bigger wheels go faster per turn but need more torque to push.</p>`,
points:["Torque to hold a load = weight × distance from the joint.","Quick hobby unit: kg·cm = kg × cm.","The base and shoulder joints need the most torque.","Use a safety factor of about 2×.","Wheel push force = torque ÷ radius."],
game:{type:"calc",problems:[{q:"Torque to hold 0.5 kg at 10 cm, in kg·cm?",a:5,unit:"kg·cm"},{q:"Add a safety factor of 2. Torque needed?",a:10,unit:"kg·cm"},{q:"An SG90 servo gives 1.8 kg·cm. How far away (cm) can it hold a 0.2 kg load?",a:9,unit:"cm"},{q:"A wheel of radius 0.03 m with 0.3 N·m torque. Push force?",a:10,unit:"N"}]},
quiz:[{q:"Which joint of a robot arm needs the most torque?",o:["The base/shoulder","The fingertip","They all need the same"],why:"It holds everything beyond it."},
{q:"Moving the load further from the joint makes the torque…",o:["Bigger","Smaller","Zero"],why:"τ = F × distance."},
{q:"Why add a safety factor?",o:["Real life adds friction, acceleration and surprises","To use up money","Because maths is wrong"],why:"Design margin keeps it reliable."}]},

{t:"Joints, links and degrees of freedom",
story:`<p>A robot arm is a chain of stiff parts called <b>links</b>, joined by <b>joints</b>. A <b>revolute</b> joint rotates, like your elbow. A <b>prismatic</b> joint slides, like a drawer. A <b>spherical</b> joint swivels in all directions, like your shoulder.</p>
<p><b>Degrees of freedom</b> (DOF) count how many independent ways something can move. A free object in 3D space has <b>6 DOF</b>: move along x, y, z, and rotate roll, pitch, yaw. So an arm needs <b>6 joints</b> to put its tool anywhere at any angle. Your arm has 7, one extra, which helps you reach around things.</p>
<p>Arm types: <b>articulated</b> (like a human arm), <b>SCARA</b> (fast, flat pick-and-place), <b>Cartesian/gantry</b> (x, y, z sliders, like a 3D printer), <b>cylindrical</b>, and <b>delta</b> (three light arms, super fast at picking sweets). The space an arm can reach is its <b>workspace</b>.</p>`,
points:["Links = stiff parts. Joints = connections that allow motion.","Revolute (rotate), prismatic (slide), spherical (ball).","A free body in 3D has 6 DOF: 3 position + 3 rotation.","6 DOF arm = any position and orientation (in its workspace).","Types: articulated, SCARA, Cartesian, cylindrical, delta."],
game:{type:"match",pairs:[["Revolute joint","Rotates, like an elbow"],["Prismatic joint","Slides in a line, like a drawer"],["6 DOF","Enough to place a tool anywhere at any angle"],["Cartesian robot","Moves on x, y, z rails, like a 3D printer"],["SCARA","Fast, flat pick-and-place arm"],["Delta robot","Three light arms, super fast picking"],["Workspace","All the points the arm can reach"]]},
quiz:[{q:"How many DOF does a free object in 3D have?",o:["6","3","2"],why:"3 for position + 3 for rotation."},
{q:"A drawer slide is which joint type?",o:["Prismatic","Revolute","Spherical"],why:"It slides in a straight line."},
{q:"A 3D printer moving on x, y, z rails is a…",o:["Cartesian robot","Delta robot","Humanoid"],why:"Straight-line axes at right angles."}]},

{t:"Wheels and drive systems",
story:`<p><b>Differential drive</b>: two powered wheels and a free caster. Steer by changing each wheel’s speed. It can spin on the spot. Simple and the most common for hobby robots. <b>Skid steer</b>: 4 wheels or tracks, turns by skidding: tough but wastes energy. <b>Ackermann steering</b> is car-style: front wheels turn. Efficient at speed, but it cannot spin on the spot.</p>
<p><b>Omni wheels</b> have little rollers around the edge, so they can roll sideways. <b>Mecanum wheels</b> have rollers at 45°. With four of them, the robot can slide in any direction, even sideways, without turning. <b>Tracks</b> handle rough ground. <b>Legs</b> climb stairs but are complex.</p>
<p>A robot that can move in any direction at any moment is <b>holonomic</b> (mecanum, omni). One that must turn first, like a car, is <b>non-holonomic</b>.</p>`,
points:["Differential drive: 2 wheels + caster, spins on the spot.","Skid steer: tough, wasteful turning. Ackermann: car-style, no spin in place.","Omni and mecanum wheels: can move sideways.","Holonomic = can move in any direction directly.","Tracks for rough ground, legs for stairs."],
game:{type:"bins",bins:["Holonomic (any direction)","Non-holonomic (must turn first)"],items:[["4 mecanum wheels",0],["3 omni wheels",0],["Differential drive robot",1],["Car with steering wheels",1],["Tank tracks",1],["Ball-balancing robot",0]]},
quiz:[{q:"Which drive can slide sideways without turning?",o:["Mecanum wheels","Car steering","Tank tracks"],why:"The 45° rollers let it move in any direction."},
{q:"How does a differential drive robot turn?",o:["Its two wheels spin at different speeds","It turns its front wheels","It jumps"],why:"Speed difference creates rotation."},
{q:"Can a normal car spin on the spot?",o:["No, it is non-holonomic","Yes, always","Only in reverse"],why:"It must drive forward or back to turn."}]},

{t:"Legs and balance",
story:`<p>Walking robots balance in two ways. <b>Static walking</b> keeps the centre of mass over the feet at every moment. A six-legged <b>hexapod</b> uses a <b>tripod gait</b>: three legs always on the ground, like a stool. It is slow but never falls.</p>
<p><b>Dynamic walking</b> is like you: you actually fall forward a little and catch yourself with each step. Robot dogs and humanoids do this. It is faster and more natural, but needs fast sensors (IMU) and smart control. Engineers use a point called the <b>ZMP</b> (zero moment point) to plan steps that do not tip over. Different leg patterns are <b>gaits</b>: walk, trot, gallop.</p>
<p>A <b>self-balancing robot</b> (like a Segway) is an <b>inverted pendulum</b>: a stick balanced on its end. It reads its tilt with an IMU and drives its wheels under itself, using PID control (World 9), hundreds of times per second.</p>`,
points:["Static walking: CoM always over the feet (hexapod tripod gait).","Dynamic walking: controlled falling and catching (humanoids, robot dogs).","Gaits: walk, trot, gallop.","ZMP helps plan steps that do not tip.","Self-balancing robot = inverted pendulum + IMU + PID."],
game:{type:"bins",bins:["Static balance","Dynamic balance"],items:[["Hexapod with tripod gait",0],["Self-balancing Segway robot",1],["Robot dog trotting",1],["Slow 4-leg crawl lifting one leg at a time",0],["Human running",1],["Three-legged camera tripod",0]]},
quiz:[{q:"A hexapod keeps three legs down at all times. This is…",o:["Static balance","Dynamic balance","No balance"],why:"Like a stool, it is always stable."},
{q:"A self-balancing robot is like…",o:["Balancing a stick on your hand","A table","A parked car"],why:"It is an inverted pendulum."},
{q:"Dynamic walking needs…",o:["Fast sensing and control","No sensors","Square wheels"],why:"It must catch itself in time."}]},

{t:"Materials and building",
story:`<p>Bolt’s first body could be <b>cardboard</b>: free and quick for testing ideas (a <b>prototype</b>). Then pick real materials. <b>Acrylic</b> sheets are laser-cut, cheap, but can crack. <b>Plywood</b> is light and easy to work. <b>Aluminium</b> is strong and light. <b>3D-printed</b> plastic (PLA is easy, PETG is tougher) lets you make any shape. <b>Carbon fibre</b> is very strong and light, used in drones.</p>
<p>Join parts with <b>M3 screws</b> and nuts (the hobby standard), <b>standoffs</b> to lift circuit boards, and zip ties for cables. Design parts first on a computer with <b>CAD</b> software like Fusion 360, Onshape or FreeCAD.</p>
<p>Good design tips: keep weight low, make the battery easy to reach, leave room for wires, and keep the wiring tidy. Build fast, test, and improve.</p>`,
points:["Prototype fast with cardboard or foam board.","Acrylic, plywood, aluminium, 3D-printed PLA/PETG, carbon fibre.","M3 screws and standoffs are the hobby standard.","CAD: Fusion 360, Onshape, FreeCAD.","Easy battery access, tidy wiring, low weight."],
game:{type:"match",pairs:[["Cardboard","Quick, free prototype"],["Acrylic","Laser-cut sheet, can crack"],["Aluminium","Strong and light metal"],["PLA","Easy 3D-printing plastic"],["Carbon fibre","Very strong and light; drone frames"],["CAD","Designing parts on a computer"],["Standoff","Spacer that lifts a circuit board"]]},
quiz:[{q:"What is a prototype?",o:["A quick early version to test ideas","The final product","A type of screw"],why:"Build rough first, then improve."},
{q:"Which material is popular for drone frames?",o:["Carbon fibre","Glass","Clay"],why:"Very stiff and light."},
{q:"CAD software is used to…",o:["Design parts on a computer","Charge batteries","Measure current"],why:"Computer-aided design."}]},

{t:"Grippers and end effectors",
story:`<p>The <b>end effector</b> is the tool at the end of the arm. The best tool depends on the object. A <b>two-finger parallel gripper</b> is the common choice for boxes and blocks. <b>Three-finger</b> grippers hold round things. <b>Suction cups</b> pick up flat, smooth things like glass or cardboard boxes. <b>Magnetic</b> grippers only work on iron and steel. <b>Soft grippers</b> made of rubber, often filled with air, can gently pick fruit and eggs.</p>
<p>Other tools: welding torches, paint sprayers, drills, screwdrivers. Many factory arms can swap tools automatically.</p>
<p>To not drop an object, the friction from the fingers must beat its weight. With two fingers: <span class="f">2 × μ × grip force ≥ weight</span>. <b>Tactile sensors</b> in the fingers feel how hard they squeeze, so the robot does not crush things.</p>`,
points:["End effector = the tool at the end of the arm.","Parallel, three-finger, suction, magnetic, soft grippers.","Pick the gripper for the object’s shape, material and fragility.","Two fingers: 2 × μ × F ≥ weight to avoid slipping.","Tactile sensors prevent crushing."],
game:{type:"bins",bins:["Suction cup","Magnetic","Soft gripper","Two-finger gripper"],items:[["A sheet of glass",0],["A steel plate",1],["A ripe tomato",2],["A wooden block",3],["A cardboard box (flat top)",0],["A steel bolt",1],["An egg",2],["A pen",3]]},
quiz:[{q:"Which gripper only works on iron and steel?",o:["Magnetic","Suction","Soft"],why:"Magnets attract ferrous metals."},
{q:"Best gripper for picking ripe fruit?",o:["Soft gripper","Magnetic gripper","Welding torch"],why:"Soft fingers do not bruise it."},
{q:"An object weighs 5 N, μ = 0.5, two fingers. Each finger must squeeze at least…",o:["5 N","2.5 N","10 N"],why:"2 × 0.5 × F ≥ 5 → F ≥ 5 N."}]}
]});
