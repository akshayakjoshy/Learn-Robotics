<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero to Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Workshop graph paper + industrial-robot yellow. Layout: a world map of stations, then one reading column per lesson. */
  --paper:#ECEAE2; --panel:#FAF9F5; --ink:#1B1F23; --muted:#575D63; --line:#D2CEC2;
  --robot:#F2B200; --accent-text:#7A5800; --ok:#2B7A4B; --bad:#B53A25;
  --grid:rgba(27,31,35,.055); --code-bg:#1B1F23; --code-ink:#E9E6DD; --tint:rgba(242,178,0,.16);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --panel:#1D2125; --ink:#ECE8DE; --muted:#A3A9AF; --line:#353B41;
    --robot:#F5BD1F; --accent-text:#F5BD1F; --ok:#5DBE88; --bad:#EF7B64;
    --grid:rgba(236,232,222,.045); --code-bg:#0D1012; --code-ink:#E9E6DD; --tint:rgba(245,189,31,.13);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --panel:#1D2125; --ink:#ECE8DE; --muted:#A3A9AF; --line:#353B41;
  --robot:#F5BD1F; --accent-text:#F5BD1F; --ok:#5DBE88; --bad:#EF7B64;
  --grid:rgba(236,232,222,.045); --code-bg:#0D1012; --code-ink:#E9E6DD; --tint:rgba(245,189,31,.13);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent-text)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--robot);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--mono)}
.small{font-size:.82rem}
.muted{color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;border-radius:4px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.92rem}
.nav button:hover{border-color:var(--line)}
.nav button[aria-current="page"]{border-color:var(--ink)}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:.88rem;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat span{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums}
.rank{background:var(--robot);color:#1B1F23;border:2px solid var(--ink);border-radius:3px;padding:2px 8px;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.xpbar{width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--ink)}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--robot) 0 10px,#1B1F23 10px 20px)}

main{max-width:1160px;margin:0 auto;padding:28px 20px 90px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--robot);color:#1B1F23;border:2px solid var(--ink);border-radius:4px;padding:9px 16px;
  font-family:var(--display);font-weight:800;font-size:1.12rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.sm{font-size:.95rem;padding:5px 11px;box-shadow:2px 2px 0 var(--ink)}
.btn.go{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;margin-bottom:46px}
.eyebrow{font-family:var(--mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);font-weight:600;margin-bottom:12px}
.hero h1{font-size:clamp(3rem,7vw,5.6rem);font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:.005em}
.hero h1 em{font-style:normal;background:var(--robot);color:#1B1F23;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lede{font-size:1.15rem;max-width:34em;margin:18px 0 22px}
.hero .row{flex-wrap:wrap}
.hero-arm{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.hero-arm canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.hero-arm figcaption{font-size:.85rem;color:var(--muted);padding:8px 4px 2px}
.hero-arm figcaption b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* map */
.map-head{display:flex;align-items:end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.map-head h2{font-size:2.4rem;text-transform:uppercase}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.tier{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;display:flex;gap:10px;align-items:center}
.tier::after{content:"";flex:1;height:1px;background:var(--line)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wcard{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s;min-height:210px}
.wcard:hover{transform:translateY(-2px);border-color:var(--ink)}
.wnum{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:.85;color:var(--ink)}
.wcard.beaten .wnum{color:var(--accent-text)}
.wcard h3{font-size:1.55rem;text-transform:uppercase}
.wcard p{font-size:.9rem;color:var(--muted);line-height:1.4}
.wcard .lvl{position:absolute;top:14px;right:14px}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted);background:var(--panel)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--robot);border-right:2px solid var(--ink)}
.bar i[style="width:0%"]{border:0}
.wfoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wstatus{font-size:.82rem;font-weight:700}
.wcard.locked{background:transparent;border-style:dashed}
.wcard.locked .wnum,.wcard.locked h3{color:var(--muted)}
.wcard.beaten{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* world page */
.crumbs{font-family:var(--mono);font-size:.8rem;margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--ink);font:inherit}
.whead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;margin-bottom:24px}
.whead .wnum{font-size:7rem}
.whead h1{font-size:clamp(2.4rem,5vw,3.6rem);text-transform:uppercase}
.whead p{max-width:44em;margin-top:8px}
.llist{display:flex;flex-direction:column;gap:8px;max-width:860px}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;cursor:pointer}
.lrow:hover{border-color:var(--ink)}
.lrow .idx{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--muted)}
.lrow .lt{font-weight:700;font-size:1.06rem;line-height:1.3}
.lrow .lg{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.stars{font-size:1.05rem;letter-spacing:2px;white-space:nowrap;color:var(--line)}
.stars b{color:var(--accent-text);font-weight:400}
.lrow.done .idx{color:var(--ok)}
.lrow.boss{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lrow.boss .idx,.lrow.boss .lg{color:var(--robot)}
.lrow.boss[aria-disabled="true"]{background:transparent;color:var(--muted);border-style:dashed;border-color:var(--line)}
.lrow.boss[aria-disabled="true"] .idx{color:var(--muted)}

/* lesson */
.lesson{max-width:800px}
.lesson h1{font-size:clamp(2.3rem,5vw,3.5rem);text-transform:uppercase;margin:4px 0 6px}
.lmeta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;align-items:center}
.sec{margin:30px 0}
.sec-h{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.story{display:grid;grid-template-columns:62px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.story .txt{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.story b{font-weight:700}
.f{font-family:var(--mono);font-size:.92em;background:var(--tint);padding:1px 6px;border-radius:3px;white-space:nowrap}
.fbig{display:block;font-family:var(--mono);font-size:1.02rem;background:var(--tint);border-left:4px solid var(--robot);padding:8px 12px;border-radius:0 4px 4px 0;overflow-x:auto;white-space:pre-wrap}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:66ch}
.points li{position:relative;padding-left:26px}
.points li::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;background:var(--robot);border:2px solid var(--ink);transform:rotate(45deg)}
.code{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:6px;overflow:hidden}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.6;tab-size:2}
.code .lang{position:absolute;top:8px;right:10px;display:flex;gap:8px;align-items:center}
.code .lang span{font-family:var(--mono);font-size:.68rem;color:#9AA0A6;text-transform:uppercase}
.code .copy{background:transparent;border:1px solid #4A5056;color:#E9E6DD;border-radius:3px;font-size:.72rem;padding:2px 8px;cursor:pointer;font-family:var(--mono)}
.code .c{color:#8C949C;font-style:italic}.code .s{color:#B8D88B}.code .k{color:#F5BD1F}.code .n{color:#7FC8E8}.code .p{color:#E39BD6}
.code-note{font-size:.9rem;color:var(--muted);margin-top:8px;max-width:66ch}

/* game panel */
.game{border:2px solid var(--ink);border-radius:6px;background:var(--panel);overflow:hidden}
.game-h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 14px}
.game-h h3{font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em}
.game-h .chip{background:var(--robot);color:#1B1F23;border-color:var(--robot);font-weight:600}
.game-h .chip.won{background:var(--ok);border-color:var(--ok);color:#fff}
.game-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.g-intro{font-size:.98rem;max-width:66ch}
.g-status{font-weight:700;font-size:.95rem;min-height:1.5em;border-left:4px solid var(--line);padding-left:10px}
.g-status[data-kind="ok"]{border-color:var(--ok);color:var(--ok)}
.g-status[data-kind="bad"]{border-color:var(--bad);color:var(--bad)}
.gcanvas{width:100%;height:auto;display:block;touch-action:none;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.ctrl{display:grid;grid-template-columns:minmax(120px,auto) 1fr minmax(64px,auto);gap:6px 12px;align-items:center;font-size:.92rem}
.ctrl label{font-weight:700}
.ctrl output{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--ink)}
.readout{display:flex;gap:10px;flex-wrap:wrap}
.readout div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:.8rem;color:var(--muted);line-height:1.2}
.readout b{display:block;font-family:var(--mono);font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.tasks li{padding-left:28px;position:relative}
.tasks li::before{content:"";position:absolute;left:2px;top:.2em;width:16px;height:16px;border:2px solid var(--ink);border-radius:3px;background:var(--panel)}
.tasks li.ok::before{background:var(--ok);border-color:var(--ok)}
.tasks li.ok::after{content:"";position:absolute;left:8px;top:.32em;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tasks li.ok{color:var(--muted);text-decoration:line-through}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--ink);background:var(--panel);border-radius:4px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.sw button{width:32px;height:32px;padding:0;border:2px solid var(--ink)}
.seg.sw button[aria-pressed="true"]{outline:3px solid var(--robot);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* generic games */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem,.chipbtn{text-align:left;background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:8px 12px;cursor:pointer;font-size:.93rem;line-height:1.35}
.mitem.sel,.chipbtn.sel{background:var(--robot);color:#1B1F23}
.mitem.done{background:var(--tint);border-color:var(--ok);color:var(--muted);cursor:default}
.mitem.done::before{content:"✓ ";color:var(--ok);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px solid var(--ink);border-radius:6px;min-height:110px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column}
.bin-h{background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.05rem;padding:4px 10px;letter-spacing:.03em}
.bin-body{display:flex;flex-direction:column;gap:6px;padding:8px}
.bin-body .chipbtn{cursor:default;background:var(--tint);border-color:var(--ok);font-size:.85rem}
.ord{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:4px;min-height:48px;counter-reset:o}
.ord li{counter-increment:o;display:flex;gap:10px;align-items:stretch}
.ord li::before{content:counter(o);font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:22px;padding-top:9px;text-align:right}
.ord .chipbtn{flex:1}
.codechip{font-family:var(--mono);font-size:.84rem;white-space:pre}
.chipbtn.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.calc{display:flex;flex-direction:column;gap:14px}
.calc-row{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--paper)}
.calc-row label{display:block;font-weight:700;margin-bottom:8px;line-height:1.4}
.calc-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc-in input{font-family:var(--mono);font-size:1rem;width:150px;padding:6px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink)}
.calc-in .unit{font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.calc-fb{font-size:.9rem;margin-top:6px;min-height:1.2em}
.calc-fb[data-kind="ok"]{color:var(--ok)}.calc-fb[data-kind="bad"]{color:var(--bad)}
.calc-row.solved{border-color:var(--ok)}

/* maze */
.maze-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.maze-grid{display:grid;gap:3px;background:var(--line);padding:3px;border-radius:4px}
.maze-grid div{aspect-ratio:1;background:var(--paper);display:grid;place-items:center;border-radius:2px}
.maze-grid div.w{background:var(--ink)}
.maze-grid svg{width:78%;height:78%;transition:transform .2s}
.maze-side{display:flex;flex-direction:column;gap:10px}
.prog{display:flex;flex-wrap:wrap;gap:4px;min-height:40px;padding:6px;border:1px dashed var(--line);border-radius:4px;align-content:flex-start}
.prog span{font-family:var(--mono);font-size:.8rem;border:1px solid var(--ink);border-radius:3px;padding:2px 6px;background:var(--panel)}
.prog span.now{background:var(--robot);color:#1B1F23}

/* truth table */
.tt{border-collapse:collapse;font-family:var(--mono);font-size:.95rem}
.tt th,.tt td{border:1px solid var(--line);padding:4px 14px;text-align:center}
.tt th{background:var(--paper)}
.tt button{font-family:var(--mono);font-weight:700;min-width:40px;border:2px solid var(--ink);border-radius:4px;background:var(--panel);cursor:pointer;padding:2px 8px}
.tt button.wrong{border-color:var(--bad);color:var(--bad)}
.lamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:inline-block;vertical-align:middle}
.lamp.on{background:var(--robot);box-shadow:0 0 14px var(--robot)}
.tog{border:2px solid var(--ink);border-radius:4px;padding:4px 12px;background:var(--panel);cursor:pointer;font-family:var(--mono);font-weight:700}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* quiz */
.q{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.q-text{font-weight:700;margin-bottom:10px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:.97rem;line-height:1.4}
.opt:hover:not(:disabled){background:var(--tint)}
.opt:disabled{cursor:default}
.opt.right{border:2px solid var(--ok);background:var(--tint)}
.opt.right::before{content:"✓ ";color:var(--ok);font-weight:700}
.opt.wrong{border:2px solid var(--bad);text-decoration:line-through;color:var(--muted)}
.why{margin-top:10px;font-size:.93rem;border-left:4px solid var(--ok);padding-left:10px}
.why.bad{border-color:var(--bad)}
.finish{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:18px;margin-top:28px}
.finish .stars{font-size:1.6rem}
.nextnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* boss */
.boss-card{max-width:760px}
.boss-top{display:flex;gap:12px;align-items:center;margin:8px 0 18px;flex-wrap:wrap}

<script>
/* ===== Pure simulations (tested in Node) ===== */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* PID: a cart on a slope must move to position 1.0 */
function simPID(kp,ki,kd){
  const dt=0.005,T=8,m=1,b=1,d=-3,umax=25,target=1;
  let x=0,v=0,I=0,ePrev=target;
  const xs=[];const N=Math.round(T/dt);
  for(let k=0;k<=N;k++){
    if(k%10===0)xs.push(x);
    const e=target-x;
    I+=e*dt; I=Math.max(-10,Math.min(10,I));
    const D=(e-ePrev)/dt; ePrev=e;
    let u=kp*e+ki*I+kd*D; u=Math.max(-umax,Math.min(umax,u));
    const a=(u-b*v+d)/m; v+=a*dt; x+=v*dt;
  }
  const tS=0.05;let max=-1e9;xs.forEach(y=>{if(y>max)max=y;});
  const over=Math.max(0,(max-1)*100);
  let last=-1;xs.forEach((y,i)=>{if(Math.abs(y-1)>0.05)last=i;});
  const settle=last>=xs.length-1?Infinity:(last+1)*tS;
  const sse=Math.abs(xs[xs.length-1]-1);
  return {xs,tS,T,over,settle,sse,win:over<=10&&settle<=3&&sse<=0.02};
}

/* Line follower track + simulation */
function trackPts(){const N=480,p=[];for(let i=0;i<N;i++){const t=i/N*2*Math.PI;p.push([300+230*Math.cos(t),180+105*Math.sin(t)+38*Math.sin(2*t)]);}return p;}
function LineSim(kp,kd){
  const P=trackPts(),N=P.length;
  const s={P,N,kp,kd,x:P[0][0],y:P[0][1],th:Math.atan2(P[1][1]-P[0][1],P[1][0]-P[0][0]),v:110,w:0,ePrev:0,idx:0,prog:0,t:0,dist:0,e:0,crashed:false,lap:false,trail:[],wob:0};
  s.step=function(dt){
    if(s.crashed||s.lap)return;
    let best=1e18,bi=s.idx,bs=0;
    for(let k=-15;k<=40;k++){const i=(s.idx+k+N)%N,a=P[i],b=P[(i+1)%N];const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;let u=((s.x-a[0])*dx+(s.y-a[1])*dy)/L2;u=Math.max(0,Math.min(1,u));const px=a[0]+u*dx,py=a[1]+u*dy;const d2=(s.x-px)**2+(s.y-py)**2;if(d2<best){best=d2;bi=i;bs=(dx*(s.y-a[1])-dy*(s.x-a[0]))/Math.sqrt(L2);}}
    let dI=bi-s.idx;if(dI>N/2)dI-=N;if(dI<-N/2)dI+=N;s.prog+=dI;s.idx=bi;
    s.dist=bs;
    const e=Math.max(-1,Math.min(1,bs/18));s.e=e;
    const de=(e-s.ePrev)/dt;s.ePrev=e;
    const wCmd=-(s.kp*e+s.kd*de);
    s.w+=(wCmd-s.w)*Math.min(1,dt/0.12);
    s.th+=s.w*dt;s.x+=s.v*Math.cos(s.th)*dt;s.y+=s.v*Math.sin(s.th)*dt;s.t+=dt;
    s.wob+=Math.abs(bs)*dt;
    if(Math.abs(bs)>45)s.crashed=true;
    if(s.prog>=N)s.lap=true;
    if(s.t>40)s.crashed=true;
  };
  return s;
}

/* Moving-average filter on a noisy step signal */
function filterRun(Nw){
  const r=rng(7),n=120,truth=[],raw=[],filt=[];
  for(let i=0;i<n;i++){const t=i<50?2:6;truth.push(t);raw.push(t+gauss(r)*0.8);}
  for(let i=0;i<n;i++){let s=0,c=0;for(let k=Math.max(0,i-Nw+1);k<=i;k++){s+=raw[k];c++;}filt.push(s/c);}
  const sd=(a,b,from,to)=>{let s=0,c=0;for(let i=from;i<=to;i++){s+=(a[i]-b[i])**2;c++;}return Math.sqrt(s/c);};
  const rawNoise=sd(raw,truth,30,49)*0.5+sd(raw,truth,90,119)*0.5;
  const fNoise=sd(filt,truth,30,49)*0.5+sd(filt,truth,90,119)*0.5;
  let lag=999;for(let i=50;i<n;i++){if(filt[i]>=5.6){lag=i-50;break;}}
  const ratio=fNoise/rawNoise;
  return {truth,raw,filt,ratio,lag,win:ratio<=0.36&&lag<=12};
}

/* 1D Kalman filter: robot moving back and forth, noisy position sensor */
function kalmanRun(Rg,Qg){
  const r=rng(11),n=80;let x=0,xh=0,P=10;const truth=[],meas=[],est=[];let K=0;
  for(let k=0;k<n;k++){
    const u=1.5*Math.cos(k/8);
    x+=u*1.3+gauss(r)*0.6;
    const z=x+gauss(r)*3;
    xh+=u;P+=Qg;
    K=P/(P+Rg);xh+=K*(z-xh);P=(1-K)*P;
    truth.push(x);meas.push(z);est.push(xh);
  }
  const rm=(a)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-truth[i])**2,0)/n);
  const rawE=rm(meas),estE=rm(est);
  return {truth,meas,est,rawE,estE,K,win:estE<=0.6*rawE};
}

/* Computer vision scene: find the blue ball */
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return [h,mx?d/mx*100:0,mx*100];}
function hsv2rgb(h,s,v){s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return [(r+m)*255,(g+m)*255,(b+m)*255];}
function visionScene(){
  const w=160,h=100,r=rng(5),px=new Uint8ClampedArray(w*h*3),gt=new Uint8Array(w*h),hsv=new Float32Array(w*h*3);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let H=85,S=14,V=60+y*0.25;
    if(y<38){H=40;S=8;V=82;}
    if(x>18&&x<52&&y>40&&y<78){H=28;S=80;V=88-(x-18)*0.3;}
    if(x>62&&x<74&&y>22&&y<80){H=140;S=60;V=55;}
    if(x>64&&x<72&&y>16&&y<23){H=140;S=30;V=80;}
    if(x>12&&x<150&&y>86&&y<92){H=205;S=18;V=50;}
    const dx=x-115,dy=y-58;
    if(dx*dx+dy*dy<=17*17){H=215;S=72;V=Math.max(30,95-Math.hypot(x-109,y-52)*2.6);gt[y*w+x]=1;}
    H=(H+gauss(r)*4+360)%360;S=Math.max(0,Math.min(100,S+gauss(r)*4));V=Math.max(0,Math.min(100,V+gauss(r)*3));
    const c=hsv2rgb(H,S,V),i=(y*w+x)*3;px[i]=c[0];px[i+1]=c[1];px[i+2]=c[2];
    const back=rgb2hsv(px[i],px[i+1],px[i+2]);hsv[i]=back[0];hsv[i+1]=back[1];hsv[i+2]=back[2];
  }
  return {w,h,px,gt,hsv};
}
function visionMask(sc,hmin,hmax,smin,vmin){
  const n=sc.w*sc.h,m=new Uint8Array(n);let inter=0,uni=0,sx=0,sy=0,c=0;
  for(let i=0;i<n;i++){const H=sc.hsv[i*3],S=sc.hsv[i*3+1],V=sc.hsv[i*3+2];
    const hOk=hmin<=hmax?(H>=hmin&&H<=hmax):(H>=hmin||H<=hmax);
    const on=hOk&&S>=smin&&V>=vmin?1:0;m[i]=on;
    if(on&&sc.gt[i])inter++;if(on||sc.gt[i])uni++;
    if(on){sx+=i%sc.w;sy+=Math.floor(i/sc.w);c++;}}
  const iou=uni?inter/uni:0;
  return {m,iou,cx:c?sx/c:-1,cy:c?sy/c:-1,count:c,win:iou>=0.75};
}

/* Grid path planning */
function planGrid(W,H,cells,start,goal,algo){
  const idx=(x,y)=>y*W+x,cost=i=>cells[i]===2?5:1;
  const g=new Array(W*H).fill(Infinity),prev=new Array(W*H).fill(-1),closed=new Uint8Array(W*H),order=[];
  const s=idx(start[0],start[1]),t=idx(goal[0],goal[1]);
  const h=i=>Math.abs(i%W-goal[0])+Math.abs(Math.floor(i/W)-goal[1]);
  g[s]=0;let open=[s];const inOpen=new Uint8Array(W*H);inOpen[s]=1;
  while(open.length){
    let bi=0;
    if(algo==='bfs'){bi=0;}else{let bv=Infinity;for(let k=0;k<open.length;k++){const i=open[k];const f=algo==='astar'?g[i]+h(i):algo==='greedy'?h(i):g[i];if(f<bv-1e-9||(Math.abs(f-bv)<1e-9&&h(i)<h(open[bi]))){bv=f;bi=k;}}}
    const cur=open.splice(bi,1)[0];inOpen[cur]=0;
    if(closed[cur])continue;closed[cur]=1;order.push(cur);
    if(cur===t)break;
    const cx=cur%W,cy=Math.floor(cur/W);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;const ni=idx(nx,ny);if(cells[ni]===1||closed[ni])return;
      const step=algo==='bfs'?1:cost(ni);const ng=g[cur]+step;
      if(algo==='bfs'){if(g[ni]===Infinity){g[ni]=ng;prev[ni]=cur;open.push(ni);inOpen[ni]=1;}}
      else if(ng<g[ni]){g[ni]=ng;prev[ni]=cur;if(!inOpen[ni]){open.push(ni);inOpen[ni]=1;}}});
  }
  const path=[];if(closed[t]){let c=t;while(c!==-1){path.unshift(c);c=prev[c];}}
  let pc=0;path.slice(1).forEach(i=>pc+=cost(i));
  return {order,path,pathCost:pc};
}

if(false)module.exports={simPID,LineSim,trackPts,filterRun,kalmanRun,visionScene,visionMask,planGrid};

/* ===== Content: Worlds 1–4 ===== */
const WORLDS=[];const FORMULAS=[];
const W=o=>WORLDS.push(o);

/* ---------------- WORLD 1 ---------------- */
W({title:"Meet the Robot",tag:"What robots are, their parts, and how to think like an engineer.",badge:"Robot Rookie",level:"Beginner",
desc:"Start here. You will meet Bolt, learn what makes a machine a robot, see the main kinds of robots, and write your first robot program.",
lessons:[
{t:"What is a robot?",
story:`<p>Meet <b>Bolt</b>, a small robot who will learn with you. Bolt has a secret. Every robot in the world, from a robot vacuum to a Mars rover, does the same three things again and again.</p>
<p><b>1. Sense:</b> look at the world (like your eyes and ears). <b>2. Think:</b> decide what to do (like your brain). <b>3. Act:</b> do something (like your muscles). Then it starts again. This is the <b>Sense → Think → Act loop</b>.</p>
<p>A robot vacuum senses a wall, thinks “turn”, and acts by turning its wheels. A normal toaster cannot sense or decide. It just heats for a set time. So a toaster is a machine, but not really a robot.</p>`,
points:["A robot is a machine that can <b>sense</b>, <b>think</b> (decide) and <b>act</b> by itself.","The Sense → Think → Act loop repeats many times every second.","If a machine cannot sense or decide, it is just a machine.","The word “robot” comes from the Czech word <i>robota</i>, meaning hard work. It was first used in a 1920 play by Karel Čapek."],
game:{type:"bins",bins:["Sense","Think","Act"],items:[["Camera",0],["Ultrasonic distance sensor",0],["Microphone",0],["Arduino board (the brain)",1],["Program that decides “turn left”",1],["Wheel motor",2],["Gripper closing",2],["Speaker beeping",2,"A speaker does something to the world."]]},
quiz:[{q:"Which is the robot loop?",o:["Sense → Think → Act","Act → Sleep → Eat","Think → Stop → Think"],why:"Robots sense the world, decide, then act, again and again."},
{q:"A robot vacuum detects a wall. Detecting the wall is which step?",o:["Sense","Think","Act"],why:"Detecting is sensing. Deciding to turn is thinking. Turning the wheels is acting."},
{q:"Why is a simple toaster not really a robot?",o:["It cannot sense and decide by itself","It is too small","It uses electricity"],why:"Robots need sensing and decision making, not just electricity."}]},

{t:"Kinds of robots",
story:`<p>Bolt visits a robot zoo. In the first room, big <b>industrial arms</b> weld and paint cars in a factory. Next to them is a friendly <b>cobot</b> (collaborative robot) that works safely right beside people.</p>
<p>Outside, <b>mobile robots</b> roll on wheels: delivery robots and robot vacuums. <b>Legged robots</b> walk like dogs or humans. <b>Drones</b> fly with spinning propellers. <b>Underwater robots</b> (ROVs) swim, and <b>space rovers</b> explore Mars.</p>
<p>Robots also differ in who is in charge. A <b>remote-controlled</b> robot is driven by a person. An <b>autonomous</b> robot decides for itself. A <b>semi-autonomous</b> robot gets a goal from a person and handles the details.</p>`,
points:["By job: industrial, service (cleaning, delivery), medical, space, underwater, military, toy and education robots.","By body: fixed arms, wheeled, tracked, legged, flying, swimming, humanoid.","By control: remote-controlled, semi-autonomous, fully autonomous.","A cobot has force sensors and speed limits so it can work next to people."],
game:{type:"match",pairs:[["Industrial arm","Welds and paints cars in a factory"],["Drone","Flies using spinning propellers"],["Mars rover","Explores another planet slowly and carefully"],["Cobot","Works safely right next to people"],["Humanoid","Has a body shaped like a human"],["ROV","Swims underwater, often tied to a cable"]]},
quiz:[{q:"A robot that decides everything by itself is called…",o:["Autonomous","Remote-controlled","Manual"],why:"Autonomous means it makes its own decisions."},
{q:"What makes a cobot special?",o:["It can safely work next to people","It can fly","It has no motors"],why:"Cobots use sensors and limits on speed and force to stay safe around humans."},
{q:"An RC car driven with a remote is…",o:["Remote-controlled, not autonomous","Fully autonomous","A cobot"],why:"A person makes all the decisions, so it is remote-controlled."}]},

{t:"Parts of a robot",
story:`<p>Let’s build Bolt’s body, part by part. It is a lot like your own body.</p>
<p>The <b>frame</b> (or chassis) is the skeleton that holds everything. The <b>controller</b> is the brain, usually a microcontroller or small computer. <b>Sensors</b> are the senses. <b>Actuators</b> (mostly motors) are the muscles. The <b>power supply</b> (battery) is the food and energy. The <b>end effector</b> is the hand or tool. <b>Wires</b> are the nerves that carry signals. And the <b>software</b> (the program) is the thoughts.</p>
<p>Take away any one part and Bolt cannot do its job. Engineers design all parts to work together.</p>`,
points:["Frame or chassis: holds everything together.","Controller: the brain that runs the program.","Sensors: measure the world. Actuators: move things.","Power: batteries or a power supply. End effector: gripper or tool.","Software: the instructions that turn sensing into action."],
game:{type:"match",intro:"Match each human body part with the robot part that does the same job.",pairs:[["Brain","Microcontroller (controller)"],["Eyes","Camera or distance sensor"],["Muscles","Motors (actuators)"],["Skeleton","Frame / chassis"],["Food and energy","Battery"],["Hand","Gripper (end effector)"],["Nerves","Wires"]]},
quiz:[{q:"Which part is the robot’s “muscle”?",o:["Actuator (motor)","Sensor","Chassis"],why:"Actuators create movement, like muscles."},
{q:"The gripper or tool at the end of a robot arm is called the…",o:["End effector","Base","Encoder"],why:"End effector means the part at the end that does the work."},
{q:"Where does the robot’s program run?",o:["On the controller","On the battery","On the wheels"],why:"The controller (brain) runs the software."}]},

{t:"Think like an engineer: algorithms",
story:`<p>Bolt is very literal. If you say “make tea”, Bolt is lost. You must say: fill the kettle, switch it on, wait, pour the water, add the tea bag. A list of clear steps in the right order is called an <b>algorithm</b>.</p>
<p>If one step is wrong, the robot does the wrong thing. That mistake is called a <b>bug</b>. Finding and fixing it is called <b>debugging</b>. Every engineer writes bugs. Good engineers test and fix them.</p>
<p>Engineers also follow a loop when building: <b>Ask</b> (what is the problem?), <b>Imagine</b> ideas, <b>Plan</b>, <b>Build</b>, <b>Test</b>, <b>Improve</b>, and repeat. This is the <b>engineering design process</b>.</p>`,
points:["An algorithm is an exact list of steps, in order.","Robots do exactly what you say, not what you mean.","A bug is a mistake in the steps. Debugging is fixing it.","Design process: Ask → Imagine → Plan → Build → Test → Improve → repeat.","Break big problems into small steps (this is called decomposition)."],
game:{type:"maze",levels:[["S...#","###.#","G...#"],["S.#...","..#.#.","....#.",".##...","...#.G"],["S..#...",".#.#.#.",".#...#.",".####..","......#","#.###.G"]]},
quiz:[{q:"An algorithm is…",o:["A clear list of steps in the right order","A type of motor","A robot’s battery"],why:"Algorithms are step-by-step instructions."},
{q:"Your robot turns right when it should turn left. This mistake is a…",o:["Bug","Sensor","Gear"],why:"A mistake in the program is called a bug."},
{q:"In the design process, what comes right after Build?",o:["Test","Ask","Sell"],why:"After building you test it, then improve it."}]},

{t:"Your toolbox and lab safety",
story:`<p>Before building, Bolt packs a toolbox. A <b>multimeter</b> measures volts, amps and ohms. A <b>breadboard</b> lets you build circuits without solder. <b>Jumper wires</b> connect things. A <b>soldering iron</b> melts solder (about 350 °C!) to join metal for good. You will also use a wire stripper, small screwdrivers, pliers, hot glue and a computer with the Arduino IDE.</p>
<p>Now the safety rules. Never touch the soldering tip. Solder in fresh air and wear safety glasses. Switch off power before changing wires. Never short a battery (connect + to − directly). LiPo batteries can catch fire if damaged. Keep fingers and hair away from propellers and gears. Never play with wall sockets (230 V in India). Robots use low, safer voltages.</p>`,
points:["Multimeter, breadboard, jumper wires and a soldering iron are the core tools.","Power off before you change wiring.","Never connect battery + and − directly. That is a short circuit.","Test new wheeled robots with the wheels lifted off the table.","Give every robot an easy OFF switch (an emergency stop)."],
game:{type:"bins",bins:["Safe","Unsafe"],items:[["Wear safety glasses while soldering",0],["Touch the soldering tip to check if it is hot",1],["Unplug the battery before changing wires",0],["Connect battery + and − with a bare wire",1,"That is a short circuit. Huge current, heat and fire."],["Test a new robot with its wheels off the table",0],["Open a wall socket to take power",1],["Keep fingers away from spinning propellers",0],["Keep charging a puffed-up LiPo battery",1,"A swollen LiPo is damaged and can catch fire."]]},
quiz:[{q:"What should you do before changing wires in a circuit?",o:["Switch off and unplug the power","Shake the board","Add more batteries"],why:"Working on a live circuit can damage parts or hurt you."},
{q:"Why should a robot have an easy OFF switch?",o:["To stop it quickly if something goes wrong","To make it faster","To save paint"],why:"An emergency stop is a key safety feature."},
{q:"About how hot is a soldering iron tip?",o:["Around 350 °C","Around 40 °C","Around 0 °C"],why:"Hot enough to melt metal solder, and to burn skin badly."}]}
]});

/* ---------------- WORLD 2 ---------------- */
W({title:"Electricity",tag:"Voltage, current, resistance, Ohm’s law, power and circuits.",badge:"Spark Tamer",level:"Beginner",
desc:"Electricity is the food of every robot. Learn what volts, amps and ohms really mean, using water pipes as a picture, and practise the most important formula in electronics.",
lessons:[
{t:"Voltage, current and circuits",
story:`<p>Electricity is a flow of tiny particles called <b>electrons</b>. Picture water in pipes.</p>
<p><b>Voltage</b> is the <i>push</i>, like the height of a water tank. More height, more push. It is measured in <b>volts (V)</b>. <b>Current</b> is <i>how much flows</i> each second, like litres per second. It is measured in <b>amperes (A)</b>. 1 A = 1000 milliamps (mA).</p>
<p>Water only flows if the pipe makes a full loop. Electricity is the same. A full loop is a <b>closed circuit</b>, so current flows. A broken loop is an <b>open circuit</b>, so nothing flows. A switch simply opens and closes the loop.</p>`,
points:["Voltage (V) = push. Current (A) = flow. Resistance (Ω) = how much something blocks the flow.","Current needs a complete loop: a closed circuit.","An open circuit (broken loop) has no current.","We draw current flowing from + to − (conventional current). Electrons actually move from − to +.","Charge is measured in coulombs. 1 A means 1 coulomb flowing every second."],
game:{type:"match",pairs:[["Voltage","The push (volts, V)"],["Current","The flow (amperes, A)"],["Resistance","How much the flow is blocked (ohms, Ω)"],["Closed circuit","A complete loop, so current flows"],["Open circuit","A broken loop, so no current"],["1 A","1000 mA"]]},
quiz:[{q:"In the water picture, voltage is like…",o:["The height (push) of the water tank","The colour of the pipe","The amount of rust"],why:"Voltage is the push that makes current flow."},
{q:"Current is measured in…",o:["Amperes (A)","Volts (V)","Ohms (Ω)"],why:"Amps measure flow. Volts measure push. Ohms measure resistance."},
{q:"A switch is OFF. The circuit is…",o:["Open, no current flows","Closed, current flows","Shorted"],why:"OFF means the loop is broken."}]},

{t:"Resistance and Ohm’s law",
story:`<p>A thin pipe lets less water through than a fat pipe. In electronics a <b>resistor</b> is the thin pipe. It limits current. Resistance is measured in <b>ohms (Ω)</b>.</p>
<p>Push, flow and blocking are linked by one famous rule, <b>Ohm’s law</b>: <span class="f">V = I × R</span>. Here V is voltage, I is current and R is resistance. Cover the one you want: <span class="f">I = V ÷ R</span>, <span class="f">R = V ÷ I</span>.</p>
<p>Example: an LED needs a resistor. With a 5 V battery, a red LED uses about 2 V, so 3 V is left for the resistor. For 15 mA: <span class="f">R = 3 ÷ 0.015 = 200 Ω</span>. Pick the nearest real value: 220 Ω.</p>`,
points:["Ohm’s law: V = I × R (volts = amps × ohms).","More resistance → less current, if the voltage stays the same.","LED resistor: R = (V_supply − V_LED) ÷ I_LED.","Always change mA to A first: 20 mA = 0.02 A.","Resistors come in standard values like 100, 220, 330, 470, 1k, 10k Ω."],
game:{type:"ohm"},
quiz:[{q:"Ohm’s law is…",o:["V = I × R","V = I + R","V = R ÷ I"],why:"Voltage equals current times resistance."},
{q:"12 V across 6 Ω. What is the current?",o:["2 A","72 A","0.5 A"],why:"I = V ÷ R = 12 ÷ 6 = 2 A."},
{q:"Why does an LED need a resistor?",o:["To limit the current so the LED does not burn","To make it blink","To change its colour"],why:"Without a resistor, too much current flows and the LED dies."}]},

{t:"Power and energy",
story:`<p><b>Power</b> is how fast energy is used. It is measured in <b>watts (W)</b>: <span class="f">P = V × I</span>. A motor on 6 V drawing 0.5 A uses 6 × 0.5 = 3 W.</p>
<p>Resistors turn power into <b>heat</b>: <span class="f">P = I² × R</span>. Small resistors can only handle about ¼ W. Too much power and they get hot and burn. That is why big motors need big, chunky parts.</p>
<p><b>Energy</b> is power used over time: <span class="f">E = P × t</span>. Batteries are rated in <b>watt-hours (Wh)</b>. A 3.7 V, 2 Ah battery holds 3.7 × 2 = 7.4 Wh. That could run a 7.4 W robot for about 1 hour.</p>`,
points:["Power: P = V × I, in watts.","Heat in a resistor: P = I² × R. Check it is below the resistor’s rating (often ¼ W).","Energy: E = P × t. Battery energy in Wh = volts × amp-hours.","More power = more heat. Hot parts need bigger size or heat sinks."],
game:{type:"calc",problems:[{q:"A motor uses 12 V and 2 A. What is its power?",a:24,unit:"W",hint:"P = V × I"},{q:"An LED circuit uses 5 V and 0.02 A. Power?",a:0.1,unit:"W",tol:0.005,hint:"P = 5 × 0.02"},{q:"0.1 A flows through a 100 Ω resistor. How many watts of heat? (Is it OK for a ¼ W resistor?)",a:1,unit:"W",hint:"P = I² × R = 0.1 × 0.1 × 100",how:"1 W is four times too much for a ¼ W resistor. It would burn."},{q:"A battery is 11.1 V and 2.2 Ah. How much energy does it store?",a:24.42,unit:"Wh",hint:"E = V × Ah"}]},
quiz:[{q:"Power is calculated with…",o:["P = V × I","P = V + I","P = V − I"],why:"Watts = volts × amps."},
{q:"What happens to a resistor that gets too much power?",o:["It gets hot and can burn","It gets cold","It becomes a capacitor"],why:"Power in a resistor becomes heat."},
{q:"Battery energy is often given in…",o:["Watt-hours (Wh)","Ohms","Hertz"],why:"Wh tells you how much energy is stored."}]},

{t:"Series, parallel and voltage dividers",
story:`<p>Parts can be joined in two ways. In <b>series</b>, they are in one line, like train carriages. The same current goes through all of them, and the voltage is shared. Total resistance adds up: <span class="f">R = R1 + R2</span>.</p>
<p>In <b>parallel</b>, they sit side by side, like lanes on a road. Each gets the same voltage, and the current is shared. Total resistance goes <i>down</i>: <span class="f">1/R = 1/R1 + 1/R2</span>. Two equal resistors in parallel give half the resistance.</p>
<p>Two resistors in series make a <b>voltage divider</b>: <span class="f">Vout = Vin × R2 ÷ (R1 + R2)</span>. Robots use it to read sensors and to drop 5 V signals to 3.3 V. Two helpful rules from Kirchhoff: current flowing into a junction equals current flowing out (KCL), and voltages around any loop add up to zero (KVL).</p>`,
points:["Series: same current, voltages add up, R_total = R1 + R2.","Parallel: same voltage, currents add up, 1/R_total = 1/R1 + 1/R2.","Voltage divider: Vout = Vin × R2 ÷ (R1 + R2).","KCL: current in = current out at any junction.","KVL: all voltage rises and drops around a loop add up to zero."],
game:{type:"divider"},
quiz:[{q:"Two 100 Ω resistors in series give…",o:["200 Ω","50 Ω","100 Ω"],why:"In series, resistances add."},
{q:"Two 100 Ω resistors in parallel give…",o:["50 Ω","200 Ω","10 000 Ω"],why:"Equal resistors in parallel give half."},
{q:"A divider with R1 = R2 and Vin = 5 V gives…",o:["2.5 V","5 V","10 V"],why:"Equal resistors split the voltage in half."}]},

{t:"DC, AC, ground and short circuits",
story:`<p><b>DC</b> (direct current) flows one way, steadily. Batteries give DC. Robots run on DC. <b>AC</b> (alternating current) keeps changing direction. Wall sockets in India give AC at <b>230 V, 50 times a second (50 Hz)</b>. That is dangerous. A phone charger or adapter turns it into safe, low-voltage DC.</p>
<p><b>Ground (GND)</b> is the 0 V reference: the point we measure all voltages from. Every part in a robot must share the same ground, or signals make no sense. This is the number one beginner bug!</p>
<p>A <b>short circuit</b> is when + touches − with almost no resistance. A huge current flows, wires get hot, batteries can catch fire. A <b>fuse</b> is a thin wire that melts on purpose to stop it.</p>`,
points:["DC flows one way (batteries). AC changes direction (wall socket).","India’s mains: 230 V AC, 50 Hz. Never touch it.","GND is the 0 V reference. All parts must share a common ground.","Short circuit = almost zero resistance = huge, dangerous current.","Fuses and polyfuses protect circuits from too much current."],
game:{type:"bins",bins:["DC","AC"],items:[["AA battery",0],["Phone power bank output",0],["Wall socket at home",1],["Arduino 5V pin",0],["Solar panel output",0,"Solar panels make DC."],["Ceiling fan supply at home",1],["LiPo drone battery",0],["Power lines on the street",1]]},
quiz:[{q:"Which kind of current comes from a battery?",o:["DC","AC","Both at once"],why:"Batteries give direct current."},
{q:"Your sensor and Arduino have separate grounds that are not connected. What happens?",o:["Readings make no sense; they need a common ground","It works better","The sensor gets faster"],why:"Voltage is measured relative to ground, so grounds must be joined."},
{q:"A fuse is used to…",o:["Melt and break the circuit if current gets too high","Store energy","Make AC"],why:"It sacrifices itself to protect the circuit."}]},

{t:"Using a multimeter",
story:`<p>A <b>multimeter</b> is an engineer’s magic magnifying glass. The black probe goes in <b>COM</b>. The red probe goes in <b>V/Ω</b> for most jobs.</p>
<p>To measure <b>voltage</b>, touch the probes <i>across</i> the part (in parallel) while the circuit is ON. To measure <b>resistance</b>, the circuit must be OFF, then touch across the part. To measure <b>current</b>, the meter must be <i>in the loop</i> (in series), using the A or mA socket, so the current flows through the meter. The <b>continuity</b> mode beeps when two points are connected. It is perfect for finding broken wires.</p>`,
points:["Voltage: across the part, power ON.","Current: in series (break the loop), red probe in the A or mA socket.","Resistance: power OFF, probes across the part.","Continuity: beeps if two points are connected.","Never measure voltage with the probe in the A socket. That shorts the circuit."],
game:{type:"match",pairs:[["Measure voltage","Probes across the part, power ON"],["Measure current","Meter in series inside the loop"],["Measure resistance","Power OFF, probes across the part"],["Continuity mode","Beeps if two points are connected"],["COM socket","Where the black probe goes"]]},
quiz:[{q:"To measure current, the meter goes…",o:["In series, so the current flows through it","Across the battery","Anywhere"],why:"The current must pass through the meter."},
{q:"To measure resistance, the circuit should be…",o:["Switched OFF","Switched ON","Wet"],why:"The meter uses its own small battery. Outside power gives wrong readings."},
{q:"Which mode helps you find a broken wire quickly?",o:["Continuity (beep)","AC voltage","Temperature"],why:"If it beeps, the wire is connected end to end."}]}
]});

/* ---------------- WORLD 3 ---------------- */
W({title:"Electronic Parts",tag:"Resistors, capacitors, diodes, transistors, MOSFETs, logic.",badge:"Circuit Builder",level:"Beginner",
desc:"Meet the small parts that make every robot circuit work. You will read resistor codes, switch big motors with tiny signals, and think in 0s and 1s.",
lessons:[
{t:"Resistors and the colour code",
story:`<p>Resistors are tiny, so their value is painted on as <b>coloured bands</b>. Each colour is a number: Black 0, Brown 1, Red 2, Orange 3, Yellow 4, Green 5, Blue 6, Violet 7, Grey 8, White 9.</p>
<p>Read from the end that does not have the gold band. The first two bands are digits. The third is the <b>multiplier</b>: how many zeros to add. The last band is the <b>tolerance</b>: gold means ±5%. Example: Red Red Brown = 2, 2, one zero = <b>220 Ω</b>.</p>
<p>A rhyme helps remember the order: “<b>B</b>B <b>R</b>O<b>Y</b> of <b>G</b>reat <b>B</b>ritain had a <b>V</b>ery <b>G</b>ood <b>W</b>ife” (Black Brown Red Orange Yellow Green Blue Violet Grey White).</p>`,
points:["Band 1 and 2 = digits. Band 3 = multiplier (number of zeros). Last band = tolerance.","Gold = ±5%, silver = ±10%.","Resistors limit current, divide voltage, and pull pins up or down.","Power rating matters too: small ones handle ¼ W."],
game:{type:"rescode"},
quiz:[{q:"Brown Black Orange is…",o:["10 kΩ","103 Ω","1 kΩ"],why:"1, 0, then three zeros = 10 000 Ω = 10 kΩ."},
{q:"What does a gold band mean?",o:["±5% tolerance","×1000","It is broken"],why:"Gold is the tolerance band, ±5%."},
{q:"Yellow Violet Red is…",o:["4.7 kΩ","47 Ω","472 kΩ"],why:"4, 7, then two zeros = 4700 Ω."}]},

{t:"Capacitors",
story:`<p>A <b>capacitor</b> is like a tiny bucket that fills with charge and empties very fast. Its size is measured in <b>farads (F)</b>. Real ones are small: microfarads (µF), nanofarads (nF) and picofarads (pF).</p>
<p>Robots use them to <b>smooth power</b>. When a motor suddenly grabs current, the capacitor quickly gives some back, so the voltage does not dip. A small <b>100 nF decoupling capacitor</b> sits next to every chip for this reason.</p>
<p>Capacitors also make <b>timers</b>. Through a resistor, a capacitor fills in a predictable time: <span class="f">τ = R × C</span>. After 1 τ it is about 63% full. After 5 τ it is basically full. Careful: <b>electrolytic</b> capacitors have + and − legs. The stripe marks −. Put them in backwards and they can pop!</p>`,
points:["Capacitors store and release charge quickly.","Units: 1 µF = 1000 nF = 1 000 000 pF.","Decoupling: put 100 nF close to each chip’s power pins.","Time constant τ = R × C (seconds = ohms × farads).","Electrolytic capacitors are polarised. Long leg is +, stripe side is −."],
game:{type:"calc",problems:[{q:"R = 10 kΩ and C = 100 µF. What is τ?",a:1,unit:"s",hint:"τ = 10 000 × 0.0001"},{q:"R = 1 kΩ and C = 1000 µF. What is τ?",a:1,unit:"s",hint:"τ = 1000 × 0.001"},{q:"R = 4.7 kΩ and C = 10 µF. What is τ in milliseconds?",a:47,unit:"ms",hint:"4700 × 0.00001 = 0.047 s"},{q:"With τ = 1 s, about how many seconds until the capacitor is basically full (5 τ)?",a:5,unit:"s"}]},
quiz:[{q:"A capacitor is most like…",o:["A tiny, fast bucket of charge","A one-way valve","A light bulb"],why:"It fills and empties with charge."},
{q:"Why put a 100 nF capacitor next to a chip?",o:["To smooth small dips in its power","To make it heavier","To change its colour"],why:"Decoupling capacitors keep the chip’s supply steady."},
{q:"What happens if an electrolytic capacitor goes in backwards?",o:["It can overheat and pop","Nothing at all","It becomes a resistor"],why:"Electrolytics are polarised. Always check the stripe."}]},

{t:"Diodes and LEDs",
story:`<p>A <b>diode</b> is a one-way door for current. It lets current flow from the <b>anode</b> (+) to the <b>cathode</b> (−, the side with the stripe), and blocks it the other way. A silicon diode “uses up” about <b>0.7 V</b> when it conducts. This is its <b>forward voltage</b>.</p>
<p>Diodes protect robots. A diode in the power line stops damage if someone plugs the battery in backwards. A <b>flyback diode</b> across a motor or relay coil swallows the big voltage spike made when the coil is switched off.</p>
<p>An <b>LED</b> is a light-emitting diode. The long leg is the anode (+). Red LEDs need about 2 V, blue and white about 3 V. An LED always needs a resistor. A <b>Zener diode</b> is special: in reverse it holds a fixed voltage, like 5.1 V.</p>`,
points:["Current flows anode (+) → cathode (−). The stripe marks the cathode.","Silicon diode forward voltage ≈ 0.7 V. LEDs ≈ 2–3 V.","Flyback diode: across motors and relay coils to absorb spikes.","Reverse-polarity diode: protects against a backwards battery.","LED: long leg +, always with a series resistor."],
game:{type:"match",pairs:[["Anode","The + side; the long leg of an LED"],["Cathode","The − side; marked with a stripe"],["Forward voltage","Voltage a diode uses up (≈0.7 V, LED ≈2 V)"],["Flyback diode","Protects from motor and coil voltage spikes"],["Zener diode","Holds a fixed voltage in reverse"]]},
quiz:[{q:"A diode is like…",o:["A one-way door for current","A battery","A spring"],why:"It only lets current pass in one direction."},
{q:"Which leg of an LED is positive (anode)?",o:["The longer leg","The shorter leg","Both"],why:"Long leg = anode = +."},
{q:"Why put a diode across a motor?",o:["To absorb the voltage spike when it switches off","To make it spin faster","To measure speed"],why:"Coils kick back a spike. The flyback diode safely absorbs it."}]},

{t:"Transistors: small current controls big current",
story:`<p>An Arduino pin can only give about <b>20 mA</b> (40 mA is the absolute maximum). A motor needs maybe <b>500 mA</b>. If you connect the motor straight to the pin, you will damage the Arduino. We need a helper: the <b>transistor</b>.</p>
<p>A transistor is like a water tap. A tiny turn of the handle controls a big flow. An <b>NPN BJT</b> transistor has three legs: <b>Base</b> (the handle), <b>Collector</b> and <b>Emitter</b> (the big flow path). A small current into the base lets a big current flow from collector to emitter. The gain (β, often around 100) says how much bigger: <span class="f">Ic = β × Ib</span>.</p>
<p>Always put a resistor (about 1 kΩ) in front of the base. When fully ON, the transistor is “saturated” and works as a switch. Used half way, it works as an <b>amplifier</b>.</p>`,
points:["Never drive a motor straight from a microcontroller pin.","NPN legs: Collector, Base, Emitter. Small base current → big collector current.","Ic = β × Ib (β is often 50 to 300).","Base resistor: Rb = (V_pin − 0.7) ÷ Ib.","Low-side switch: transistor between the load and GND."],
code:{lang:"cpp",src:`
// Motor through an NPN transistor on pin 9
const int MOTOR_PIN = 9;   // goes to the base through a 1 kOhm resistor

void setup() {
  pinMode(MOTOR_PIN, OUTPUT);
}

void loop() {
  digitalWrite(MOTOR_PIN, HIGH);  // transistor ON: motor spins
  delay(2000);
  digitalWrite(MOTOR_PIN, LOW);   // transistor OFF: motor stops
  delay(2000);
}`,note:"Remember the flyback diode across the motor."},
game:{type:"calc",problems:[{q:"Pin gives 5 V, base resistor is 1 kΩ, base-emitter drop is 0.7 V. Base current in mA?",a:4.3,unit:"mA",hint:"Ib = (5 − 0.7) ÷ 1000 A"},{q:"β = 100 and base current is 4.3 mA. Maximum collector current in mA?",a:430,unit:"mA",hint:"Ic = β × Ib"},{q:"You want Ib = 5 mA from a 3.3 V pin. Base resistor in ohms?",a:520,unit:"Ω",tol:15,hint:"Rb = (3.3 − 0.7) ÷ 0.005"}]},
quiz:[{q:"Why can’t an Arduino pin run a motor directly?",o:["The pin can only give about 20 mA","Motors only work on AC","Pins are too cold"],why:"Motors need far more current than a pin can supply."},
{q:"In an NPN transistor, which leg is the “tap handle”?",o:["Base","Collector","Emitter"],why:"A small base current controls the big current."},
{q:"If β = 100 and Ib = 2 mA, then Ic can be up to…",o:["200 mA","2 mA","102 mA"],why:"Ic = β × Ib = 100 × 2 mA."}]},

{t:"MOSFETs and relays",
story:`<p>A <b>MOSFET</b> is a better switch for big currents. Instead of base current, it is controlled by <b>voltage</b> on its <b>Gate</b>. Its other legs are <b>Drain</b> and <b>Source</b>. Almost no current goes into the gate, and when ON it has tiny resistance, so it stays cool. Choose a <b>logic-level</b> MOSFET (like IRLZ44N) that turns fully ON with 5 V or 3.3 V. Add a 10 kΩ pull-down resistor from gate to ground so it stays OFF at start-up.</p>
<p>A <b>relay</b> is a switch moved by an electromagnet. You hear it click. It fully separates (isolates) the control side from the load side, so it can switch big or AC loads. But it is slow, wears out, and needs a transistor and flyback diode to drive its coil. An <b>optocoupler</b> isolates signals using light inside a chip.</p>`,
points:["MOSFET: voltage-controlled (Gate), very efficient, fast enough for PWM.","Use logic-level MOSFETs with microcontrollers. Add a gate pull-down resistor.","Relay: mechanical switch moved by a coil; isolates circuits; slow; clicks.","Relay coils need a driver transistor and a flyback diode.","Optocoupler: isolates two circuits using light."],
game:{type:"bins",bins:["Use a MOSFET","Use a relay"],items:[["Fast PWM speed control of a motor",0],["Dimming an LED strip",0],["Switching a 230 V lamp (with an adult’s help)",1],["Silent switching thousands of times per second",0],["Fully separating two circuits with a metal contact",1],["Turning a water pump on once an hour from mains power",1]]},
quiz:[{q:"A MOSFET is controlled by…",o:["Voltage on the gate","Light from the sun","The colour of the wire"],why:"Gate voltage turns it ON and OFF."},
{q:"Why can’t you use a relay for PWM motor speed control?",o:["It is too slow and would wear out","It is too quiet","It has no coil"],why:"Relays are mechanical; PWM needs hundreds of switches per second."},
{q:"What does “logic-level” MOSFET mean?",o:["It turns fully ON with 3.3–5 V on the gate","It works only with logic gates","It is made of wood"],why:"Normal MOSFETs may need about 10 V on the gate."}]},

{t:"Breadboards, schematics and soldering",
story:`<p>A <b>breadboard</b> has hidden metal strips. Each short row of 5 holes is connected together. The long <b>power rails</b> along the sides are connected along their length. Use them for + and GND. The gap in the middle is where chips (ICs) sit, so their two sides are not joined.</p>
<p>Engineers draw circuits as <b>schematics</b> using symbols: a zigzag for a resistor, long and short lines for a battery, a triangle with arrows for an LED, three short lines for ground. Use <b>red</b> wires for + and <b>black</b> for GND. Your future self will thank you.</p>
<p>When <b>soldering</b>, heat the joint (the pad and the wire) for a second or two, then feed solder into the joint, not onto the iron. A good joint is shiny and shaped like a small cone. A dull, lumpy one is a <b>cold joint</b>. It may fail later.</p>`,
points:["Breadboard rows of 5 are joined. Power rails run along the sides.","Chips straddle the middle gap.","Schematics are maps of a circuit using symbols.","Colour code: red = +, black = GND.","Good solder joint: shiny cone. Cold joint: dull, lumpy, unreliable."],
game:{type:"match",pairs:[["Breadboard row","5 holes connected together"],["Power rail","Long strip along the side for + and GND"],["Centre gap","Where chips sit across"],["Good solder joint","Shiny, smooth cone"],["Cold joint","Dull and lumpy, a weak connection"],["Red wire","Usually positive (+)"],["Black wire","Usually ground (GND)"]]},
quiz:[{q:"On a breadboard, which holes are connected?",o:["The 5 holes in each short row","Every hole on the board","No holes at all"],why:"Each short row is one hidden metal strip."},
{q:"When soldering you should…",o:["Heat the joint, then feed solder into it","Melt solder on the iron and drip it","Blow on it while melting"],why:"Heating the joint makes the solder flow and bond."},
{q:"A schematic is…",o:["A drawing of a circuit using symbols","A type of battery","A robot game"],why:"It is the circuit’s map."}]},

{t:"Digital, analog and binary",
story:`<p>A dimmer knob can be at any position. That is <b>analog</b>: any value. A light switch is ON or OFF. That is <b>digital</b>: just 1 or 0.</p>
<p>Computers think in digital. On an Arduino Uno, <b>HIGH</b> (1) is about 5 V and <b>LOW</b> (0) is 0 V. On an ESP32, HIGH is 3.3 V. Each 0 or 1 is a <b>bit</b>. Eight bits make a <b>byte</b>, which can count from 0 to 255.</p>
<p><b>Binary</b> counts with only 0 and 1. Each place is worth double the one to its right: 8, 4, 2, 1. So <span class="f">1011 = 8 + 0 + 2 + 1 = 11</span>. With n bits you can make <span class="f">2ⁿ</span> different values. Engineers also use <b>hexadecimal</b> (base 16, digits 0–9 and A–F). 0xFF = 255.</p>`,
points:["Analog = any value. Digital = only 0 or 1.","Logic levels: HIGH ≈ 5 V or 3.3 V, LOW ≈ 0 V.","1 byte = 8 bits = 0 to 255.","Binary place values: …, 16, 8, 4, 2, 1.","n bits give 2ⁿ values. 10 bits give 1024."],
game:{type:"calc",problems:[{q:"What is binary 0101 in normal numbers?",a:5,tol:0,hint:"4 + 1"},{q:"What is binary 1111?",a:15,tol:0,hint:"8 + 4 + 2 + 1"},{q:"What is binary 11111111 (one full byte)?",a:255,tol:0},{q:"How many different values can 10 bits store?",a:1024,tol:0,hint:"2 to the power 10"},{q:"What is hexadecimal 0x10 in normal numbers?",a:16,tol:0,hint:"Each hex place is worth 16."}]},
quiz:[{q:"A light switch (ON or OFF) is…",o:["Digital","Analog","Neither"],why:"Only two states: 1 or 0."},
{q:"How many bits are in a byte?",o:["8","2","16"],why:"8 bits = 1 byte."},
{q:"Binary 1000 equals…",o:["8","1000","4"],why:"The 1 is in the 8s place."}]},

{t:"Logic gates",
story:`<p>Inside every chip are tiny decision makers called <b>logic gates</b>. They take 0s and 1s in and give a 0 or 1 out.</p>
<p><b>AND</b>: output is 1 only if A <i>and</i> B are both 1 (both buttons pressed). <b>OR</b>: 1 if A <i>or</i> B is 1 (either bumper hit). <b>NOT</b>: flips the input. <b>XOR</b>: 1 if the inputs are <i>different</i>. <b>NAND</b> and <b>NOR</b> are AND and OR followed by NOT.</p>
<p>A table of all inputs and outputs is a <b>truth table</b>. Fun fact: you can build <i>any</i> logic, even a whole computer, using only NAND gates. Robots use logic everywhere: “IF left bumper OR right bumper is hit, THEN stop.”</p>`,
points:["AND: both. OR: either. NOT: flip. XOR: different.","NAND = NOT AND. NOR = NOT OR.","A truth table lists every input combination and the output.","NAND alone can build every other gate (it is “universal”).","Chips like 74HC08 (AND) and 74HC00 (NAND) contain several gates."],
code:{lang:"cpp",src:`
// Logic in code: && is AND, || is OR, ! is NOT
bool leftHit  = digitalRead(2) == LOW;
bool rightHit = digitalRead(3) == LOW;

if (leftHit || rightHit) {     // OR
  stopMotors();
}
if (leftHit && rightHit) {     // AND
  reverse();                   // hit straight on
}`},

quiz:[{q:"AND gives 1 when…",o:["Both inputs are 1","Any input is 1","Both inputs are 0"],why:"AND needs both."},
{q:"XOR gives 1 when…",o:["The inputs are different","The inputs are the same","Always"],why:"Exclusive OR: one or the other, not both."},
{q:"In Arduino code, which symbol means OR?",o:["||","&&","!"],why:"|| is OR, && is AND, ! is NOT."}]}
]});
